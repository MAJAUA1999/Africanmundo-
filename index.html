<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>AfricanMundo</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="top">
    🌍 AfricanMundo
  </div>
</header>

<main>

  <section class="news-section">
    <div class="section-title">
      <h2>🌍 Notícias</h2>
      <span>Ver todas</span>
    </div>

    <div id="noticias" class="news-grid">
      <p>Carregando notícias...</p>
    </div>
  </section>

  <section class="news-section">
    <div class="section-title">
      <h2>⚽ Futebol</h2>
      <span>Ver todos</span>
    </div>

    <div id="futebol" class="news-grid">
      <p>Carregando...</p>
    </div>
  </section>

  <section class="news-section">
    <div class="section-title">
      <h2>🇲🇿 Moçambique</h2>
      <span>Ver todos</span>
    </div>

    <div id="mocambique" class="news-grid">
      <p>Carregando...</p>
    </div>
  </section>

  <section class="news-section">
    <div class="section-title">
      <h2>🌍 África</h2>
      <span>Ver todos</span>
    </div>

    <div id="africa" class="news-grid">
      <p>Carregando...</p>
    </div>
  </section>

  <section class="news-section">
    <div class="section-title">
      <h2>💼 Negócios</h2>
      <span>Ver todos</span>
    </div>

    <div id="negocios" class="news-grid">
      <p>Carregando...</p>
    </div>
  </section>

  <section class="news-section">
    <div class="section-title">
      <h2>🎬 Entretenimento</h2>
      <span>Ver todos</span>
    </div>

    <div id="entretenimento" class="news-grid">
      <p>Carregando...</p>
    </div>
  </section>

  <section class="news-section">
    <div class="section-title">
      <h2>🏆 Desporto</h2>
      <span>Ver todos</span>
    </div>

    <div id="desporto" class="news-grid">
      <p>Carregando...</p>
    </div>
  </section>

</main>

<script>

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function esc(text) {

  return String(text || "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}


function criarNoticia(noticia) {

  return `
    <article class="post-item">

      <div class="post-image">
        🌍
      </div>

      <div class="post-content">

        <small>
          ${esc(noticia.categoria || "Notícias")}
        </small>

        <h3>
          ${esc(noticia.titulo)}
        </h3>

        <p>
          ${esc(noticia.texto)}
        </p>

      </div>

    </article>
  `;

}


async function carregarNoticias() {

  const { data, error } = await supabaseClient
    .from("noticias")
    .select("*")
    .order("id", { ascending: false });


  if (error) {

    console.error("Erro Supabase:", error);

    document.getElementById("noticias").innerHTML =
      "<p>Não foi possível carregar as notícias.</p>";

    return;

  }


  document.getElementById("noticias").innerHTML = "";
  document.getElementById("futebol").innerHTML = "";
  document.getElementById("mocambique").innerHTML = "";
  document.getElementById("africa").innerHTML = "";
  document.getElementById("negocios").innerHTML = "";
  document.getElementById("entretenimento").innerHTML = "";
  document.getElementById("desporto").innerHTML = "";


  if (!data || data.length === 0) {

    document.getElementById("noticias").innerHTML =
      "<p>Ainda não existem notícias publicadas.</p>";

    return;

  }


  data.forEach(function(noticia) {

    const categoria =
      String(noticia.categoria || "Notícias")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "");


    const html = criarNoticia(noticia);


    if (categoria === "noticias") {

      document.getElementById("noticias")
        .insertAdjacentHTML("beforeend", html);

    }

    else if (categoria === "futebol") {

      document.getElementById("futebol")
        .insertAdjacentHTML("beforeend", html);

    }

    else if (categoria === "mocambique") {

      document.getElementById("mocambique")
        .insertAdjacentHTML("beforeend", html);

    }

    else if (categoria === "africa") {

      document.getElementById("africa")
        .insertAdjacentHTML("beforeend", html);

    }

    else if (categoria === "negocios") {

      document.getElementById("negocios")
        .insertAdjacentHTML("beforeend", html);

    }

    else if (categoria === "entretenimento") {

      document.getElementById("entretenimento")
        .insertAdjacentHTML("beforeend", html);

    }

    else if (categoria === "desporto") {

      document.getElementById("desporto")
        .insertAdjacentHTML("beforeend", html);

    }

    else {

      document.getElementById("noticias")
        .insertAdjacentHTML("beforeend", html);

    }

  });


  const categorias = [
    "noticias",
    "futebol",
    "mocambique",
    "africa",
    "negocios",
    "entretenimento",
    "desporto"
  ];


  categorias.forEach(function(id) {

    const elemento =
      document.getElementById(id);

    if (!elemento.innerHTML.trim()) {

      elemento.innerHTML =
        "<p>Nenhuma notícia publicada nesta categoria.</p>";

    }

  });

}


carregarNoticias();

</script>

</body>
</html>
