/* =========================================
   BASE
========================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: #f4f4f4;
  color: #111;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

a {
  color: inherit;
}


/* =========================================
   TOPO
========================================= */

.top-info {
  background: #050505;
  color: #ddd;
  font-size: 12px;
  padding: 8px 15px;
}

.top-info-inner {
  max-width: 1200px;
  margin: auto;

  display: flex;
  justify-content: space-between;
  align-items: center;

  gap: 15px;
}

.top-links {
  display: flex;
  gap: 18px;
}

.top-links a {
  color: #fff;
  text-decoration: none;
}


/* =========================================
   CABEÇALHO
========================================= */

header {
  background: #050505;
  color: #fff;
}

.header-main {
  max-width: 1200px;
  margin: auto;

  min-height: 105px;

  padding: 18px 15px;

  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 25px;
}


/* =========================================
   LOGÓTIPO
========================================= */

.logo {
  display: flex;
  align-items: center;

  gap: 5px;

  font-size: 38px;
  font-weight: 900;

  letter-spacing: -2px;

  white-space: nowrap;
}

.logo-globe {
  font-size: 35px;

  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.logo-african {
  color: #fff;
}

.logo-mundo {
  color: #45c226;
}

.tagline {
  margin-top: 5px;

  color: #ddd;

  font-size: 13px;
}


/* =========================================
   PUBLICIDADE TOPO
========================================= */

.advertising-top {
  flex: 1;

  max-width: 610px;

  min-height: 75px;

  border: 1px solid #1c4320;

  border-radius: 4px;

  background:
    linear-gradient(
      90deg,
      #071008,
      #101f12,
      #071008
    );

  display: flex;
  align-items: center;
  justify-content: center;

  text-align: center;

  padding: 10px;
}

.advertising-top strong {
  display: block;

  color: #45c226;

  font-size: 25px;
}

.advertising-top small {
  color: #ddd;

  font-size: 13px;
}


/* =========================================
   MENU PRINCIPAL
========================================= */

.nav {
  background: #151515;

  border-top: 1px solid #292929;
  border-bottom: 1px solid #292929;
}

.nav-inner {
  max-width: 1200px;

  margin: auto;

  display: flex;

  overflow-x: auto;

  scrollbar-width: none;
}

.nav-inner::-webkit-scrollbar {
  display: none;
}

.nav a {
  color: #fff;

  text-decoration: none;

  padding: 15px 20px;

  font-size: 13px;

  font-weight: 800;

  white-space: nowrap;
}

.nav a:hover,
.nav a.active {
  background: #45c226;
}


/* =========================================
   BARRA DE FERRAMENTAS
========================================= */

.tools-bar {
  background: #fff;

  border-bottom: 1px solid #ddd;

  padding: 8px 10px;
}

.tools-inner {
  max-width: 1200px;

  margin: auto;

  display: flex;

  justify-content: flex-end;

  align-items: center;

  gap: 8px;
}

.tool-button {
  border: 1px solid #ddd;

  background: #fff;

  color: #222;

  border-radius: 6px;

  min-width: 42px;
  height: 38px;

  padding: 0 10px;

  cursor: pointer;

  font-size: 18px;
}

.tool-button span {
  font-size: 11px;

  font-weight: 800;

  margin-left: 3px;
}

.tool-button:hover {
  border-color: #45c226;

  color: #45c226;
}


/* =========================================
   NOTIFICAÇÃO
========================================= */

.notification-button {
  position: relative;
}

.notification-badge {
  position: absolute;

  top: -5px;
  right: -4px;

  min-width: 18px;
  height: 18px;

  padding: 0 4px;

  border-radius: 20px;

  background: #e00000;

  color: #fff;

  font-size: 10px;

  font-weight: 900;

  display: flex;

  align-items: center;
  justify-content: center;
}


/* =========================================
   PAINEL DE FERRAMENTAS
========================================= */

.tools-panel {
  display: none;

  max-width: 1200px;

  margin: 10px auto;

  padding: 15px;

  background: #fff;

  border: 1px solid #ddd;

  border-radius: 8px;
}

.tools-panel.show {
  display: block;
}

.tools-panel h3 {
  margin: 0 0 12px;

  font-size: 16px;
}

.tools-options {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 8px;
}

.tools-option {
  border: 1px solid #ddd;

  background: #f8f8f8;

  padding: 12px;

  border-radius: 6px;

  cursor: pointer;

  font-size: 12px;

  font-weight: 800;
}

.tools-option:hover {
  border-color: #45c226;

  background: #f0faed;
}


/* =========================================
   PAINEL EU
========================================= */

.user-panel {
  display: none;

  max-width: 1200px;

  margin: 10px auto;

  padding: 15px;

  background: #fff;

  border: 1px solid #ddd;

  border-radius: 8px;
}

.user-panel.show {
  display: block;
}

.user-panel h3 {
  margin: 0 0 8px;

  font-size: 17px;
}

.user-panel p {
  margin: 5px 0;

  color: #666;

  font-size: 13px;
}


/* =========================================
   PESQUISA
========================================= */

.search-area {
  background: #fff;

  border-bottom: 1px solid #ddd;

  padding: 18px 12px;
}

.search-box {
  max-width: 1200px;

  margin: auto;
}

.search-title {
  margin: 0 0 10px;

  font-size: 18px;

  font-weight: 900;
}

.search-form {
  display: flex;

  gap: 8px;
}

.search-input {
  flex: 1;

  min-width: 0;

  height: 46px;

  border: 1px solid #ccc;

  border-radius: 5px;

  padding: 0 14px;

  font-size: 15px;

  outline: none;
}

.search-input:focus {
  border-color: #45c226;

  box-shadow:
    0 0 0 2px
    rgba(69,194,38,.12);
}

.search-button {
  border: 0;

  background: #45c226;

  color: #fff;

  border-radius: 5px;

  padding: 0 20px;

  font-size: 13px;

  font-weight: 900;

  cursor: pointer;
}

.search-button:hover {
  background: #369c20;
}


/* =========================================
   ATALHOS
========================================= */

.quick-links {
  max-width: 1200px;

  margin: 12px auto 0;

  display: grid;

  grid-template-columns:
    repeat(6, 1fr);

  gap: 8px;
}

.quick-link {
  min-height: 68px;

  border: 1px solid #e0e0e0;

  border-radius: 8px;

  background: #fff;

  text-decoration: none;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 5px;
}

.quick-icon {
  width: 32px;
  height: 32px;

  border-radius: 50%;

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 17px;

  font-weight: 900;
}

.quick-name {
  font-size: 10px;

  font-weight: 800;

  color: #333;
}

.google-icon {
  background: #fff;

  border: 1px solid #ddd;

  color: #4285f4;
}

.facebook-icon {
  background: #1877f2;

  color: #fff;
}

.youtube-icon {
  background: #f00;

  color: #fff;

  border-radius: 8px;
}

.whatsapp-icon {
  background: #25d366;

  color: #fff;
}

.instagram-icon {
  color: #fff;

  background:
    linear-gradient(
      135deg,
      #833ab4,
      #fd1d1d,
      #fcb045
    );
}

.tiktok-icon {
  background: #111;

  color: #fff;
}


/* =========================================
   FIM DA PARTE 1
========================================= */
  /* =========================================
   RESULTADOS DA PESQUISA
========================================= */

.search-results {
  max-width: 1200px;
  margin: 15px auto 0;
  display: none;
}

.search-results.show {
  display: block;
}

.search-results-title {
  margin: 0 0 10px;
  padding-bottom: 8px;
  border-bottom: 2px solid #45c226;
  font-size: 17px;
  font-weight: 900;
}

.search-result-item {
  display: grid;
  grid-template-columns: 110px 1fr;
  gap: 12px;
  padding: 10px;
  margin-bottom: 8px;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 5px;
  text-decoration: none;
}

.search-result-image,
.search-result-placeholder {
  width: 110px;
  height: 75px;
  object-fit: cover;
  border-radius: 4px;
  display: block;
}

.search-result-placeholder {
  background: linear-gradient(
    135deg,
    #111,
    #345b29
  );

  display: flex;
  align-items: center;
  justify-content: center;

  color: #fff;
  font-size: 25px;
}

.search-result-category {
  color: #45a52c;
  font-size: 10px;
  font-weight: 900;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.search-result-title {
  margin: 0;
  font-size: 14px;
  line-height: 1.3;
}

.search-result-date {
  margin-top: 5px;
  color: #777;
  font-size: 10px;
}

.search-empty {
  background: #fff;
  padding: 18px;
  border-radius: 5px;
  text-align: center;
  color: #777;
}


/* =========================================
   NOTIFICAÇÕES
========================================= */

.notifications-panel {
  display: none;

  position: fixed;

  top: 60px;
  right: 12px;

  width: min(360px, calc(100vw - 24px));

  max-height: 70vh;

  overflow-y: auto;

  background: #fff;

  border: 1px solid #ddd;

  border-radius: 10px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,.20);

  z-index: 10000;
}

.notifications-panel.show {
  display: block;
}

.notifications-header {
  padding: 14px;

  border-bottom: 1px solid #ddd;

  display: flex;

  justify-content: space-between;

  align-items: center;
}

.notifications-header strong {
  font-size: 15px;
}

.notifications-close {
  border: 0;

  background: transparent;

  font-size: 22px;

  cursor: pointer;
}

.notification-item {
  padding: 13px;

  border-bottom: 1px solid #eee;

  cursor: pointer;
}

.notification-item:hover {
  background: #f7f7f7;
}

.notification-item strong {
  display: block;

  font-size: 13px;

  margin-bottom: 4px;
}

.notification-item small {
  color: #777;

  font-size: 10px;
}

.notifications-empty {
  padding: 25px 15px;

  text-align: center;

  color: #777;

  font-size: 13px;
}


/* =========================================
   CONTEÚDO PRINCIPAL
========================================= */

main {
  max-width: 1200px;

  margin: auto;

  padding: 20px 12px 50px;
}


/* =========================================
   PUBLICIDADE
========================================= */

.advertising {
  min-height: 90px;

  margin: 0 0 20px;

  background:

  text-align: center;

  padding: 15px;

  color: #45c226;

  font-size: 25px;

  margin-bottom: 5px;

/* =========================================
   DESTAQUE + ÚLTIMAS
========================================= */

.hero-layout {
  display: grid;

  grid-template-columns:
    2fr 1fr;

  gap: 20px;

  margin-bottom: 25px;
}


/* =========================================
   DESTAQUE
========================================= */

.hero {
  min-height: 430px;

  border-radius: 5px;

  overflow: hidden;

  position: relative;

  background: #111;

  color: #fff;
}

.hero-image-link {
  display: block;

  width: 100%;
  height: 430px;

  text-decoration: none;
}

.hero-image {
  width: 100%;
  height: 430px;

  object-fit: cover;

  display: block;
}

.hero-no-image {
  width: 100%;
  height: 430px;

  background:
    linear-gradient(
      135deg,
      #111,
      #345b29
    );

  display: flex;

  align-items: center;
  justify-content: center;

  font-size: 70px;
}

.hero-overlay {
  position: absolute;

  left: 0;
  right: 0;
  bottom: 0;

  padding: 25px;

  padding-top: 100px;

  background:
    linear-gradient(
      transparent,
      rgba(0,0,0,.92)

  z-index: 2;
}

.badge {
  display: inline-block;

  background: #45c226;

  color: #fff;

  padding: 6px 9px;

  font-size: 11px;

  font-weight: 800;

  border-radius: 2px;

  margin-bottom: 8px;
}

  font-size: 34px;

  line-height: 1.08;

  margin: 5px 0 10px;
}

.hero h1 a {
  color: #fff;

  text-decoration: none;
}

.hero-text-link {
  color: #eee;

  text-decoration: none;

  display: block;
}

.hero p {
  margin: 0;

  color: #eee;

  font-size: 15px;

  line-height: 1.45;
}

.hero-date {
  margin-top: 12px;

  font-size: 12px;

  color: #ddd;
}


/* =========================================
   ÚLTIMAS NOTÍCIAS
========================================= */

.latest {
  background: #fff;

  padding: 15px;

  border-top: 3px solid #45c226;

  border-radius: 3px;
}

.section-heading {
  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 10px;

  border-bottom: 2px solid #ddd;

  margin-bottom: 12px;

  padding-bottom: 9px;
}

.section-heading h2 {
  font-size: 18px;

  margin: 0;

  text-transform: uppercase;
}

.section-heading a {
  color: #45a52c;

  text-decoration: none;

  font-size: 11px;

  font-weight: 900;

  white-space: nowrap;
}

.latest-item {
  display: grid;

  grid-template-columns:
    125px 1fr;

  gap: 12px;

  padding: 10px 0;

  border-bottom: 1px solid #ddd;
}

.latest-item:last-child {
  border-bottom: 0;
}

.latest-image,
.latest-placeholder {
  width: 125px;
  height: 82px;

  min-width: 125px;
  min-height: 82px;

  border-radius: 3px;

  object-fit: cover;

  background: #ddd;

  display: block;
}

.latest-image-link {
  display: block;

  text-decoration: none;
}

.latest-placeholder {
  background: #333;

  display: flex;

  align-items: center;

  justify-content: center;

  color: #fff;

  font-size: 25px;
}

.latest h3 {
  margin: 0;

  font-size: 14px;

  line-height: 1.3;
}

.latest h3 a {
  text-decoration: none;

  color: inherit;
}

.latest h3 a:hover {
  color: #45a52c;
}

.latest small {
  display: block;

  margin-top: 8px;

  color: #777;

  font-size: 11px;
}


/* =========================================
   CATEGORIAS
========================================= */

.category-section {
  background: #fff;

  padding: 14px;

  margin-bottom: 20px;

  border-radius: 4px;
}

.category-title {
  display: flex;

  align-items: center;

  justify-content: space-between;

.category-title h2 {

.category-title a {

  font-weight: 900;

  white-space: nowrap;
}

.category-grid {
  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 15px;
}

/* =========================================
   ESCAPAR TEXTO
========================================= */

function esc(valor) {

  return String(valor ?? "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}


/* =========================================
   NORMALIZAR CATEGORIA
========================================= */

function normalizarCategoria(valor) {

  return String(valor ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim();

}


/* =========================================
   DATA
========================================= */

function formatarData(valor) {

  if (!valor) {
    return "";
  }

  const data = new Date(valor);

  if (isNaN(data.getTime())) {
    return "";
  }

  return data.toLocaleString(
    "pt-MZ",
    {
      day: "2-digit",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =========================================
   LINK DA NOTÍCIA
========================================= */

function obterLinkNoticia(id) {

  if (
    id === null ||
    id === undefined ||
    id === "" ||
    String(id) === "null"
  ) {
    return "#";
  }

  return (
    "noticia.html?id=" +
    encodeURIComponent(String(id))
  );

}

/* =========================================
   PESQUISAR NOTÍCIAS
========================================= */

function pesquisarNoticias() {

  const input =
    document.getElementById(
      "searchInput"
    );

  const results =
    document.getElementById(
      "searchResults"
    );

  const resultsList =
    document.getElementById(
      "searchResultsList"
    );


  if (
    !input ||
    !results ||
    !resultsList
  ) {
    return;
  }


  const termo =
    String(input.value || "")
      .trim()
      .toLowerCase();


  if (termo === "") {

    results.classList.remove("show");

    resultsList.innerHTML = "";

    return;

  }


  const encontrados =
    todasNoticias.filter(
      function(noticia) {

        const titulo =
          String(
            noticia.titulo ||
            noticia.title ||
            noticia.nome ||
            ""
          ).toLowerCase();

        const texto =
          String(
            noticia.texto ||
            noticia.body ||
            noticia.conteudo ||
            noticia.content ||
            ""
          ).toLowerCase();

        const categoria =
          String(
            noticia.categoria ||
            noticia.category ||
            noticia.cat ||
            ""
          ).toLowerCase();


        return (
          titulo.includes(termo) ||
          texto.includes(termo) ||
          categoria.includes(termo)
        );

      }
    );


  results.classList.add("show");


  if (encontrados.length === 0) {

    resultsList.innerHTML = `
      <div class="search-empty">

        🔎 Nenhuma notícia encontrada
        para "<strong>${esc(input.value)}</strong>".

      </div>
    `;

    return;

  }


  resultsList.innerHTML =
    encontrados
      .map(
        function(noticia) {
          return criarResultadoPesquisa(
            noticia
          );
        }
      )
      .join("");

}

/* =========================================
   INÍCIO DO CARREGAMENTO
========================================= */

async function carregarNoticias() {

  if (ultimas) {

    ultimas.innerHTML = `
      <p class="loading">
        🔄 Carregando notícias...
      </p>
    `;

  }


  Object.keys(categorias).forEach(
    function(nome) {

      const elemento =
        categorias[nome];

      if (elemento) {

        elemento.innerHTML = `
          <p
            class="loading"
            style="grid-column:1/-1;"
          >
            🔄 Carregando...
          </p>
        `;

      }

    }
  );


  try {

    const resultado =
      await supabaseClient
        .from("noticias")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (resultado.error) {

      console.error(
        "Erro Supabase:",
        resultado.error
      );

      mostrarMensagem(
        "ultimas",
        "Erro ao carregar as notícias."
      );

      return;

    }


    const noticias =
      Array.isArray(resultado.data)
        ? resultado.data
        : [];


    todasNoticias =
      noticias;


    console.log(
      "AfricanMundo — notícias recebidas:",
      noticias
    );


    if (noticias.length === 0) {

      mostrarMensagem(
        "ultimas",
        "Ainda não existem notícias publicadas."
      );

      return;

    }


    /* =====================================
       DESTAQUE PRINCIPAL
    ===================================== */

    const principal =
      noticias[0];


    if (destaque) {

      destaque.innerHTML =
        criarDestaque(
          principal
        );

    }


    /* =====================================
       ÚLTIMAS NOTÍCIAS
    ===================================== */

    if (ultimas) {

      ultimas.innerHTML = "";

      noticias
        .slice(0, 5)
        .forEach(
          function(noticia) {

            ultimas.innerHTML +=
              criarUltima(
                noticia
              );

          }
        );

        }
        /* =====================================
       LIMPAR CATEGORIAS
    ===================================== */

    Object.keys(categorias).forEach(
      function(nome) {

        const elemento =
          categorias[nome];

        if (elemento) {
          elemento.innerHTML = "";
        }

      }
    );


    /* =====================================
       DISTRIBUIR AUTOMATICAMENTE
       AS NOTÍCIAS POR CATEGORIA
    ===================================== */

    noticias.forEach(
      function(noticia) {

        const categoria =
          normalizarCategoria(
            noticia.categoria ??
            noticia.category ??
            noticia.cat ??
            ""
          );


        /* FUTEBOL */

        if (
          categoria === "futebol" &&
          categorias.futebol
        ) {

          categorias.futebol.innerHTML +=
            criarCard(noticia);

        }


        /* MOÇAMBIQUE */

        else if (
          categoria === "mocambique" &&
          categorias.mocambique
        ) {

          categorias.mocambique.innerHTML +=
            criarCard(noticia);

        }


        /* ÁFRICA */

        else if (
          categoria === "africa" &&
          categorias.africa
        ) {

          categorias.africa.innerHTML +=
            criarCard(noticia);

        }


        /* NEGÓCIOS */

        else if (
          categoria === "negocios" &&
          categorias.negocios
        ) {

          categorias.negocios.innerHTML +=
            criarCard(noticia);

        }


        /* ENTRETENIMENTO */

        else if (
          categoria === "entretenimento" &&
          categorias.entretenimento
        ) {

          categorias.entretenimento.innerHTML +=
            criarCard(noticia);

        }


        /* DESPORTO */

        else if (
          categoria === "desporto" &&
          categorias.desporto
        ) {

          categorias.desporto.innerHTML +=
            criarCard(noticia);

        }

      }
    );


    /* =====================================
       VERIFICAR CATEGORIAS VAZIAS
    ===================================== */

    Object.keys(categorias).forEach(
      function(nome) {

        const elemento =
          categorias[nome];


        if (
          elemento &&
          elemento.innerHTML.trim() === ""
        ) {

          elemento.innerHTML = `
            <p
              style="
                grid-column:1/-1;
                padding:20px;
                text-align:center;
                color:#777;
              "
            >
              Ainda não existem notícias
              nesta categoria.
            </p>
          `;

        }

      }
    );


    /* =====================================
       ATUALIZAR STATUS
    ===================================== */

    const status =
      document.getElementById(
        "statusNoticias"
      );

    if (status) {

      status.textContent =
        "✓ Notícias atualizadas automaticamente.";

      status.style.display =
        "block";

      setTimeout(
        function() {

          status.style.display =
            "none";

        },
        3000
      );

    }


  }

  catch (erro) {

    console.error(
      "Erro inesperado:",
      erro
    );


    mostrarMensagem(
      "ultimas",
      "Ocorreu um erro ao carregar as notícias."

    Object.keys(categorias).forEach(
      function(nome) {

        "show"
      );

    }

  }
);


/* =========================================
   ATUALIZAÇÃO AUTOMÁTICA
========================================= */

setInterval(
  function() {

    carregarNoticias();

  },
  60000
);


/* =========================================
   INICIAR
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    carregarNoticias();

  }
);
    /* =========================================
   SERVICE WORKER / APLICATIVO
========================================= */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .then(
          function() {

            console.log(
              "AfricanMundo: aplicativo ativado."
            );

          }
        )
        .catch(
          function(erro) {

            console.error(
              "AfricanMundo: erro ao ativar aplicativo:",
              erro
            );

          }
        );

    }
  );

}


/* =========================================
   FINAL
========================================= */

</script>
