<script>


/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



/* ================================
   SEGURANÇA
================================ */

function esc(valor) {

  return String(valor ?? "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}



/* ================================
   NORMALIZAR
================================ */

function normalizarCategoria(valor) {

  return String(valor || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();

}



/* ================================
   CARTÃO DA NOTÍCIA
================================ */

function criarNoticia(noticia) {

  const titulo =
    noticia.titulo ||
    "Sem título";


  const texto =
    noticia.texto ||
    noticia.descricao ||
    "";


  const categoria =
    noticia.categoria ||
    "Notícias";


  const imagem =
    noticia.imagem ||
    noticia.Imagem ||
    noticia.imagem_url ||
    noticia.image_url ||
    "";


  const id =
    noticia.id;


  let imagemHTML = "🌍";


  if (String(imagem).trim() !== "") {

    imagemHTML = `
      <img
        src="${esc(imagem)}"
        alt="${esc(titulo)}"
        style="
          width:100%;
          height:180px;
          object-fit:cover;
          display:block;
        "
        onerror="
          this.style.display='none';
        "
      >
    `;

  }


  let botao = "";


  if (
    id !== null &&
    id !== undefined &&
    String(id).trim() !== "" &&
    String(id).trim() !== "null" &&
    String(id).trim() !== "undefined"
  ) {

    botao = `
      <a
        href="noticia.html?id=${encodeURIComponent(id)}"
        style="
          display:inline-block;
          margin-top:12px;
          padding:11px 16px;
          background:#45c226;
          color:#fff;
          text-decoration:none;
          border-radius:8px;
          font-weight:700;
        "
      >
        📖 Ler mais
      </a>
    `;

  }


  return `

    <article class="news">

      <div class="thumb">

        ${imagemHTML}

      </div>


      <small>
        ${esc(categoria)}
      </small>


      <h3>
        ${esc(titulo)}
      </h3>


      <p>
        ${esc(texto)}
      </p>


      ${botao}

    </article>

  `;

}



/* ================================
   CARREGAR
================================ */

async function carregarNoticias() {

  const secoes = [
    "noticias",
    "futebol",
    "mocambique",
    "africa",
    "negocios",
    "entretenimento",
    "desporto"
  ];


  try {

    const { data, error } =
      await supabaseClient
        .from("noticias")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      console.error(error);

      document
        .getElementById("noticias")
        .innerHTML =
        "<p>❌ Não foi possível carregar as notícias.</p>";

      return;

    }


    secoes.forEach(function(id) {

      const elemento =
        document.getElementById(id);

      if (elemento) {
        elemento.innerHTML = "";
      }

    });


    if (!data || data.length === 0) {

      document
        .getElementById("noticias")
        .innerHTML =
        "<p>📰 Ainda não existem notícias.</p>";

      return;

    }


    data.forEach(function(noticia) {

      const categoria =
        normalizarCategoria(
          noticia.categoria
        );


      let destino = "noticias";


      if (categoria === "futebol") {

        destino = "futebol";

      }

      else if (categoria === "mocambique") {

        destino = "mocambique";

      }

      else if (categoria === "africa") {

        destino = "africa";

      }

      else if (categoria === "negocios") {

        destino = "negocios";

      }

      else if (categoria === "entretenimento") {

        destino = "entretenimento";

      }

      else if (categoria === "desporto") {

        destino = "desporto";

      }


      const elemento =
        document.getElementById(destino);


      if (elemento) {

        elemento.insertAdjacentHTML(
          "beforeend",
          criarNoticia(noticia)
        );

      }

    });


    secoes.forEach(function(id) {

      const elemento =
        document.getElementById(id);


      if (
        elemento &&
        !elemento.innerHTML.trim()
      ) {

        elemento.innerHTML =
          "<p>Nenhuma notícia publicada nesta categoria.</p>";

      }

    });


  }

  catch (erro) {

    console.error(erro);

    document
      .getElementById("noticias")
      .innerHTML =
      "<p>❌ Ocorreu um erro ao carregar.</p>";

  }

}


carregarNoticias();


</script>
