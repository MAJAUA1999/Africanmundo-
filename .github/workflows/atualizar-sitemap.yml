name: Atualizar Sitemap AfricanMundo

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

  permissions:
  contents: write

jobs:
  atualizar-sitemap:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar sitemap
        env:
          SUPABASE_URL: "https://sonzwfhepjfvzltuxxne.supabase.co"
          SUPABASE_KEY: "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf"

        run: |

          python3 <<'PY'

          import os
          import json
          import urllib.request
          from xml.sax.saxutils import escape

          SUPABASE_URL = os.environ["SUPABASE_URL"]
          SUPABASE_KEY = os.environ["SUPABASE_KEY"]

          headers = {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
          }

          noticias = []

          inicio = 0
          limite = 1000

          while True:

              url = (
                  SUPABASE_URL
                  + "/rest/v1/noticias"
                  + "?select=id"
                  + "&order=id.desc"
                  + f"&offset={inicio}"
                  + f"&limit={limite}"
              )

              request = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(request) as resposta:
                  dados = json.loads(
                      resposta.read().decode("utf-8")
                  )

              if not dados:
                  break

              noticias.extend(dados)

              if len(dados) < limite:
                  break

              inicio += limite

          urls = []

          # Página inicial
          urls.append(
              "https://majaua1999.github.io/Africanmundo-/"
          )

          # Categorias
          categorias = [
              "noticias",
              "mocambique",
              "africa",
              "futebol",
              "negocios",
              "entretenimento",
              "desporto"
          ]

          for categoria in categorias:

              urls.append(
                  "https://majaua1999.github.io/"
                  "Africanmundo-/categoria.html"
                  "?categoria="
                  + categoria
              )

          # Notícias
          for noticia in noticias:

              noticia_id = noticia.get("id")

              if noticia_id is not None:

                  urls.append(
                      "https://majaua1999.github.io/"
                      "Africanmundo-/noticia.html?id="
                      + str(noticia_id)
                  )

          linhas = []

          linhas.append(
              '<?xml version="1.0" encoding="UTF-8"?>'
          )

          linhas.append(
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
          )

          for i, url in enumerate(urls):

              linhas.append("  <url>")

              linhas.append(
                  "    <loc>"
                  + escape(url)
                  + "</loc>"
              )

              if i == 0:

                  linhas.append(
                      "    <changefreq>daily</changefreq>"
                  )

                  linhas.append(
                      "    <priority>1.0</priority>"
                  )

              elif i <= len(categorias):

                  linhas.append(
                      "    <changefreq>daily</changefreq>"
                  )

                  linhas.append(
                      "    <priority>0.8</priority>"
                  )

              else:

                  linhas.append(
                      "    <changefreq>weekly</changefreq>"
                  )

                  linhas.append(
                      "    <priority>0.7</priority>"
                  )

              linhas.append("  </url>")

          linhas.append("</urlset>")

          with open(
              "sitemap.xml",
              "w",
              encoding="utf-8"
          ) as arquivo:

              arquivo.write(
                  "\n".join(linhas)
              )

          print(
              "Sitemap atualizado."
          )

          print(
              "Notícias encontradas:",
              len(noticias)
          )

          print(
              "URLs no sitemap:",
              len(urls)
          )

          PY

      - name: Verificar sitemap
        run: |
          head -20 sitemap.xml
          tail -10 sitemap.xml

      - name: Guardar sitemap
        run: |

          git config user.name "AfricanMundo Bot"

          git config user.email "actions@github.com"

          git add sitemap.xml

          git diff --cached --quiet || \
          git commit -m "Atualizar sitemap automaticamente"

          git push
