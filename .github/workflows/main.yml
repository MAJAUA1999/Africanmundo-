name: Atualizar sitemap

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Gerar sitemap
        env:
          SUPABASE_URL: https://sonzwfhepjfvzltuxxne.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          python - <<'PY'
          import os
          import urllib.request
          import json
          from xml.sax.saxutils import escape

          url = os.environ["SUPABASE_URL"] + "/rest/v1/noticias?select=id,data&order=id.desc"

          req = urllib.request.Request(
              url,
              headers={
                  "apikey": os.environ["SUPABASE_KEY"],
                  "Authorization": "Bearer " + os.environ["SUPABASE_KEY"]
              }
          )

          with urllib.request.urlopen(req) as response:
              noticias = json.load(response)

          base = "https://majaua1999.github.io/Africanmundo-/"

          urls = [
              f"""<url>
          <loc>{base}</loc>
          <changefreq>daily</changefreq>
          <priority>1.0</priority>
          </url>"""
          ]

          categorias = [
              "noticias",
              "futebol",
              "africa",
              "mocambique",
              "negocios",
              "entretenimento",
              "desporto"
          ]

          for categoria in categorias:
              urls.append(
                  f"""<url>
          <loc>{base}categoria.html?categoria={categoria}</loc>
          <changefreq>daily</changefreq>
          <priority>0.8</priority>
          </url>"""
              )

          for noticia in noticias:
              noticia_id = noticia["id"]

              item = f"""<url>
          <loc>{base}noticia.html?id={noticia_id}</loc>
          <changefreq>weekly</changefreq>
          <priority>0.7</priority>
          </url>"""

              urls.append(item)

          sitemap = """<?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
          """ + "\n".join(urls) + """
          </urlset>
          """

          with open("sitemap.xml", "w", encoding="utf-8") as arquivo:
              arquivo.write(sitemap)

          print("Sitemap atualizado com", len(noticias), "notícias.")
          PY

      - name: Publicar sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --cached --quiet || git commit -m "Atualizar sitemap"
          git push
