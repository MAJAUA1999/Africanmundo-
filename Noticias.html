<!doctype html>
<html lang="pt">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Notícias — AfricanMundo</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.news-page {
  max-width: 1100px;
  margin: auto;
}

.news-card {
  background: #fff;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 22px;
  box-shadow: 0 3px 12px rgba(0,0,0,.10);
}

.news-card-image {
  width: 100%;
  max-height: 350px;
  object-fit: cover;
  display: block;
}

.news-card-content {
  padding: 20px;
}

.news-category {
  font-size: 13px;
  font-weight: 800;
  text-transform: uppercase;
}

.news-date {
  display: block;
  margin-top: 6px;
  color: #777;
  font-size: 13px;
}

.news-card h2 {
  margin: 12px 0;
  font-size: 27px;
}

.news-card p {
  line-height: 1.7;
}

.read-more {
  display: inline-block;
  margin-top: 10px;
  padding: 11px 16px;
  background: #111;
  color: #fff;
  text-decoration: none;
  border-radius: 8px;
  font-weight: 700;
}

.read-more:hover {
  opacity: .85;
}

.loading,
.error {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
}

  body.dark {
  --p: #58b52d;
  --bg: #101417;
  --card: #171d21;
  --txt: #f2f5f6;
  --muted: #aab5ba;
  --border: #293238;

  background: var(--bg);
  color: var(--txt);
  }
  
  body.dark .news-card,
body.dark .loading,
body.dark .error {
  background: var(--card);
  color: var(--txt);
}

body.dark .news-date {
  color: var(--muted);
}

body.dark .read-more {
  background: var(--p);
  color: #fff;
}
  /* MODO ESCURO — APENAS ESTA PÁGINA */

body.dark {
  background: #101417 !important;
  color: #f2f5f6 !important;
}

body.dark .news-section,
body.dark .section-title {
  color: #f2f5f6;
}

body.dark .news-card {
  background: #171d21 !important;
  color: #f2f5f6 !important;
  box-shadow: none;
}

body.dark .news-card-content {
  background: #171d21 !important;
  color: #f2f5f6 !important;
}

body.dark .news-card h2,
body.dark .news-card p {
  color: #f2f5f6 !important;
}

body.dark .news-date {
  color: #aab5ba !important;
}

body.dark .loading,
body.dark .error {
  background: #171d21 !important;
  color: #f2f5f6 !important;
}

body.dark .section-title a {
  color: #70c95a;
}
  
</style>

</head>

<body>

<header>

  <div class="top">
    🌍 AfricanMundo
  </div>

</header>

<main>

<section class="news-section news-page">

  <div class="section-title">

    <h1>📰 Últimas Notícias</h1>

    <a href="index.html">
      ← Voltar
    </a>

  </div>

  <div id="newsList">

    <div class="loading">
      🔄 A carregar notícias...
    </div>

  </div>

</section>

</main>

<script>

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function esc(valor) {

  return String(valor || "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}


function formatarData(data) {

  if (!data) return "";

  const d = new Date(data);

  if (isNaN(d.getTime())) return "";

  return d.toLocaleDateString(
    "pt-PT",
    {
      day: "2-digit",
      month: "long",
      year: "numeric"
    }
  );

}


function abrirNoticia(id) {

  if (id === null || id === undefined || id === "") {

    alert("Não foi possível identificar esta notícia.");

    return;

  }

  window.location.href =
    "noticia.html?id=" +
    encodeURIComponent(String(id));

}


async function carregarNoticias() {

  const lista =
    document.getElementById("newsList");

  try {

    const { data, error } =
      await supabaseClient
        .from("noticias")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Erro Supabase:",
        error
      );

      lista.innerHTML = `
        <div class="error">
          ❌ Não foi possível carregar as notícias.
        </div>
      `;

      return;
    }


    if (!data || data.length === 0) {

      lista.innerHTML = `
        <div class="error">
          📰 Ainda não existem notícias publicadas.
        </div>
      `;

      return;
    }


    lista.innerHTML = data.map(
      function(noticia) {

        const imagem =
          String(
            noticia.Imagem || ""
          ).trim();


        const dataPublicacao =
          formatarData(
            noticia.data_publicacao
          );


        return `

          <article class="news-card">

            ${
              imagem
              ? `
                <img
                  class="news-card-image"
                  src="${esc(imagem)}"
                  alt="${esc(
                    noticia.titulo ||
                    "Notícia AfricanMundo"
                  )}"
                >
              `
              : ""
            }


            <div class="news-card-content">

              <span class="news-category">
                🏷️ ${esc(
                  noticia.categoria ||
                  "Notícias"
                )}
              </span>


              ${
                dataPublicacao
                ? `
                  <span class="news-date">
                    📅 ${esc(
                      dataPublicacao
                    )}
                  </span>
                `
                : ""
              }


              <h2>
                ${esc(
                  noticia.titulo ||
                  "Sem título"
                )}
              </h2>


              <p>
                ${esc(
                  noticia.texto ||
                  ""
                )}
              </p>


              <button
                type="button"
                class="read-more"
                onclick="abrirNoticia(${JSON.stringify(
                  noticia.id
                )})"
              >
                📖 Ler notícia completa →
              </button>

            </div>

          </article>

        `;

      }
    ).join("");


  } catch (erro) {

    console.error(
      "Erro:",
      erro
    );

    lista.innerHTML = `
      <div class="error">
        ❌ Ocorreu um erro ao carregar as notícias.
      </div>
    `;

  }

}
  
if(localStorage.getItem("am_dark") === "true"){
  document.body.classList.add("dark");
          }

  console.log(
  "Modo escuro:",
  localStorage.getItem("am_dark")
);

console.log(
  "Classe do body:",
  document.body.className
);
  
carregarNoticias();

</script>

</body>
</html>
