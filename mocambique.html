<!doctype html>
<html lang="pt">
<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Moçambique — AfricanMundo</title>

<link rel="stylesheet"
      href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

.news-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.news-card{
  background:#fff;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.news-card:hover{
  transform:translateY(-3px);
}

.news-card img{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
}

.news-content{
  padding:15px;
}

.news-category{
  color:#168a45;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.news-title{
  margin:0 0 8px;
  font-size:18px;
  line-height:1.35;
}

.news-date{
  color:#777;
  font-size:12px;
}

.sem-noticias{
  text-align:center;
  padding:30px 10px;
}

#carregarMais{
  display:block;
  margin:25px auto;
  padding:13px 25px;
  border:0;
  border-radius:10px;
  background:#168a45;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

@media(max-width:800px){

  .news-grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .news-card img{
    height:150px;
  }

  .news-title{
    font-size:16px;
  }

}

@media(max-width:500px){

  .news-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<header>

  <div class="top">
    🌍 AfricanMundo
    <span>
      A informação que liga África ao mundo
    </span>
  </div>

</header>

<main>

<section class="news-section">

  <div class="section-title">

    <h1>🇲🇿 Moçambique</h1>

    <a href="index.html">
      ← Voltar
    </a>

  </div>

  <div id="newsGrid"
       class="news-grid">

    <p>
      🔄 A preparar as notícias...
    </p>

  </div>

  <button id="carregarMais"
          style="display:none">

    Carregar mais notícias

  </button>

</section>

</main>

      <script>

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const grid =
  document.getElementById("newsGrid");

const botao =
  document.getElementById("carregarMais");

let noticias = [];

let pagina = 0;

const POR_PAGINA = 30;


/* =========================
   NORMALIZAR
========================= */

function normalizar(valor){

  return String(valor || "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/* =========================
   ESCAPAR HTML
========================= */

function escapar(valor){

  return String(valor || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   IMAGEM
========================= */

function imagem(noticia){

  const campos = [
    noticia.imagem,
    noticia.image,
    noticia.url_imagem,
    noticia.imagem_url
  ];

  for(const valor of campos){

    if(
      typeof valor === "string" &&
      valor.trim() !== ""
    ){

      return valor.trim();

    }

  }

  return "";

}


/* =========================
   DATA
========================= */

function dataNoticia(valor){

  if(!valor) return "";

  const d =
    new Date(valor);

  if(isNaN(d.getTime()))
    return "";

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


/* =========================
   FILTRO MOÇAMBIQUE
========================= */

function ehMocambique(noticia){

  const categoria =
    normalizar(noticia.categoria);

  const pais =
    normalizar(noticia.pais);

  return (
    categoria === "mocambique" ||
    pais === "mocambique"
  );

}


/* =========================
   CRIAR CARD
========================= */

function criarCard(noticia){

  const card =
    document.createElement("article");

  card.className =
    "news-card";


  const img =
    imagem(noticia);


  const titulo =
    noticia.titulo ||
    "Sem título";


  const categoria =
    noticia.subcategoria ||
    noticia.categoria ||
    "Moçambique";


  card.innerHTML = `

    ${
      img
      ?
      `
      <img
        src="${escapar(img)}"
        alt="${escapar(titulo)}"
        loading="lazy"
      >
      `
      :
      ""
    }

    <div class="news-content">

      <div class="news-category">
        🇲🇿 ${escapar(categoria)}
      </div>

      <h3 class="news-title">
        ${escapar(titulo)}
      </h3>

      <div class="news-date">
        ${escapar(
          dataNoticia(noticia.data)
        )}
      </div>

    </div>

  `;


  card.onclick =
    function(){

      if(noticia.id){

        window.location.href =
          "noticia.html?id=" +
          encodeURIComponent(noticia.id);

      }

    };


  const imagemEl =
    card.querySelector("img");

  if(imagemEl){

    imagemEl.onerror =
      function(){

        this.style.display =
          "none";

      };

  }


  return card;

}


/* =========================
   MOSTRAR
========================= */

function mostrarNoticias(){

  const inicio =
    pagina * POR_PAGINA;

  const fim =
    inicio + POR_PAGINA;

  const lista =
    noticias.slice(
      inicio,
      fim
    );


  if(pagina === 0){

    grid.innerHTML = "";

  }


  lista.forEach(
    function(noticia){

      grid.appendChild(
        criarCard(noticia)
      );

    }
  );


  pagina++;


  if(
    pagina * POR_PAGINA
    <
    noticias.length
  ){

    botao.style.display =
      "block";

  }else{

    botao.style.display =
      "none";

  }

}


botao.addEventListener(
  "click",
  mostrarNoticias
);

            async function carregarNoticias(){

  try{

    grid.innerHTML = `
      <p class="sem-noticias">
        🔄 A preparar as notícias...
      </p>
    `;


    const resposta =
      await db
        .from("noticias")
        .select(`
          id,
          titulo,
          imagem,
          categoria,
          subcategoria,
          texto,
          data,
          fonte,
          pais
        `)
        .order("data", {
          ascending:false
        })
        .limit(300);


    if(resposta.error){

      throw resposta.error;

    }


    noticias =
      (resposta.data || [])
        .filter(ehMocambique);


    if(!noticias.length){

      grid.innerHTML = `
        <p class="sem-noticias">
          🇲🇿 Nenhuma notícia de
          Moçambique encontrada.
        </p>
      `;

      return;

    }


    pagina = 0;

    mostrarNoticias();


  }catch(erro){

    console.error(
      "Erro ao carregar Moçambique:",
      erro
    );


    grid.innerHTML = `
      <p class="sem-noticias">
        ❌ Erro ao carregar
        notícias de Moçambique.
      </p>
    `;

  }

}


/* =========================
   INICIAR
========================= */

carregarNoticias();

</script>

</body>
</html>
