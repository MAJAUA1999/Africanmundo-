<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Futebol — AfricanMundo</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="top">
    🌍 AfricanMundo
  </div>
</header>

<main>

  <section class="news-section">

    <div class="section-title">
      <h1>⚽ Futebol</h1>
      <a href="index.html">← Voltar</a>
    </div>

    <div id="newsGrid" class="news-grid">
      <p>🔄 A carregar notícias de Futebol...</p>
    </div>

  </section>

</main>

<script>

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


function esc(valor) {

  return String(valor || "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}


async function carregarNoticias() {

  const grid =
    document.getElementById("newsGrid");


  try {

    const { data, error } =
      await supabaseClient
        .from("noticias")
        .select("*");


    if (error) {

      console.error(
        "Erro Supabase:",
        error
      );

      grid.innerHTML =
        "<p>❌ Não foi possível carregar as notícias.</p>";

      return;
    }


    const futebol =
      (data || []).filter(
        function(noticia) {

          return String(
            noticia.categoria || ""
          )
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(
            /[\u0300-\u036f]/g,
            ""
          ) === "futebol";

        }
      );


    if (futebol.length === 0) {

      grid.innerHTML =
        "<p>⚽ Ainda não existem notícias de Futebol publicadas.</p>";

      return;
    }


    grid.innerHTML =
      futebol.map(
        function(noticia) {

          const imagem =
            String(
              noticia.Imagem || ""
            ).trim();


          return `

            <article class="news">

              <div class="thumb">

                ${
                  imagem

                  ? `
                    <img
                      src="${esc(imagem)}"
                      alt="${esc(
                        noticia.titulo ||
                        "Notícia de Futebol"
                      )}"
                      style="
                        width:100%;
                        height:180px;
                        object-fit:cover;
                        border-radius:10px;
                        display:block;
                      "
                    >
                  `

                  : `
                    ⚽
                  `
                }

              </div>


              <small>
                ${esc(
                  noticia.categoria ||
                  "Futebol"
                )}
              </small>


              <h3>
                ${esc(
                  noticia.titulo ||
                  "Sem título"
                )}
              </h3>


              <p>
                ${esc(
                  noticia.texto ||
                  ""
                )}
              </p>


              <a
                href="noticia.html?id=${encodeURIComponent(noticia.id)}"
                style="
                  display:inline-block;
                  margin-top:14px;
                  padding:11px 16px;
                  background:#111;
                  color:#fff;
                  text-decoration:none;
                  border-radius:8px;
                  font-weight:700;
                "
              >
                📖 Ler notícia completa →
              </a>

            </article>

          `;

        }
      ).join("");


  } catch (erro) {

    console.error(
      "Erro:",
      erro
    );

    grid.innerHTML =
      "<p>❌ Ocorreu um erro ao carregar as notícias.</p>";

  }

}


carregarNoticias();

</script>

</body>
</html>
