<!doctype html>
<html lang="pt">
<head>

  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Futebol — AfricanMundo</title>

  <meta name="description"
        content="Últimas notícias de futebol de Moçambique e África no AfricanMundo.">

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      background:#f3f5f7;
      color:#222;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      min-height:100vh;
    }

    /* =========================
       CABEÇALHO
    ========================= */

    header{
      width:100%;
      background:#fff;
      border-bottom:1px solid #ddd;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .top{
      max-width:900px;
      margin:auto;
      padding:15px 16px;
      font-size:21px;
      font-weight:800;
      color:#168a45;
    }

    /* =========================
       CONTEÚDO
    ========================= */

    main{
      width:100%;
      max-width:900px;
      margin:0 auto;
      padding:16px 12px 50px;
    }

    .news-section{
      width:100%;
    }

    /* =========================
       TÍTULO
    ========================= */

    .section-title{
      background:#fff;
      border-radius:12px;
      padding:15px;
      margin-bottom:12px;
      border:1px solid #e1e1e1;
    }

    .section-title h1{
      margin:0 0 8px;
      font-size:24px;
      line-height:1.2;
      color:#168a45;
    }

    .back{
      color:#168a45;
      text-decoration:none;
      font-weight:700;
      font-size:15px;
    }

    .back:hover{
      text-decoration:underline;
    }

    /* =========================
       NOTÍCIA
    ========================= */

    .news-item{
      background:#fff;
      border:1px solid #e2e2e2;
      border-radius:12px;
      margin-bottom:12px;
      padding:14px;
      overflow:hidden;
    }

    /* =========================
       IMAGEM ORIGINAL
    ========================= */

    .news-image{
      width:100%;
      height:190px;
      object-fit:cover;
      display:block;
      border-radius:9px;
      margin:0 0 12px;
      background:#eee;
    }

    .news-image.hidden{
      display:none;
    }

    /* =========================
       CATEGORIA
    ========================= */

    .news-category{
      display:block;
      margin-bottom:7px;
      color:#168a45;
      font-size:14px;
      font-weight:800;
    }

    /* =========================
       TÍTULO DA NOTÍCIA
    ========================= */

    .news-title{
      margin:0 0 7px;
      font-size:21px;
      line-height:1.3;
      color:#151515;
      font-weight:800;
    }

    /* =========================
       DATA
    ========================= */

    .news-date{
      color:#777;
      font-size:13px;
      margin-bottom:12px;
    }

    /* =========================
       TEXTO / RESUMO
    ========================= */

    .news-text{
      margin:0;
      font-size:16px;
      line-height:1.65;
      color:#333;
      white-space:normal;
      overflow-wrap:anywhere;
    }

    /* =========================
       FONTE
    ========================= */

    .news-source{
      margin-top:12px;
      font-size:12px;
      color:#888;
    }

    /* =========================
       CARREGAR MAIS
    ========================= */

    .load-more-wrap{
      text-align:center;
      padding:18px 0 5px;
    }

    #loadMore{
      border:0;
      background:#168a45;
      color:#fff;
      padding:12px 20px;
      border-radius:9px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
    }

    #loadMore:hover{
      opacity:.9;
    }

    #loadMore:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    /* =========================
       ESTADOS
    ========================= */

    .status{
      background:#fff;
      border:1px solid #ddd;
      border-radius:12px;
      padding:20px;
      text-align:center;
      color:#666;
    }

    .erro{
      color:#b00020;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:600px){

      .top{
        padding:13px 14px;
        font-size:19px;
      }

      main{
        padding:12px 9px 40px;
      }

      .section-title{
        padding:13px;
      }

      .section-title h1{
        font-size:21px;
      }

      .news-item{
        padding:11px;
        border-radius:10px;
      }

      .news-image{
        height:155px;
        border-radius:8px;
        margin-bottom:10px;
      }

      .news-title{
        font-size:18px;
        line-height:1.3;
      }

      .news-text{
        font-size:15px;
        line-height:1.58;
      }

    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header>

  <div class="top">
    🌍 AfricanMundo
  </div>

</header>


<main>

  <section class="news-section">

    <div class="section-title">

      <h1>⚽ Futebol</h1>

      <a
        class="back"
        href="index.html"
      >
        ← Voltar
      </a>

    </div>


    <div id="newsGrid">

      <div class="status">
        🔄 A carregar notícias de Futebol...
      </div>

    </div>


    <div
      id="loadMoreWrap"
      class="load-more-wrap"
      style="display:none;"
    >

      <button
        id="loadMore"
        type="button"
      >
        Carregar mais notícias
      </button>

    </div>

  </section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTOS
===================================================== */

const newsGrid =
  document.getElementById("newsGrid");

const loadMoreWrap =
  document.getElementById("loadMoreWrap");

const loadMore =
  document.getElementById("loadMore");


/* =====================================================
   ESTADO
===================================================== */

let todasNoticias = [];

let paginaAtual = 1;

const POR_PAGINA = 15;


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizar(valor){

  return String(valor ?? "")
    .trim()
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"");

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function esc(valor){

  return String(valor ?? "")
    .replace(
      /[&<>"']/g,
      function(m){

        return {
          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"
        }[m];

      }
    );

}


/* =====================================================
   LIMPAR TEXTO
===================================================== */

function limparTexto(texto){

  let valor =
    String(texto ?? "");

  /* Remove HTML */

  valor =
    valor.replace(
      /<[^>]*>/g,
      " "
    );

  /* Decodifica alguns caracteres comuns */

  valor =
    valor
      .replace(/&#8230;/g,"…")
      .replace(/&#8211;/g,"–")
      .replace(/&#8212;/g,"—")
      .replace(/&#8220;/g,"“")
      .replace(/&#8221;/g,"”")
      .replace(/&#8216;/g,"‘")
      .replace(/&#8217;/g,"’")
      .replace(/&#039;/g,"'")
      .replace(/&quot;/g,'"')
      .replace(/&amp;/g,"&")
      .replace(/\[&#8230;\]/g,"…")
      .replace(/\[\.\.\.\]/g,"…");

  /* Remove espaços repetidos */

  valor =
    valor.replace(
      /\s+/g,
      " "
    ).trim();

  return valor;

}


/* =====================================================
   RESUMO
===================================================== */

function criarResumo(texto){

  let valor =
    limparTexto(texto);

  /*
    Evita mostrar notícias completas.
    O máximo será aproximadamente 500 caracteres.
  */

  const LIMITE = 500;

  if(valor.length > LIMITE){

    valor =
      valor.substring(
        0,
        LIMITE
      );

    /*
      Não corta no meio de uma palavra.
    */

    const ultimoEspaco =
      valor.lastIndexOf(" ");

    if(ultimoEspaco > 350){

      valor =
        valor.substring(
          0,
          ultimoEspaco
        );

    }

    valor += "...";

  }

  return valor;

}


/* =====================================================
   DATA
===================================================== */

function formatarData(valor){

  if(!valor){
    return "";
  }

  try{

    const data =
      new Date(valor);

    if(
      Number.isNaN(
        data.getTime()
      )
    ){

      return esc(valor);

    }

    return data.toLocaleDateString(
      "pt-PT",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    );

  }catch(e){

    return esc(valor);

  }

}


/* =====================================================
   CRIAR NOTÍCIA
===================================================== */

function criarNoticia(noticia){

  const titulo =
    limparTexto(
      noticia.titulo ||
      "Sem título"
    );

  const categoria =
    limparTexto(
      noticia.categoria ||
      "Futebol"
    );

  const subcategoria =
    limparTexto(
      noticia.subcategoria ||
      "Futebol"
    );

  const texto =
    criarResumo(
      noticia.texto ||
      ""
    );

  const data =
    formatarData(
      noticia.data
    );

  const fonte =
    limparTexto(
      noticia.fonte ||
      ""
    );

  const imagem =
    String(
      noticia.imagem ??
      noticia.Imagem ??
      ""
    ).trim();


  return `

    <article class="news-item">

      ${
        imagem
        ?
        `
          <img
            class="news-image"
            src="${esc(imagem)}"
            alt="${esc(titulo)}"
            loading="lazy"
            onerror="
              this.classList.add('hidden');
            "
          >
        `
        :
        ""
      }


      <span class="news-category">

        ⚽ ${esc(
          subcategoria || categoria
        )}

      </span>


      <h2 class="news-title">

        ${esc(titulo)}

      </h2>


      ${
        data
        ?
        `
          <div class="news-date">

            ${esc(data)}

          </div>
        `
        :
        ""
      }


      ${
        texto
        ?
        `
          <p class="news-text">

            ${esc(texto)}

          </p>
        `
        :
        `
          <p class="news-text">

            Sem resumo disponível.

          </p>
        `
      }


      ${
        fonte
        ?
        `
          <div class="news-source">

            Fonte: ${esc(fonte)}

          </div>
        `
        :
        ""
      }

    </article>

  `;

}


/* =====================================================
   MOSTRAR NOTÍCIAS
===================================================== */

function mostrarNoticias(){

  const fim =
    paginaAtual * POR_PAGINA;

  const noticias =
    todasNoticias.slice(
      0,
      fim
    );


  if(
    noticias.length === 0
  ){

    newsGrid.innerHTML = `

      <div class="status">

        ⚽ Ainda não existem notícias
        de Futebol publicadas.

      </div>

    `;

    loadMoreWrap.style.display =
      "none";

    return;

  }


  newsGrid.innerHTML =
    noticias
      .map(criarNoticia)
      .join("");


  /*
    Mostrar botão apenas se
    ainda houver notícias.
  */

  if(
    noticias.length <
    todasNoticias.length
  ){

    loadMoreWrap.style.display =
      "block";

    loadMore.disabled =
      false;

  }else{

    loadMoreWrap.style.display =
      "block";

    loadMore.disabled =
      true;

    loadMore.textContent =
      "Todas as notícias foram carregadas";

  }

}


/* =====================================================
   CARREGAR NOTÍCIAS
===================================================== */

async function carregarNoticias(){

  newsGrid.innerHTML = `

    <div class="status">

      🔄 A carregar notícias de Futebol...

    </div>

  `;

  loadMoreWrap.style.display =
    "none";


  try{

    /*
      Usamos select("*") para manter
      compatibilidade com a estrutura
      que já funcionava no seu Supabase.
    */

    const resposta =
      await supabaseClient
        .from("noticias")
        .select("*")
        .order(
          "id",
          {
            ascending:false
          }
        )
        .limit(500);


    const data =
      resposta.data;

    const error =
      resposta.error;


    if(error){

      console.error(
        "Erro Supabase:",
        error
      );

      newsGrid.innerHTML = `

        <div class="status erro">

          ❌ Não foi possível carregar
          as notícias de Futebol.

          <br><br>

          Verifique a ligação com o Supabase.

        </div>

      `;

      return;

    }


    /*
      Filtragem no navegador.
      Assim funciona mesmo se houver
      pequenas diferenças de maiúsculas,
      espaços ou acentos.
    */

    todasNoticias =
      (data || []).filter(
        function(noticia){

          return (
            normalizar(
              noticia.categoria
            ) === "futebol"
          );

        }
      );


    /*
      Ordenar pela data quando disponível.
      Se não houver data, usa o ID.
    */

    todasNoticias.sort(
      function(a,b){

        const dataA =
          new Date(
            a.data || 0
          ).getTime();

        const dataB =
          new Date(
            b.data || 0
          ).getTime();


        if(
          !Number.isNaN(dataA) &&
          !Number.isNaN(dataB) &&
          dataA !== dataB
        ){

          return dataB - dataA;

        }


        return (
          Number(b.id || 0) -
          Number(a.id || 0)
        );

      }
    );


    paginaAtual = 1;

    mostrarNoticias();


  }catch(erro){

    console.error(
      "Erro inesperado:",
      erro
    );

    newsGrid.innerHTML = `

      <div class="status erro">

        ❌ Ocorreu um erro ao carregar
        as notícias.

      </div>

    `;

  }

}


/* =====================================================
   CARREGAR MAIS
===================================================== */

loadMore.addEventListener(
  "click",
  function(){

    paginaAtual++;

    mostrarNoticias();

  }
);


/* =====================================================
   INICIAR
===================================================== */

carregarNoticias();

</script>

</body>
</html>
