<!doctype html>
<html lang="pt">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Futebol — AfricanMundo</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    body{
      margin:0;
      background:#f4f6f7;
      color:#182027;
      font-family:Arial,Helvetica,sans-serif;
    }

    header{
      background:#168a45;
      color:#fff;
    }

    .top{
      max-width:1100px;
      margin:auto;
      padding:14px 16px;
      font-size:20px;
      font-weight:800;
    }

    main{
      max-width:1100px;
      margin:auto;
      padding:15px 12px 80px;
    }

    .section-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:15px;
    }

    .section-title h1{
      margin:0;
      font-size:23px;
    }

    .section-title a{
      color:#168a45;
      text-decoration:none;
      font-weight:700;
    }

    /* =========================
       NOTÍCIAS
    ========================= */

    .news-grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
    }

    .news{
      display:block;
      overflow:hidden;
      background:#fff;
      border-radius:12px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
      cursor:pointer;
      transition:.2s;
    }

    .news:hover{
      transform:translateY(-2px);
      box-shadow:0 5px 15px rgba(0,0,0,.13);
    }

    .news-link{
      display:block;
      color:inherit;
      text-decoration:none;
    }

    .thumb{
      width:100%;
      height:190px;
      overflow:hidden;
      background:#e8ecee;
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .sem-imagem{
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:50px;
    }

    .news-info{
      padding:10px 12px 13px;
    }

    .news small{
      display:block;
      margin-bottom:5px;
      color:#168a45;
      font-size:11px;
      font-weight:700;
    }

    .news h3{
      margin:0;
      font-size:17px;
      line-height:1.3;
    }

    .news-date{
      display:block;
      margin-top:7px;
      color:#7b858b;
      font-size:11px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:650px){

      main{
        padding:10px 8px 70px;
      }

      .top{
        padding:12px;
      }

      .section-title h1{
        font-size:20px;
      }

      .news-grid{
        grid-template-columns:1fr;
        gap:10px;
      }

      .news{
        display:grid;
        grid-template-columns:125px 1fr;
        min-height:105px;
      }

      .thumb{
        width:125px;
        height:105px;
      }

      .news-info{
        display:flex;
        flex-direction:column;
        justify-content:center;
        padding:8px 10px;
      }

      .news h3{
        font-size:15px;
        line-height:1.3;
      }

      .news small{
        font-size:10px;
        margin-bottom:4px;
      }

      .news-date{
        font-size:10px;
        margin-top:5px;
      }
    }

    /* =========================
       MODO ESCURO AUTOMÁTICO
    ========================= */

    @media(prefers-color-scheme:dark){

      body{
        background:#101315;
        color:#f1f3f4;
      }

      .news{
        background:#181d20;
        box-shadow:0 2px 10px rgba(0,0,0,.3);
      }

      .thumb{
        background:#20272b;
      }

      .news h3{
        color:#f5f7f8;
      }

      .news-date{
        color:#9ca7ad;
      }

      .section-title a{
        color:#25b965;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="top">
    🌍 AfricanMundo
  </div>

</header>


<main>

  <section class="news-section">

    <div class="section-title">

      <h1>⚽ Futebol</h1>

      <a href="index.html">
        ← Voltar
      </a>

    </div>


    <div id="newsGrid" class="news-grid">

      <p>🔄 A carregar notícias de Futebol...</p>

    </div>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   PROTEGER HTML
========================= */

function esc(valor){

  return String(valor ?? "").replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    }
  );

}


/* =========================
   DATA
========================= */

function formatarData(data){

  if(!data) return "";

  const d = new Date(data);

  if(Number.isNaN(d.getTime())){
    return "";
  }

  return d.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


/* =========================
   CARREGAR NOTÍCIAS
========================= */

async function carregarNoticias(){

  const grid =
    document.getElementById("newsGrid");

  try{

    const {data,error} =
      await supabaseClient
        .from("noticias")
        .select("*")
        .order("id",{ascending:false});


    if(error){

      console.error(
        "Erro Supabase:",
        error
      );

      grid.innerHTML =
        "<p>❌ Não foi possível carregar as notícias.</p>";

      return;

    }


    /* =========================
       FILTRAR FUTEBOL
    ========================= */

    const futebol =
      (data || []).filter(function(noticia){

        const categoria =
          String(
            noticia.categoria ?? ""
          )
          .trim()
          .toLowerCase()
          .normalize("NFD")
          .replace(
            /[\u0300-\u036f]/g,
            ""
          );

        return categoria === "futebol";

      });


    if(futebol.length === 0){

      grid.innerHTML = `
        <div class="empty-news">
          <p>
            ⚽ Ainda não existem notícias de Futebol publicadas.
          </p>
        </div>
      `;

      return;

    }


    /* =========================
       MOSTRAR NOTÍCIAS
    ========================= */

    grid.innerHTML =
      futebol.map(function(noticia){

        const imagem =
          String(
            noticia.imagem ??
            noticia.Imagem ??
            ""
          ).trim();

        const titulo =
          noticia.titulo ||
          "Sem título";


        const imagemHTML =
          imagem

          ? `
            <img
              src="${esc(imagem)}"
              alt="${esc(titulo)}"
              loading="lazy"
              onerror="
                this.style.display='none';
                this.parentElement.innerHTML='<div class=&quot;sem-imagem&quot;>⚽</div>';
              "
            >
          `

          : `
            <div class="sem-imagem">
              ⚽
            </div>
          `;


        return `

          <article class="news">

            <a
              class="news-link"
              href="noticia.html?id=${encodeURIComponent(noticia.id)}"
            >

              <div class="thumb">

                ${imagemHTML}

              </div>


              <div class="news-info">

                <small>
                  ⚽ Futebol
                </small>


                <h3>
                  ${esc(titulo)}
                </h3>


                <span class="news-date">
                  ${formatarData(noticia.data)}
                </span>

              </div>

            </a>

          </article>

        `;

      }).join("");


  }catch(erro){

    console.error(
      "Erro:",
      erro
    );

    grid.innerHTML =
      "<p>❌ Ocorreu um erro ao carregar as notícias.</p>";

  }

}


/* =========================
   INICIAR
========================= */

carregarNoticias();

</script>

</body>
</html>
