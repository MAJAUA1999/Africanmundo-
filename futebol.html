<!doctype html>
<html lang="pt">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Futebol — AfricanMundo</title>

<meta
name="description"
content="Últimas notícias de Futebol no AfricanMundo."
>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f7;
  color:#182027;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:#168a45;
  color:#fff;
}

.top{
  max-width:1100px;
  margin:auto;
  padding:9px 12px;
  font-size:18px;
  font-weight:800;
}

main{
  max-width:850px;
  margin:auto;
  padding:8px 7px 60px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:5px;
}

.section-title h1{
  margin:0;
  font-size:19px;
}

.section-title a{
  color:#168a45;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}

#estado{
  margin:0 0 9px;
  text-align:center;
  color:#7b858b;
  font-size:10px;
}

/* =========================
   ESTEIRA DE NOTÍCIAS
========================= */

.news-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

/* CARTÃO */

.news{
  width:100%;
  overflow:hidden;
  background:#fff;
  border:1px solid rgba(0,0,0,.07);
  border-radius:10px;
  box-shadow:0 1px 5px rgba(0,0,0,.07);
}

.news-link{
  display:block;
  color:inherit;
  text-decoration:none;
}

/* IMAGEM EM CIMA */

.thumb{
  width:100%;
  height:210px;
  overflow:hidden;
  background:#e8ecee;
}

.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.sem-imagem{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#168a45;
  color:#fff;
  font-size:45px;
}

/* TEXTO EMBAIXO */

.news-info{
  padding:9px 11px 10px;
}

.news-category{
  display:block;
  color:#168a45;
  font-size:9px;
  font-weight:800;
  margin-bottom:4px;
}

.news h2{
  margin:0;
  font-size:16px;
  line-height:1.25;
  font-weight:800;
}

.news-date{
  display:block;
  margin-top:6px;
  color:#7b858b;
  font-size:10px;
}

/* INDICA QUE É CLICÁVEL */

.news-link:active .news{
  transform:scale(.99);
}

/* CARREGANDO */

.loading{
  text-align:center;
  padding:20px;
  color:#7b858b;
  font-size:12px;
}

.erro{
  text-align:center;
  padding:20px;
  color:#c62828;
  background:#fff;
  border-radius:9px;
}

/* =========================
   CELULAR
========================= */

@media(max-width:600px){

  main{
    padding:6px 5px 60px;
  }

  .top{
    padding:8px 10px;
    font-size:17px;
  }

  .section-title h1{
    font-size:18px;
  }

  .section-title a{
    font-size:11px;
  }

  .news-list{
    gap:7px;
  }

  .news{
    border-radius:8px;
  }

  .thumb{
    height:165px;
  }

  .news-info{
    padding:8px 9px 9px;
  }

  .news-category{
    font-size:8px;
    margin-bottom:3px;
  }

  .news h2{
    font-size:14px;
    line-height:1.22;
  }

  .news-date{
    margin-top:5px;
    font-size:9px;
  }

  .sem-imagem{
    font-size:35px;
  }

}

/* =========================
   CELULARES PEQUENOS
========================= */

@media(max-width:380px){

  .thumb{
    height:145px;
  }

  .news h2{
    font-size:13px;
  }

}

/* =========================
   MODO ESCURO
========================= */

@media(prefers-color-scheme:dark){

  body{
    background:#101315;
    color:#f1f3f4;
  }

  .news{
    background:#181d20;
    border-color:#293136;
    box-shadow:0 1px 6px rgba(0,0,0,.3);
  }

  .thumb{
    background:#20272b;
  }

  .news h2{
    color:#f5f7f8;
  }

  .news-date,
  #estado{
    color:#9ca7ad;
  }

  .section-title a,
  .news-category{
    color:#25b965;
  }

}

</style>

</head>

<body>

<header>

<div class="top">
🌍 AfricanMundo
</div>

</header>

<main>

<section class="news-section">

<div class="section-title">

<h1>⚽ Futebol</h1>

<a href="index.html">← Voltar</a>

</div>

<div id="estado">
🔄 A carregar...
</div>

<div id="newsList" class="news-list">

<div class="loading">
🔄 A carregar notícias...
</div>

</div>

</section>

</main>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================
   ELEMENTOS
========================= */

const list =
document.getElementById("newsList");

const estado =
document.getElementById("estado");


/* =========================
   SEGURANÇA
========================= */

function esc(valor){

return String(valor ?? "").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}


/* =========================
   NORMALIZAR
========================= */

function normalizar(valor){

return String(valor ?? "")
.trim()
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");

}


/* =========================
   DATA
========================= */

function formatarData(data){

if(!data)return "";

const d=new Date(data);

if(Number.isNaN(d.getTime()))return "";

return d.toLocaleDateString(
"pt-PT",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}


/* =========================
   CRIAR NOTÍCIA
========================= */

function criarNoticia(n){

const titulo =
n.titulo || "Sem título";

const imagem =
String(
n.imagem ?? n.Imagem ?? ""
).trim();


let imagemHTML="";


if(imagem){

imagemHTML=`

<img
src="${esc(imagem)}"
alt="${esc(titulo)}"
loading="lazy"
decoding="async"
onerror="
this.style.display='none';
this.parentElement.innerHTML='<div class=&quot;sem-imagem&quot;>⚽</div>';
"
>

`;

}else{

imagemHTML=`

<div class="sem-imagem">
⚽
</div>

`;

}


/*
   IMPORTANTE:
   Aqui NÃO usamos n.texto.

   A listagem mostra somente:
   imagem
   título
   categoria
   data
*/

return `

<article class="news">

<a
class="news-link"
href="noticia.html?id=${encodeURIComponent(n.id)}"
aria-label="${esc(titulo)}"
>

<div class="thumb">

${imagemHTML}

</div>

<div class="news-info">

<span class="news-category">
⚽ Futebol
</span>

<h2>
${esc(titulo)}
</h2>

<span class="news-date">
${formatarData(n.data)}
</span>

</div>

</a>

</article>

`;

}


/* =========================
   CARREGAR NOTÍCIAS
========================= */

async function carregarNoticias(){

try{

estado.textContent =
"🔄 A carregar...";


const {data,error} =
await supabaseClient

.from("noticias")

.select(
"id,titulo,categoria,data,imagem,fonte,pais"
)

.order(
"data",
{
ascending:false
}
)

.order(
"id",
{
ascending:false
}
)

.limit(500);


/* ERRO */

if(error){

console.error(
"Erro Supabase:",
error
);

estado.textContent =
"❌ Erro ao carregar notícias.";

list.innerHTML = `

<div class="erro">

Não foi possível carregar as notícias.
<br>
Tente novamente.

</div>

`;

return;

}


/* =========================
   FILTRAR FUTEBOL
========================= */

const futebol =
(data || []).filter(n => {

return normalizar(n.categoria)
===
"futebol";

});


/* NENHUMA NOTÍCIA */

if(!futebol.length){

list.innerHTML = `

<div class="erro">

⚽ Ainda não existem notícias de Futebol.

</div>

`;

estado.textContent="";

return;

}


/* =========================
   MOSTRAR ESTEIRA
========================= */

list.innerHTML =
futebol
.map(criarNoticia)
.join("");


estado.textContent =
"✓ Atualizado";


}catch(e){

console.error(
"Erro geral:",
e
);

estado.textContent =
"❌ Erro ao carregar notícias.";

list.innerHTML = `

<div class="erro">

Não foi possível carregar as notícias.
<br>
Tente novamente.

</div>

`;

}

}


/* =========================
   PRIMEIRA CARGA
========================= */

carregarNoticias();


/* =========================
   ATUALIZAR A CADA 1 HORA
========================= */

setInterval(
carregarNoticias,
60*60*1000
);


/* =========================
   QUANDO VOLTAR À PÁGINA
========================= */

document.addEventListener(
"visibilitychange",
()=>{

if(
document.visibilityState==="visible"
){

carregarNoticias();

}

}
);

</script>

</body>

</html>
