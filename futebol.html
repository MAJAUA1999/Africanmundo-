<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Futebol — AfricanMundo</title>
<meta name="description" content="Últimas notícias de futebol em Moçambique e África — AfricanMundo">
<link rel="icon" href="favicon.ico">

<style>
:root{
  --p:#168a45;
  --bg:#f5f7f8;
  --card:#fff;
  --txt:#182026;
  --muted:#707980;
  --border:#e5e8eb;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--txt);
  font-family:Arial,Helvetica,sans-serif;
}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--card);
  border-bottom:1px solid var(--border);
  height:58px;
  display:flex;
  align-items:center;
  padding:0 14px;
}

.logo{
  font-size:18px;
  font-weight:800;
  color:var(--p);
}

main{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:10px;
}

.topo{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:10px;
}

.voltar{
  border:0;
  background:var(--card);
  color:var(--txt);
  padding:8px 12px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 1px 4px #00000012;
}

.titulo-pagina{
  font-size:18px;
  font-weight:800;
}

.estado{
  display:flex;
  align-items:center;
  gap:6px;
  color:var(--p);
  font-size:12px;
  font-weight:700;
  margin:2px 0 10px;
}

/* ESTEIRA */

.lista{
  display:flex;
  flex-direction:column;
  gap:7px;
}

.noticia{
  display:flex;
  width:100%;
  min-height:88px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:11px;
  overflow:hidden;
  cursor:pointer;
  transition:.15s;
}

.noticia:active{
  transform:scale(.99);
}

.imagem{
  width:115px;
  min-width:115px;
  height:88px;
  background:#e9edef;
  overflow:hidden;
}

.imagem img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.sem-imagem{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.info{
  padding:8px 10px;
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.tag{
  color:var(--p);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  margin-bottom:3px;
}

.ntitulo{
  font-size:14px;
  line-height:1.25;
  font-weight:750;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.data{
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

.loader{
  text-align:center;
  padding:18px;
  color:var(--muted);
  font-size:12px;
}

.fim{
  text-align:center;
  padding:18px 5px 30px;
  color:var(--muted);
  font-size:12px;
}

.erro{
  background:#fff;
  border:1px solid #f0d2d2;
  color:#a33;
  padding:15px;
  border-radius:10px;
  font-size:13px;
}

@media(max-width:600px){
  main{
    padding:8px;
  }

  header{
    height:52px;
  }

  .logo{
    font-size:17px;
  }

  .imagem{
    width:105px;
    min-width:105px;
    height:82px;
  }

  .noticia{
    min-height:82px;
    border-radius:9px;
  }

  .ntitulo{
    font-size:13px;
  }

  .info{
    padding:7px 8px;
  }
}

@media(min-width:700px){
  .noticia{
    min-height:92px;
  }

  .imagem{
    width:130px;
    min-width:130px;
    height:92px;
  }

  .ntitulo{
    font-size:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🌍 AfricanMundo</div>
</header>

<main>

  <div class="topo">
    <button class="voltar" onclick="history.back()">← Voltar</button>
    <div class="titulo-pagina">⚽ Futebol</div>
  </div>

  <div class="estado" id="estado">
    ✓ Atualizado
  </div>

  <section id="lista" class="lista"></section>

  <div id="loader" class="loader">
    Carregando notícias...
  </div>

  <div id="fim" class="fim" style="display:none">
    ✓ Todas as notícias foram carregadas
  </div>

</main>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_ANON_KEY =
  "COLOQUE_AQUI_A_SUA_ANON_KEY";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const lista = document.getElementById("lista");
const loader = document.getElementById("loader");
const fim = document.getElementById("fim");
const estado = document.getElementById("estado");

let pagina = 0;
const LIMITE = 20;
let carregando = false;
let terminou = false;


/* Corrige entidades HTML */
function limparTexto(texto){
  if(!texto) return "";

  const el = document.createElement("textarea");
  el.innerHTML = texto;

  return el.value
    .replace(/\s+/g," ")
    .trim();
}


/* Data */
function formatarData(data){
  if(!data) return "";

  const d = new Date(data);

  if(isNaN(d.getTime())) return "";

  return d.toLocaleDateString("pt-PT",{
    day:"2-digit",
    month:"2-digit",
    year:"numeric"
  });
}


/* Abrir notícia */
function abrirNoticia(id){
  if(!id) return;

  window.location.href =
    "noticia.html?id=" +
    encodeURIComponent(id);
}


/* Criar cartão */
function criarCard(n){

  const card = document.createElement("article");

  card.className = "noticia";

  card.onclick = () => abrirNoticia(n.id);

  const imagem =
    limparTexto(n.imagem || "");

  const titulo =
    limparTexto(n.titulo || "Sem título");

  const categoria =
    limparTexto(n.categoria || "Futebol");

  card.innerHTML = `

    <div class="imagem">

      ${
        imagem
        ?
        `<img
          src="${imagem}"
          alt=""
          loading="lazy"
          onerror="this.style.display='none';this.parentElement.innerHTML='<div class=&quot;sem-imagem&quot;>⚽</div>'"
        >`
        :
        `<div class="sem-imagem">⚽</div>`
      }

    </div>

    <div class="info">

      <div class="tag">
        ⚽ ${categoria}
      </div>

      <div class="ntitulo">
        ${titulo}
      </div>

      <div class="data">
        ${formatarData(n.data)}
      </div>

    </div>

  `;

  return card;
}


/* Carregar notícias */
async function carregar(){

  if(carregando || terminou) return;

  carregando = true;

  loader.style.display = "block";

  const inicio = pagina * LIMITE;
  const fimRange = inicio + LIMITE - 1;

  try{

    const { data, error } = await supabase
      .from("noticias")
      .select(`
        id,
        titulo,
        imagem,
        categoria,
        data
      `)
      .eq("categoria","Futebol")
      .order("data",{ascending:false})
      .range(inicio,fimRange);

    if(error){
      throw error;
    }

    if(!data || data.length === 0){

      terminou = true;

      loader.style.display = "none";

      if(pagina === 0){
        lista.innerHTML = `
          <div class="erro">
            Nenhuma notícia de futebol encontrada.
          </div>
        `;
      }else{
        fim.style.display = "block";
      }

      return;
    }


    data.forEach(n => {

      /*
       * IMPORTANTE:
       * Apenas titulo, imagem, categoria e data
       * são usados aqui.
       *
       * O campo "texto" NÃO aparece na listagem.
       */

      lista.appendChild(criarCard(n));

    });


    pagina++;

    if(data.length < LIMITE){

      terminou = true;

      loader.style.display = "none";
      fim.style.display = "block";

    }else{

      loader.style.display = "block";

    }

  }catch(error){

    console.error("Erro ao carregar Futebol:",error);

    loader.innerHTML =
      "Não foi possível carregar as notícias. Tente novamente.";

    estado.textContent = "⚠ Erro ao atualizar";

  }finally{

    carregando = false;

  }

}


/* Primeira carga */
carregar();


/*
 * ESTEIRA INFINITA
 *
 * Quando o utilizador chega perto
 * do fim da página, busca mais 20 notícias.
 */

window.addEventListener("scroll",()=>{

  if(terminou || carregando) return;

  const distancia =
    document.documentElement.scrollHeight -
    (window.innerHeight + window.scrollY);

  if(distancia < 700){

    carregar();

  }

});

</script>

</body>
</html>
