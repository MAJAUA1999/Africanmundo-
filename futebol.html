/* ==========================================
   PÁGINA FUTEBOL
========================================== */

body{
  margin:0;
  background:#f5f6f7;
  color:#222;
  font-family:Arial,Helvetica,sans-serif;
}


/* ==========================================
   CABEÇALHO
========================================== */

header{
  background:#fff;
  border-bottom:1px solid #e5e5e5;
}

.top{
  max-width:1000px;
  margin:auto;
  padding:15px;
  font-size:20px;
  font-weight:800;
  color:#168a45;
}


/* ==========================================
   CONTEÚDO
========================================== */

main{
  max-width:900px;
  margin:auto;
  padding:15px;
}


/* ==========================================
   TÍTULO
========================================== */

.section-title{
  background:#fff;
  border-radius:12px;
  padding:14px 16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.section-title h1{
  margin:0 0 8px;
  font-size:22px;
  color:#168a45;
}

.section-title a{
  color:#168a45;
  text-decoration:none;
  font-weight:700;
  font-size:14px;
}


/* ==========================================
   NOTÍCIA
========================================== */

.news-item{
  background:#fff;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.news-category{
  color:#168a45;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.news-title{
  margin:0 0 8px;
  font-size:21px;
  line-height:1.35;
  color:#222;
}

.news-date{
  color:#777;
  font-size:12px;
  margin-bottom:12px;
}

.news-text{
  color:#444;
  font-size:15px;
  line-height:1.65;
  white-space:pre-line;
}


/* ==========================================
   CARREGAR MAIS
========================================== */

#carregarMais{
  display:block;
  margin:22px auto 30px;
  padding:12px 24px;
  border:0;
  border-radius:9px;
  background:#168a45;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

#carregarMais:hover{
  opacity:.9;
}


/* ==========================================
   SEM NOTÍCIAS
========================================== */

.empty-news{
  background:#fff;
  border-radius:12px;
  padding:30px 15px;
  text-align:center;
  color:#666;
}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px){

  main{
    padding:10px;
  }

  .top{
    padding:13px;
    font-size:18px;
  }

  .section-title{
    padding:13px;
  }

  .section-title h1{
    font-size:20px;
  }

  .news-item{
    padding:14px;
    margin-bottom:10px;
  }

  .news-title{
    font-size:18px;
  }

  .news-text{
    font-size:14px;
    line-height:1.6;
  }

}


/* ==========================================
   MODO ESCURO
========================================== */

@media(prefers-color-scheme:dark){

  body{
    background:#111;
  }

  .section-title,
  .news-item,
  .empty-news{
    background:#1b1b1b;
  }

  .news-title{
    color:#fff;
  }

  .news-text{
    color:#ccc;
  }

  .news-date{
    color:#aaa;
  }

}

</style></head><body><header>  <div class="top">
    🌍 AfricanMundo
  </div></header><main><section class="news-section">  <div class="section-title"><h1>
  ⚽ Futebol
</h1>

<a href="index.html">
  ← Voltar
</a>

  </div>  <div id="newsGrid"><p class="empty-news">
  🔄 A carregar notícias de Futebol...
</p>

  </div><button
id="carregarMais"
style="display:none">

Carregar mais notícias

  </button></section></main><script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const grid =
  document.getElementById("newsGrid");

const botao =
  document.getElementById("carregarMais");


let noticias = [];

let pagina = 0;

const POR_PAGINA = 15;


/* ==========================================
   ESCAPAR HTML
========================================== */

function esc(valor){

  return String(
    valor ?? ""
  ).replace(
    /[&<>"']/g,
    function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    }
  );

}


/* ==========================================
   NORMALIZAR
========================================== */

function normalizar(valor){

  return String(
    valor ?? ""
  )
  .trim()
  .toLowerCase()
  .normalize("NFD")
  .replace(
    /[\u0300-\u036f]/g,
    ""
  );

}


/* ==========================================
   DATA
========================================== */

function dataNoticia(valor){

  if(!valor)
    return "";

  const data =
    new Date(valor);

  if(
    isNaN(
      data.getTime()
    )
  )
    return "";

  return data.toLocaleDateString(
    "pt-PT",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


/* ==========================================
   LIMPAR TEXTO
========================================== */

function limparTexto(valor){

  let texto =
    String(valor ?? "");


  texto =
    texto.replace(
      /<script[\s\S]*?<\/script>/gi,
      ""
    );


  texto =
    texto.replace(
      /<style[\s\S]*?<\/style>/gi,
      ""
    );


  texto =
    texto.replace(
      /<[^>]*>/g,
      " "
    );


  texto =
    texto.replace(
      /&nbsp;/gi,
      " "
    );


  texto =
    texto.replace(
      /&amp;/gi,
      "&"
    );


  texto =
    texto.replace(
      /&quot;/gi,
      '"'
    );


  texto =
    texto.replace(
      /&#039;/gi,
      "'"
    );


  texto =
    texto.replace(
      /\s+/g,
      " "
    );


  return texto.trim();

}


/* ==========================================
   TEXTO DA NOTÍCIA
========================================== */

function textoNoticia(noticia){

  const campos = [

    noticia.texto,
    noticia.descricao,
    noticia.resumo,
    noticia.conteudo

  ];


  for(
    const valor of campos
  ){

    const texto =
      limparTexto(valor);

    if(texto)
      return texto;

  }


  return "";

}


/* ==========================================
   TEXTO MOSTRADO
========================================== */

function textoParaMostrar(noticia){

  const texto =
    textoNoticia(noticia);


  /*
    Mantemos bastante conteúdo
    visível na página da categoria.
  */

  if(
    texto.length <= 1200
  ){

    return texto;

  }


  return texto
    .substring(0,1200)
    .trim() + "...";

}


/* ==========================================
   CRIAR NOTÍCIA
========================================== */

function criarNoticia(noticia){

  const item =
    document.createElement("article");


  item.className =
    "news-item";


  const titulo =
    noticia.titulo ||
    "Sem título";


  const categoria =
    noticia.subcategoria ||
    "Futebol";


  const data =
    dataNoticia(
      noticia.data
    );


  const texto =
    textoParaMostrar(
      noticia
    );


  item.innerHTML = `

    <div class="news-category">

      ⚽ ${esc(categoria)}

    </div>


    <h2 class="news-title">

      ${esc(titulo)}

    </h2>


    <div class="news-date">

      ${esc(data)}

    </div>


    ${
      texto

      ?

      `

        <div class="news-text">

          ${esc(texto)}

        </div>

      `

      :

      `

        <div class="news-text">

          Conteúdo da notícia
          disponível na página completa.

        </div>

      `
    }

  `;


  return item;

}


/* ==========================================
   MOSTRAR NOTÍCIAS
========================================== */

function mostrarNoticias(){

  const inicio =
    pagina *
    POR_PAGINA;


  const fim =
    inicio +
    POR_PAGINA;


  const lista =
    noticias.slice(
      inicio,
      fim
    );


  if(
    pagina === 0
  ){

    grid.innerHTML = "";

  }


  lista.forEach(
    function(noticia){

      grid.appendChild(
        criarNoticia(
          noticia
        )
      );

    }
  );


  pagina++;


  if(
    pagina *
    POR_PAGINA
    <
    noticias.length
  ){

    botao.style.display =
      "block";

  }else{

    botao.style.display =
      "none";

  }

}


/* ==========================================
   BOTÃO CARREGAR MAIS
========================================== */

botao.addEventListener(
  "click",
  mostrarNoticias
);


/* ==========================================
   CARREGAR NOTÍCIAS
========================================== */

async function carregarNoticias(){

  try{

    grid.innerHTML = `

      <p class="empty-news">

        🔄 A carregar notícias de Futebol...

      </p>

    `;


    const resposta =
      await supabaseClient
        .from("noticias")
        .select(`
          id,
          titulo,
          categoria,
          subcategoria,
          texto,
          descricao,
          resumo,
          conteudo,
          data,
          fonte
        `)
        .order(
          "data",
          {
            ascending:false
          }
        )
        .limit(500);


    if(
      resposta.error
    ){

      throw resposta.error;

    }


    noticias =
      (resposta.data || [])
      .filter(
        function(noticia){

          return (
            normalizar(
              noticia.categoria
            ) === "futebol"
          );

        }
      );


    if(
      noticias.length === 0
    ){

      grid.innerHTML = `

        <div class="empty-news">

          ⚽ Ainda não existem
          notícias de Futebol publicadas.

        </div>

      `;

      botao.style.display =
        "none";

      return;

    }


    pagina = 0;

    mostrarNoticias();


  }catch(erro){

    console.error(
      "Erro ao carregar Futebol:",
      erro
    );


    grid.innerHTML = `

      <div class="empty-news">

        ❌ Não foi possível
        carregar as notícias de Futebol.

      </div>

    `;


    botao.style.display =
      "none";

  }

}


/* ==========================================
   INICIAR
========================================== */

carregarNoticias();

</script></body></html>
