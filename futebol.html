<!doctype html>
<html lang="pt">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Futebol — AfricanMundo</title>

<meta name="description" content="Últimas notícias de Futebol no AfricanMundo.">

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f4f6f7;
  color:#182027;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:#168a45;
  color:#fff;
}

.top{
  max-width:1100px;
  margin:auto;
  padding:9px 12px;
  font-size:18px;
  font-weight:800;
}

main{
  max-width:1100px;
  margin:auto;
  padding:8px 8px 60px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.section-title h1{
  margin:0;
  font-size:20px;
}

.section-title a{
  color:#168a45;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}

#estado{
  margin:0 0 8px;
  text-align:center;
  color:#7b858b;
  font-size:10px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.news{
  background:#fff;
  border:1px solid rgba(0,0,0,.06);
  border-radius:8px;
  overflow:hidden;
  box-shadow:0 1px 5px rgba(0,0,0,.07);
}

.news-link{
  display:flex;
  color:inherit;
  text-decoration:none;
}

.thumb{
  width:145px;
  height:95px;
  flex:none;
  overflow:hidden;
  background:#e8ecee;
}

.thumb img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.sem-imagem{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#168a45;
  color:#fff;
  font-size:28px;
}

.news-info{
  min-width:0;
  padding:7px 8px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.news-category{
  color:#168a45;
  font-size:9px;
  font-weight:700;
  margin-bottom:2px;
}

.news h2{
  margin:0;
  font-size:14px;
  line-height:1.2;
  font-weight:800;
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:3;
  overflow:hidden;
}

.news-date{
  margin-top:4px;
  color:#7b858b;
  font-size:9px;
}

@media(max-width:650px){

  main{
    padding:6px 6px 60px;
  }

  .top{
    padding:8px 10px;
    font-size:17px;
  }

  .section-title{
    margin-bottom:6px;
  }

  .section-title h1{
    font-size:18px;
  }

  .section-title a{
    font-size:11px;
  }

  .news-grid{
    grid-template-columns:1fr;
    gap:6px;
  }

  .news{
    border-radius:7px;
  }

  .thumb{
    width:92px;
    height:76px;
  }

  .news-info{
    padding:5px 7px;
  }

  .news-category{
    font-size:8px;
    margin-bottom:2px;
  }

  .news h2{
    font-size:13px;
    line-height:1.18;
    -webkit-line-clamp:3;
  }

  .news-date{
    margin-top:3px;
    font-size:8px;
  }

  .sem-imagem{
    font-size:24px;
  }

}

@media(prefers-color-scheme:dark){

  body{
    background:#101315;
    color:#f1f3f4;
  }

  .news{
    background:#181d20;
    border-color:#293136;
    box-shadow:0 1px 6px rgba(0,0,0,.3);
  }

  .thumb{
    background:#20272b;
  }

  .news h2{
    color:#f5f7f8;
  }

  .news-date,
  #estado{
    color:#9ca7ad;
  }

  .section-title a,
  .news-category{
    color:#25b965;
  }

}

</style>

</head>

<body>

<header>

<div class="top">
🌍 AfricanMundo
</div>

</header>

<main>

<section class="news-section">

<div class="section-title">

<h1>⚽ Futebol</h1>

<a href="index.html">← Voltar</a>

</div>

<div id="estado">
🔄 A carregar...
</div>

<div id="newsGrid" class="news-grid">

<p>🔄 A carregar notícias...</p>

</div>

</section>

</main>

<script>

const SUPABASE_URL =
"https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const grid =
document.getElementById("newsGrid");

const estado =
document.getElementById("estado");

function esc(valor){

return String(valor ?? "").replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}[m])
);

}

function formatarData(data){

if(!data)return "";

const d=new Date(data);

if(Number.isNaN(d.getTime()))return "";

return d.toLocaleDateString(
"pt-PT",
{
day:"2-digit",
month:"2-digit",
year:"numeric"
}
);

}

function criarNoticia(n){

const imagem=String(
n.imagem ?? n.Imagem ?? ""
).trim();

let img=imagem
?`
<img
src="${esc(imagem)}"
alt="${esc(n.titulo||"")}"
loading="lazy"
decoding="async"
onerror="
this.style.display='none';
this.parentElement.innerHTML='<div class=&quot;sem-imagem&quot;>⚽</div>';
">
`
:`
<div class="sem-imagem">⚽</div>
`;

return `

<article class="news">

<a
class="news-link"
href="noticia.html?id=${encodeURIComponent(n.id)}"
aria-label="${esc(n.titulo||"Sem título")}"
>

<div class="thumb">
${img}
</div>

<div class="news-info">

<span class="news-category">
⚽ Futebol
</span>

<h2>
${esc(n.titulo||"Sem título")}
</h2>

<span class="news-date">
${formatarData(n.data)}
</span>

</div>

</a>

</article>

`;

}

async function carregarNoticias(){

try{

estado.textContent="🔄 A carregar...";

const {data,error}=await supabaseClient
.from("noticias")
.select(
"id,titulo,categoria,data,imagem,fonte,pais"
)
.order("data",{ascending:false})
.order("id",{ascending:false})
.limit(500);

if(error){

console.error(error);

estado.textContent=
"❌ Erro ao carregar notícias.";

return;

}

const futebol=(data||[]).filter(n=>{

const categoria=String(
n.categoria??""
)
.trim()
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"");

return categoria==="futebol";

});

if(!futebol.length){

grid.innerHTML=`
<p>
⚽ Ainda não existem notícias de Futebol.
</p>
`;

estado.textContent="";

return;

}

grid.innerHTML=
futebol.map(criarNoticia).join("");

estado.textContent=
"✓ Atualizado";

}catch(e){

console.error(e);

estado.textContent=
"❌ Erro ao carregar notícias.";

}

}

carregarNoticias();

setInterval(
carregarNoticias,
60*60*1000
);

document.addEventListener(
"visibilitychange",
()=>{

if(
document.visibilityState==="visible"
){

carregarNoticias();

}

}
);

</script>

</body>

</html>
