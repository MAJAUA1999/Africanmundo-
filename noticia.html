<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

let db = null;

let noticiaAtual = null;


/* ==========================================
   INICIAR SUPABASE
========================================== */

function iniciarSupabase(){

  try{

    if(
      typeof window.supabase ===
      "undefined"
    ){

      throw new Error(
        "Biblioteca Supabase não carregada."
      );

    }

    db =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    return true;

  }catch(e){

    console.error(
      "Erro Supabase:",
      e
    );

    return false;

  }

}


/* ==========================================
   SEGURANÇA
========================================== */

function esc(valor){

  if(
    valor === null ||
    valor === undefined
  ){

    return "";

  }

  return String(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==========================================
   CAMPOS
========================================== */

function obterTitulo(n){

  return (
    n?.titulo ||
    n?.title ||
    "Sem título"
  );

}


function obterTexto(n){

  return (
    n?.texto ||
    n?.descricao ||
    n?.description ||
    ""
  );

}


function obterImagem(n){

  return (
    n?.imagem ||
    n?.image ||
    n?.foto ||
    ""
  );

}


function obterCategoria(n){

  return (
    n?.categoria ||
    "Notícias"
  );

}


function obterData(n){

  return (
    n?.data ||
    ""
  );

}


/* ==========================================
   DATA
========================================== */

function formatarData(valor){

  if(!valor){

    return "";

  }

  try{

    const data =
      new Date(valor);

    if(
      Number.isNaN(
        data.getTime()
      )
    ){

      return String(valor);

    }

    return data.toLocaleDateString(
      "pt-PT",
      {
        day:"2-digit",
        month:"long",
        year:"numeric"
      }
    );

  }catch(e){

    return String(valor);

  }

}


/* ==========================================
   SEO
========================================== */

function atualizarSEO(n){

  try{

    const titulo =
      obterTitulo(n);

    const texto =
      obterTexto(n)
        .replace(/\s+/g," ")
        .trim();

    const descricao =
      texto.length > 160
        ? texto.slice(0,157) + "..."
        : (
            texto ||
            "Leia as últimas notícias de África e do mundo no AfricanMundo."
          );

    const imagem =
      obterImagem(n);

    const categoria =
      obterCategoria(n);

    const dataPublicada =
      obterData(n);

    const url =
      window.location.href;


    /* TITLE */

    document.title =
      `${titulo} — AfricanMundo`;


    /* DESCRIPTION */

    const metaDescription =
      document.querySelector(
        "#meta-description"
      );

    if(metaDescription){

      metaDescription.setAttribute(
        "content",
        descricao
      );

    }


    /* CANONICAL */

    const canonical =
      document.querySelector(
        "#canonical-url"
      );

    if(canonical){

      canonical.setAttribute(
        "href",
        url
      );

    }


    /* OPEN GRAPH */

    const ogTitle =
      document.querySelector(
        "#og-title"
      );

    const ogDescription =
      document.querySelector(
        "#og-description"
      );

    const ogImage =
      document.querySelector(
        "#og-image"
      );

    const ogUrl =
      document.querySelector(
        "#og-url"
      );


    if(ogTitle){

      ogTitle.setAttribute(
        "content",
        titulo
      );

    }

    if(ogDescription){

      ogDescription.setAttribute(
        "content",
        descricao
      );

    }

    if(
      ogImage &&
      imagem
    ){

      ogImage.setAttribute(
        "content",
        imagem
      );

    }

    if(ogUrl){

      ogUrl.setAttribute(
        "content",
        url
      );

    }


    /* TWITTER */

    const twitterTitle =
      document.querySelector(
        "#twitter-title"
      );

    const twitterDescription =
      document.querySelector(
        "#twitter-description"
      );

    const twitterImage =
      document.querySelector(
        "#twitter-image"
      );


    if(twitterTitle){

      twitterTitle.setAttribute(
        "content",
        titulo
      );

    }

    if(twitterDescription){

      twitterDescription.setAttribute(
        "content",
        descricao
      );

    }

    if(
      twitterImage &&
      imagem
    ){

      twitterImage.setAttribute(
        "content",
        imagem
      );

    }


    /* NEWSARTICLE */

    const schema =
      document.querySelector(
        "#schema-news"
      );


    if(schema){

      const estrutura = {

        "@context":
          "https://schema.org",

        "@type":
          "NewsArticle",

        "headline":
          titulo,

        "description":
          descricao,

        "image":
          imagem
            ? [imagem]
            : [],

        "datePublished":
          dataPublicada || "",

        "dateModified":
          dataPublicada || "",

        "articleSection":
          categoria,

        "inLanguage":
          "pt-MZ",

        "author":{

          "@type":
            "Organization",

          "name":
            "AfricanMundo"

        },

        "publisher":{

          "@type":
            "Organization",

          "name":
            "AfricanMundo",

          "url":
            "https://majaua1999.github.io/Africanmundo-/"

        },

        "mainEntityOfPage":{

          "@type":
            "WebPage",

          "@id":
            url

        }

      };


      schema.textContent =
        JSON.stringify(
          estrutura
        );

    }


    console.log(
      "✅ SEO atualizado:",
      titulo
    );

  }catch(e){

    console.warn(
      "Aviso SEO:",
      e
    );

  }

}


/* ==========================================
   MOSTRAR NOTÍCIA
========================================== */

function mostrarNoticia(n){

  noticiaAtual = n;

  const area =
    document.getElementById(
      "noticia"
    );

  if(!area){

    return;

  }


  const titulo =
    obterTitulo(n);

  const texto =
    obterTexto(n);

  const imagem =
    obterImagem(n);

  const categoria =
    obterCategoria(n);

  const data =
    formatarData(
      obterData(n)
    );

  const visualizacoes =
    Number(
      n?.visualizacoes || 0
    );


  let imagemHTML = "";


  if(imagem){

    imagemHTML = `

      <img

        class="article-image"

        src="${esc(imagem)}"

        alt="${esc(titulo)}"

        loading="eager"

        decoding="async"

        fetchpriority="high"

        onclick="abrirFotoGrande('${esc(imagem)}')"

        onerror="
          this.style.display='none'
        "

      >

    `;

  }


  const textoSeguro =
    esc(texto);


  const paragrafos =
    textoSeguro
      .split(/\n+/)
      .filter(Boolean)
      .map(
        p => `<p>${p}</p>`
      )
      .join("");


  area.className =
    "article";


  area.innerHTML = `

    ${imagemHTML}

    <div class="article-content">

      <div class="article-category">
        ${esc(categoria)}
      </div>

      <h1>
        ${esc(titulo)}
      </h1>

      <div class="article-meta">

        ${
          data
            ? `<span>📅 ${esc(data)}</span>`
            : ""
        }

        <span>
          👁️ ${visualizacoes} visualizações
        </span>

      </div>

      <div class="article-text">

        ${paragrafos}

      </div>

      <div class="article-actions">

        <button
          type="button"
          onclick="partilhar()"
        >
          ↗ Partilhar
        </button>

        ${
          imagem
            ? `
              <button
                type="button"
                onclick="guardarFoto()"
              >
                🖼️ Guardar imagem
              </button>
            `
            : ""
        }

      </div>

    </div>

  `;

}


/* ==========================================
   CONTAR VISUALIZAÇÃO
========================================== */

async function contarVisualizacao(id){

  try{

    if(!db){

      return;

    }

    const resultado =
      await db.rpc(
        "incrementar_visualizacao",
        {
          noticia_id:
            Number(id)
        }
      );


    if(resultado.error){

      console.warn(
        "Aviso visualização:",
        resultado.error
      );

    }

  }catch(e){

    console.warn(
      "Erro visualização:",
      e
    );

  }

}


/* ==========================================
   MAIS NOTÍCIAS
========================================== */

async function mostrarMaisNoticias(){

  const area =
    document.getElementById(
      "maisNoticias"
    );

  if(!area){

    return;

  }


  try{

    if(!db){

      iniciarSupabase();

    }


    if(!db){

      return;

    }


    const resultado =
      await db
        .from("noticias")
        .select(
          "id,titulo,texto,imagem,categoria,data,fonte,url_original"
        )
        .neq(
          "id",
          noticiaAtual?.id
        )
        .order(
          "id",
          {
            ascending:false
          }
        )
        .limit(6);


    if(resultado.error){

      throw resultado.error;

    }


    const noticias =
      resultado.data || [];


    if(!noticias.length){

      area.innerHTML = "";

      return;

    }


    area.innerHTML =
      noticias.map(
        n => {

          const imagem =
            obterImagem(n);

          const titulo =
            obterTitulo(n);

          const categoria =
            obterCategoria(n);


          return `

            <article
              class="news-card"
              onclick="abrirNoticia('${esc(n.id)}')"
            >

              ${
                imagem
                  ? `
                    <img
                      src="${esc(imagem)}"
                      alt="${esc(titulo)}"
                      loading="lazy"
                      decoding="async"
                    >
                  `
                  : `
                    <div
                      style="
                        height:150px;
                        display:grid;
                        place-items:center;
                        background:#168a45;
                        color:white;
                        font-size:38px;
                      "
                    >
                      🌍
                    </div>
                  `
              }

              <div
                class="news-card-content"
              >

                <div
                  class="news-card-category"
                >
                  ${esc(categoria)}
                </div>

                <h3>
                  ${esc(titulo)}
                </h3>

              </div>

            </article>

          `;

        }
      ).join("");


  }catch(e){

    console.warn(
      "Erro notícias relacionadas:",
      e
    );

  }

}


/* ==========================================
   ABRIR NOTÍCIA
========================================== */

function abrirNoticia(id){

  if(!id){

    return;

  }

  window.location.href =
    `noticia.html?id=${encodeURIComponent(id)}`;

}


/* ==========================================
   PARTILHAR
========================================== */

async function partilhar(){

  const titulo =
    obterTitulo(
      noticiaAtual || {}
    );

  const url =
    window.location.href;


  try{

    if(
      navigator.share
    ){

      await navigator.share({

        title:
          titulo,

        text:
          `${titulo} — AfricanMundo`,

        url:
          url

      });

      return;

    }


    if(
      navigator.clipboard
    ){

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "Link copiado! Pode partilhar onde quiser."
      );

      return;

    }


    prompt(
      "Copie o link da notícia:",
      url
    );


  }catch(e){

    console.warn(
      "Partilha cancelada:",
      e
    );

  }

}


/* ==========================================
   GUARDAR FOTO
========================================== */

async function guardarFoto(){

  const imagem =
    obterImagem(
      noticiaAtual || {}
    );


  if(!imagem){

    alert(
      "Esta notícia não possui imagem."
    );

    return;

  }


  try{

    const resposta =
      await fetch(imagem);


    if(!resposta.ok){

      throw new Error(
        "Não foi possível obter a imagem."
      );

    }


    const blob =
      await resposta.blob();


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href =
      url;

    link.download =
      "africanmundo-imagem.jpg";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      () =>
        URL.revokeObjectURL(url),
      1000
    );


  }catch(e){

    console.warn(
      "Erro ao guardar imagem:",
      e
    );


    window.open(
      imagem,
      "_blank"
    );

  }

}


/* ==========================================
   IMAGEM GRANDE
========================================== */

function abrirFotoGrande(imagem){

  const viewer =
    document.getElementById(
      "imageViewer"
    );

  const img =
    document.getElementById(
      "imageViewerImg"
    );


  if(!viewer || !img){

    return;

  }


  img.src =
    imagem;


  viewer.classList.add(
    "active"
  );


  document.body.style.overflow =
    "hidden";

}


function fecharFotoGrande(event){

  if(event){

    event.stopPropagation();

  }


  const viewer =
    document.getElementById(
      "imageViewer"
    );


  if(viewer){

    viewer.classList.remove(
      "active"
    );

  }


  document.body.style.overflow =
    "";

}


/* ==========================================
   VOLTAR
========================================== */

function voltar(){

  if(
    document.referrer &&
    document.referrer.includes(
      "majaua1999.github.io"
    )
  ){

    history.back();

  }else{

    window.location.href =
      "index.html";

  }

}


/* ==========================================
   MODO ESCURO
========================================== */

function aplicarTema(){

  const tema =
    localStorage.getItem(
      "am_dark"
    );


  if(
    tema === "true"
  ){

    document.body.classList.add(
      "dark"
    );

  }else{

    document.body.classList.remove(
      "dark"
    );

  }

}


function alternarTema(){

  const ativado =
    document.body.classList.toggle(
      "dark"
    );


  localStorage.setItem(
    "am_dark",
    ativado
      ? "true"
      : "false"
  );

}


/* ==========================================
   CARREGAR NOTÍCIA
========================================== */

async function carregar(){

  const area =
    document.getElementById(
      "noticia"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const id =
    params.get("id");


  if(!id){

    area.className =
      "error";


    area.innerHTML = `

      <h2>
        Notícia não encontrada
      </h2>

      <p>
        O endereço desta notícia está incompleto.
      </p>

      <button
        onclick="window.location.href='index.html'"
        style="
          border:0;
          background:#168a45;
          color:white;
          padding:10px 16px;
          border-radius:8px;
          cursor:pointer;
        "
      >
        Voltar ao início
      </button>

    `;

    return;

  }


  try{

    if(!db){

      const iniciado =
        iniciarSupabase();


      if(
        !iniciado ||
        !db
      ){

        throw new Error(
          "Supabase não disponível."
        );

      }

    }


    /* ==============================
       CARREGAR APENAS OS CAMPOS
       NECESSÁRIOS
    ============================== */

    const resultado =
      await db
        .from("noticias")
        .select(
          "id,titulo,texto,imagem,categoria,data,fonte,url_original,visualizacoes"
        )
        .eq(
          "id",
          id
        )
        .single();


    if(resultado.error){

      throw resultado.error;

    }


    if(!resultado.data){

      throw new Error(
        "Notícia não encontrada."
      );

    }


    const noticia =
      resultado.data;


    noticiaAtual =
      noticia;


    /* SEO */

    atualizarSEO(
      noticia
    );


    /* MOSTRAR */

    mostrarNoticia(
      noticia
    );


    /* VISUALIZAÇÃO */

    contarVisualizacao(
      noticia.id
    );


    /* RELACIONADAS */

    mostrarMaisNoticias();


  }catch(e){

    console.error(
      "❌ Erro ao carregar notícia:",
      e
    );


    area.className =
      "error";


    area.innerHTML = `

      <h2>
        Não foi possível carregar a notícia
      </h2>

      <p>
        Verifique a sua ligação à Internet
        e tente novamente.
      </p>

      <button
        onclick="location.reload()"
        style="
          border:0;
          background:#168a45;
          color:white;
          padding:10px 16px;
          border-radius:8px;
          cursor:pointer;
        "
      >
        🔄 Tentar novamente
      </button>

    `;

  }

}

document.addEventListener(
