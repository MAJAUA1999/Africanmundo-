<!DOCTYPE html>
<html lang="pt-MZ">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#168a45">

<title>AfricanMundo — Notícia</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --p:#168a45;
  --bg:#f5f7f8;
  --card:#fff;
  --txt:#172026;
  --muted:#69757d;
  --border:#e2e7ea;
}
  
  body.dark{
  --bg:#101417;
  --card:#171d21;
  --txt:#f2f5f6;
  --muted:#aab5ba;
  --border:#293238;
  }

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--txt);
}

.container{
  width:min(1000px,calc(100% - 24px));
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.top{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  color:var(--p);
  font-size:19px;
  font-weight:900;
}

.actions{
  display:flex;
  gap:7px;
}

button{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--txt);
  border-radius:10px;
  padding:9px 12px;
  font-weight:800;
  cursor:pointer;
}

main{
  padding:22px 0 50px;
}

.article{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.article img{
  width:100%;
  max-height:480px;
  object-fit:cover;
  display:block;
}

.content{
  padding:22px;
}

.category{
  color:var(--p);
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}

h1{
  margin:8px 0;
  font-size:32px;
  line-height:1.2;
}

.date{
  color:var(--muted);
  font-size:12px;
  margin:10px 0 20px;
}

.text{
  font-size:17px;
  line-height:1.8;
  white-space:pre-line;
}

.loading{
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

.section{
  margin-top:30px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.section-title h2{
  margin:0;
  font-size:20px;
}

.news-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}

.news-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
}

.news-card img,
.no-image{
  width:100%;
  height:170px;
  object-fit:cover;
  display:block;
}

.no-image{
  display:grid;
  place-items:center;
  background:var(--bg);
  font-size:42px;
}

.news-content{
  padding:13px;
}

.news-category{
  color:var(--p);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

.news-title{
  margin:5px 0;
  font-size:16px;
  line-height:1.35;
}

.news-date{
  color:var(--muted);
  font-size:10px;
  margin-top:8px;
}

@media(max-width:600px){
  h1{font-size:24px}
  .text{font-size:15px}
  .news-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .news-card img,.no-image{height:130px}
  .news-title{font-size:14px}
  .content{padding:16px}
}

@media(max-width:380px){
  .news-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <div class="container top">

    <div class="logo">
      🌍 AfricanMundo
    </div>

    <div class="actions">

      <button onclick="history.back()">
        ← Voltar
      </button>

      <button onclick="partilhar()">
        📤 Partilhar
      </button>

    </div>

  </div>
</header>

<main>

  <div class="container">

    <article id="noticia" class="article">
      <div class="loading">
        ⏳ A carregar notícia...
      </div>
    </article>

    <section class="section">

      <div class="section-title">
        <h2>📰 Mais notícias</h2>
      </div>

      <div id="maisNoticias" class="news-grid">
        <div class="loading">
          ⏳ A carregar...
        </div>
      </div>

    </section>

  </div>

</main>

<script>

const SUPABASE_URL =
"https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const id =
new URLSearchParams(location.search).get("id");

let noticiaAtual = null;
let todasNoticias = [];


/* SEGURANÇA */

function esc(v){
  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* CAMPOS */

function titulo(n){
  return n?.titulo ||
         n?.title ||
         "Sem título";
}

function texto(n){
  return n?.texto ||
         n?.conteudo ||
         n?.content ||
         n?.descricao ||
         "";
}

function imagem(n){
  return n?.imagem ||
         n?.imagem_url ||
         n?.image ||
         n?.image_url ||
         n?.url_imagem ||
         "";
}

function cat(n){
  return n?.categoria ||
         n?.category ||
         "Notícias";
}

function data(n){

  const valor =
    n?.created_at ||
    n?.data ||
    n?.createdAt;

  if(!valor) return "";

  const d = new Date(valor);

  if(isNaN(d.getTime())) return "";

  return d.toLocaleDateString(
    "pt-MZ",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  ) + " • " +
  d.toLocaleTimeString(
    "pt-MZ",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


/* CARREGAR */

async function carregar(){

  const area =
    document.getElementById("noticia");

  const mais =
    document.getElementById("maisNoticias");

  if(!id){

    area.innerHTML =
      `<div class="loading">
        ❌ Notícia não encontrada.
      </div>`;

    return;
  }

  try{

    const resultado =
      await db
        .from("noticias")
        .select("*")
        .order("id",{ascending:false});

    if(resultado.error)
      throw resultado.error;

    todasNoticias =
      Array.isArray(resultado.data)
        ? resultado.data
        : [];

    noticiaAtual =
      todasNoticias.find(
        n => String(n.id) === String(id)
      );

    if(!noticiaAtual){

      area.innerHTML =
        `<div class="loading">
          ❌ Esta notícia não existe.
        </div>`;

      return;
    }

    mostrarNoticia(
      noticiaAtual
    );

    mostrarMaisNoticias();

  }catch(error){

    console.error(error);

    area.innerHTML =
      `<div class="loading">
        ⚠️ Não foi possível carregar a notícia.
        <br><br>
        ${esc(error.message)}
      </div>`;

  }

}


/* MOSTRAR NOTÍCIA */

function mostrarNoticia(n){

  const area =
    document.getElementById("noticia");

  const img =
    imagem(n);

  area.innerHTML = `

    ${
  img
  ? `
    <div class="photo-box">
      <img
        id="fotoNoticia"
        src="${esc(img)}"
        alt="${esc(titulo(n))}"
        onerror="this.style.display='none'"
      >

      <button
        class="save-photo"
        onclick="guardarFoto()">
        ⬇️ Guardar foto
      </button>
    </div>
  `
  : ""
    }

    <div class="content">

      <div class="category">
        ${esc(cat(n))}
      </div>

      <h1>
        ${esc(titulo(n))}
      </h1>

      <div class="date">
        📅 ${esc(data(n))}
      </div>

      <div class="text">
        ${esc(texto(n))}
      </div>

    </div>
  `;

}


/* MAIS NOTÍCIAS */

function mostrarMaisNoticias(){

  const area =
    document.getElementById(
      "maisNoticias"
    );

  const outras =
    todasNoticias
      .filter(
        n =>
          String(n.id) !==
          String(id)
      )
      .slice(0,6);

  area.innerHTML = "";

  if(!outras.length){

    area.innerHTML =
      `<div class="loading">
        Não existem outras notícias.
      </div>`;

    return;
  }

  outras.forEach(n => {

    const card =
      document.createElement("article");

    card.className =
      "news-card";

    card.onclick = () =>
      abrirNoticia(n.id);

    const img =
      imagem(n);

    card.innerHTML = `

      ${
        img
        ? `<img
            src="${esc(img)}"
            alt="${esc(titulo(n))}"
            loading="lazy"
            onerror="this.style.display='none'"
          >`
        : `<div class="no-image">🌍</div>`
      }

      <div class="news-content">

        <div class="news-category">
          ${esc(cat(n))}
        </div>

        <div class="news-title">
          ${esc(titulo(n))}
        </div>

        <div class="news-date">
          ${esc(data(n))}
        </div>

      </div>
    `;

    area.appendChild(card);

  });

}


/* ABRIR OUTRA */

function abrirNoticia(novoId){

  if(!novoId) return;

  location.href =
    "noticia.html?id=" +
    encodeURIComponent(novoId);

}


/* PARTILHAR */

async function partilhar(){

  if(!noticiaAtual) return;

  const dados = {
    title: titulo(noticiaAtual),
    text: "Leia esta notícia no AfricanMundo.",
    url: location.href
  };

  try{

    if(navigator.share){

      await navigator.share(dados);

    }else{

      await navigator.clipboard.writeText(
        location.href
      );

      alert("🔗 Link copiado!");

    }

  }catch(e){

    console.log("Partilha cancelada.");

  }

}

  async function guardarFoto(){

  const foto =
    document.getElementById("fotoNoticia");

  if(!foto?.src) return;

  try{

    const resposta =
      await fetch(foto.src);

    const blob =
      await resposta.blob();

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;
    a.download = "africanmundo-foto.jpg";

    document.body.appendChild(a);
    a.click();
    a.remove();

    URL.revokeObjectURL(url);

  }catch(e){

    window.open(foto.src,"_blank");

  }

  }

/* INICIAR */

document.addEventListener(
  "DOMContentLoaded",
  carregar
);

</script>

</body>
</html>
