  <script>
        /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://sonzwfhepjfvzltuxxne.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       SEGURANÇA
    ===================================== */

    function esc(valor) {

      return String(valor ?? "").replace(
        /[&<>"']/g,
        function(m) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[m];

        }
      );

    }


    /* =====================================
       DATA + HORA
    ===================================== */

    function formatarData(data) {

      if (!data) {
        return "";
      }

      const d = new Date(data);

      if (isNaN(d.getTime())) {
        return "";
      }

      return d.toLocaleString(
        "pt-MZ",
        {
          day: "2-digit",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =====================================
       FOTO GRANDE
    ===================================== */

    function abrirFotoGrande(url, titulo) {

      const viewer =
        document.getElementById("photoViewer");

      const img =
        document.getElementById("photoViewerImg");

      if (!viewer || !img || !url) {
        return;
      }

      img.src = url;

      img.alt =
        titulo ||
        "Imagem ampliada";

      viewer.classList.add("show");

      document.body.style.overflow =
        "hidden";

    }


    function fecharFotoGrande(event) {

      if (
        event &&
        event.target &&
        event.target.id ===
        "photoViewerImg"
      ) {
        return;
      }

      const viewer =
        document.getElementById("photoViewer");

      const img =
        document.getElementById("photoViewerImg");

      if (!viewer || !img) {
        return;
      }

      viewer.classList.remove("show");

      img.src = "";

      document.body.style.overflow = "";

    }


    /* =====================================
       TECLA ESC
    ===================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {
          fecharFotoGrande();
        }

      }
    );


    /* =====================================
       PARTILHAR
    ===================================== */

    async function partilharNoticia() {

      const url =
        window.location.href;

      const titulo =
        document.querySelector(
          ".article-title"
        )?.innerText ||
        "AfricanMundo";

      if (navigator.share) {

        try {

          await navigator.share({
            title: titulo,
            text:
              "Confira esta notícia no AfricanMundo.",
            url: url
          });

        }

        catch (erro) {

          console.log(
            "Partilha cancelada."
          );

        }

      }

      else {

        try {

          await navigator.clipboard.writeText(
            url
          );

          alert(
            "🔗 Link da notícia copiado!"
          );

        }

        catch (erro) {

          alert(
            "Copie o endereço desta página para partilhar."
          );

        }

      }

    }


    /* =====================================
       FAVORITOS
    ===================================== */

    function obterFavoritos() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "africanmundo_favoritos"
          ) || "[]"
        );

      }

      catch (erro) {

        console.error(
          "Erro ao ler favoritos:",
          erro
        );

        return [];

      }

    }


    function verificarFavorito(id) {

      return obterFavoritos().includes(
        String(id)
      );

    }


    function atualizarBotaoFavorito(id) {

      const botao =
        document.getElementById(
          "favoriteButton"
        );

      if (!botao) {
        return;
      }

      if (verificarFavorito(id)) {

        botao.innerHTML =
          "❤️ Favoritado";

        botao.classList.add("active");

      }

      else {

        botao.innerHTML =
          "🤍 Favoritar";

        botao.classList.remove("active");

      }

    }


    function alternarFavorito() {

      const url =
        new URL(window.location.href);

      const id =
        url.searchParams.get("id");

      if (!id) {
        return;
      }

      const idLimpo =
        String(id).trim();

      let favoritos =
        obterFavoritos();

      const indice =
        favoritos.indexOf(idLimpo);

      if (indice === -1) {

        favoritos.push(idLimpo);

      }

      else {

        favoritos.splice(indice, 1);

      }

      localStorage.setItem(
        "africanmundo_favoritos",
        JSON.stringify(favoritos)
      );

      atualizarBotaoFavorito(idLimpo);

    }


    function iniciarFavorito() {

      const url =
        new URL(window.location.href);

      const id =
        url.searchParams.get("id");

      if (!id) {
        return;
      }

      atualizarBotaoFavorito(
        String(id).trim()
      );

    }
        /* =====================================
       MAIS NOTÍCIAS
    ===================================== */

    async function carregarMaisNoticias(noticiaAtualId) {

      const article =
        document.getElementById("article");

      if (!article) {
        return;
      }

      try {

        const resultado =
          await supabaseClient
            .from("noticias")
            .select("*")
            .neq("id", noticiaAtualId)
            .order("id", {
              ascending: false
            })
            .limit(3);

        if (resultado.error) {

          console.error(
            "Erro ao carregar mais notícias:",
            resultado.error
          );

          return;
        }

        const noticias =
          Array.isArray(resultado.data)
            ? resultado.data
            : [];

        if (noticias.length === 0) {
          return;
        }

        const cards =
          noticias.map(function(noticia) {

            const titulo =
              noticia.titulo ||
              noticia.title ||
              noticia.nome ||
              "Sem título";

            const categoria =
              noticia.categoria ||
              noticia.category ||
              noticia.cat ||
              "Notícias";

            const imagem =
              String(
                noticia.imagem ??
                noticia.Imagem ??
                noticia.image ??
                noticia.imagem_url ??
                noticia.image_url ??
                ""
              ).trim();

            const link =
              "noticia.html?id=" +
              encodeURIComponent(
                noticia.id
              );

            let imagemHTML = `
              <div
                class="related-placeholder"
                style="display:flex;"
              >
                🌍
              </div>
            `;

            if (imagem) {

              imagemHTML = `
                <img
                  class="related-card-image"
                  src="${esc(imagem)}"
                  alt="${esc(titulo)}"
                  loading="lazy"
                  onerror="
                    this.style.display='none';
                    this.nextElementSibling.style.display='flex';
                  "
                >

                <div
                  class="related-placeholder"
                  style="display:none;"
                >
                  🌍
                </div>
              `;

            }

            return `
              <a
                class="related-card"
                href="${link}"
              >

                ${imagemHTML}

                <div class="related-content">

                  <div class="related-category">
                    ${esc(categoria)}
                  </div>

                  <h3>
                    ${esc(titulo)}
                  </h3>

                </div>

              </a>
            `;

          }).join("");

        const secao =
          document.createElement("section");

        secao.className =
          "related-news";

        secao.innerHTML = `

          <h2 class="related-news-title">
            📰 Mais notícias
          </h2>

          <div class="related-news-grid">
            ${cards}
          </div>

        `;

        article.parentNode.appendChild(
          secao
        );

      }

      catch (erro) {

        console.error(
          "Erro ao carregar mais notícias:",
          erro
        );

      }

    }


    /* =====================================
       COMENTÁRIOS — CARREGAR
    ===================================== */

    async function carregarComentarios(noticiaId) {

      const lista =
        document.getElementById(
          "commentsList"
        );

      if (!lista) {
        return;
      }

      lista.innerHTML = `
        <div class="comments-empty">
          🔄 A carregar comentários...
        </div>
      `;

      try {

        const resultado =
          await supabaseClient
            .from("comentarios")
            .select("*")
            .eq("noticia_id", noticiaId)
            .order("id", {
              ascending: false
            });

        if (resultado.error) {

          console.error(
            "Erro ao carregar comentários:",
            resultado.error
          );

          lista.innerHTML = `
            <div class="comments-error">
              ❌ Não foi possível carregar os comentários.
            </div>
          `;

          return;
        }

        const comentarios =
          Array.isArray(resultado.data)
            ? resultado.data
            : [];

        if (comentarios.length === 0) {

          lista.innerHTML = `
            <div class="comments-empty">
              💬 Ainda não existem comentários.
              Seja o primeiro a comentar!
            </div>
          `;

          return;
        }

        lista.innerHTML =
          comentarios.map(function(item) {

            const nome =
              item.nome ||
              "Visitante";

            const texto =
              item.comentario ||
              "";

            const data =
              item.criado_em
                ? formatarData(
                    item.criado_em
                  )
                : "";

            return `
              <div class="comment-item">

                <div class="comment-name">
                  👤 ${esc(nome)}
                </div>

                ${
                  data
                    ? `
                      <div class="comment-date">
                        📅 ${esc(data)}
                      </div>
                    `
                    : ""
                }

                <div class="comment-text">
                  ${esc(texto)}
                </div>

              </div>
            `;

          }).join("");

      }

      catch (erro) {

        console.error(
          "Erro nos comentários:",
          erro
        );

        lista.innerHTML = `
          <div class="comments-error">
            ❌ Ocorreu um erro ao carregar os comentários.
          </div>
        `;

      }

    }

  return String(id).trim();

}


/* =====================================
   CRIAR SEÇÃO DE COMENTÁRIOS
===================================== */

function criarSecaoComentarios(noticiaId) {

  const article =
    document.getElementById("article");

  if (!article) {
    return;
  }

  /* Evitar duplicação */

  const antiga =
    document.getElementById(
      "commentsSection"
    );

  if (antiga) {
    antiga.remove();
  }

  const section =
    document.createElement("section");

  section.id =
    "commentsSection";

  section.className =
    "comments-section";

  section.innerHTML = `

    <h2 class="comments-title">
      💬 Comentários
    </h2>

    <form
      class="comments-form"
      id="commentsForm"
      onsubmit="publicarComentario(event)"
    >

      <input
        type="text"
        id="commentName"
        placeholder="Seu nome"
        maxlength="80"
        required
      >

      <textarea
        id="commentText"
        placeholder="Escreva o seu comentário..."
        maxlength="1000"
        required
      ></textarea>

      <button
        type="submit"
        class="comments-submit"
        id="commentsSubmit"
      >
        💬 Publicar comentário
      </button>

      <div
        id="commentsMessage"
        style="display:none;"
      ></div>

    </form>

    <div
      id="commentsList"
      class="comments-list"
    >
      🔄 A carregar comentários...
    </div>

  `;

  article.parentNode.appendChild(
    section
  );

  carregarComentarios(
    noticiaId
  );

    }
    
/* =====================================
   CARREGAR COMENTÁRIOS
===================================== */

async function carregarComentarios(
  noticiaId
) {

  const lista =
    document.getElementById(
      "commentsList"
    );

  if (!lista || !noticiaId) {
    return;
  }


  lista.innerHTML = `

    <div class="comments-empty">
      🔄 A carregar comentários...
    </div>

  `;


  try {

    const resultado =
      await supabaseClient
        .from("comentarios")
        .select(
          "id, noticia_id, nome, comentário, criado_em"
        )
        .eq(
          "noticia_id",
          noticiaId
        )
        .order(
          "criado_em",
          {
            ascending: false
          }
        );


    if (resultado.error) {

      console.error(
        "Erro ao carregar comentários:",
        resultado.error
      );


      lista.innerHTML = `

        <div class="comments-error">

          ❌ Não foi possível carregar os comentários.

        </div>

      `;

      return;

    }


    const comentarios =
      Array.isArray(resultado.data)
        ? resultado.data
        : [];


    if (comentarios.length === 0) {

      lista.innerHTML = `

        <div class="comments-empty">

          💬 Ainda não existem comentários.
          Seja o primeiro a comentar!

        </div>

      `;

      return;

    }


    lista.innerHTML =
      comentarios
        .map(
          function(comentario) {

            const nome =
              comentario.nome ||
              "Visitante";


            const texto =
  comentario.comentario ||
  comentario.comentário ||
  comentario.texto ||
  "";


            const data =
              comentario.criado_em
                ? formatarData(
                    comentario.criado_em
                  )
                : "";


            return `

              <div
                class="comment-item"
              >

                <div
                  class="comment-name"
                >

                  👤 ${esc(nome)}

                </div>


                ${
                  data
                    ? `

                      <div
                        class="comment-date"
                      >

                        📅 ${esc(data)}

                      </div>

                    `
                    : ""
                }


                <div
                  class="comment-text"
                >

                  ${esc(texto)}

                </div>

              </div>

            `;

          }
        )
        .join("");

  }

  catch (erro) {

    console.error(
      "Erro inesperado nos comentários:",
      erro
    );


    lista.innerHTML = `

      <div class="comments-error">

        ❌ Ocorreu um erro ao carregar os comentários.

      </div>

    `;

  }

}


/* =====================================
   PUBLICAR COMENTÁRIO
===================================== */

async function publicarComentario(
  event
) {

  event.preventDefault();


  const nomeInput =
    document.getElementById(
      "commentName"
    );


  const textoInput =
    document.getElementById(
      "commentText"
    );


  const botao =
    document.getElementById(
      "commentsSubmit"
    );


  const mensagem =
    document.getElementById(
      "commentsMessage"
    );


  if (
    !nomeInput ||
    !textoInput ||
    !botao
  ) {

    return;

  }


  const noticiaId =
    obterIdNoticiaAtual();


  const nome =
    nomeInput.value.trim();


  const texto =
    textoInput.value.trim();


  if (!noticiaId) {

    alert(
      "❌ Não foi possível identificar a notícia."
    );

    return;

  }


  if (!nome) {

    alert(
      "⚠️ Digite o seu nome."
    );

    nomeInput.focus();

    return;

  }


  if (!texto) {

    alert(
      "⚠️ Escreva um comentário."
    );

    textoInput.focus();

    return;

  }


  if (nome.length > 80) {

    alert(
      "⚠️ O nome deve ter no máximo 80 caracteres."
    );

    return;

  }


  if (texto.length > 1000) {

    alert(
      "⚠️ O comentário deve ter no máximo 1000 caracteres."
    );

    return;

  }


  botao.disabled = true;

  botao.innerHTML =
    "⏳ A publicar...";


  if (mensagem) {

    mensagem.style.display =
      "none";

  }


  try {

    const dadosComentario = {

      noticia_id:
        noticiaId,

      nome:
        nome,

      comentario:
  texto

    };


    const resultado =
      await supabaseClient
        .from("comentarios")
        .insert(
          [dadosComentario]
        );


    if (resultado.error) {

      console.error(
        "Erro ao publicar comentário:",
        resultado.error
      );


      if (mensagem) {

        mensagem.style.display =
          "block";

        mensagem.className =
          "comments-error";

        mensagem.textContent =
          "❌ Não foi possível publicar o comentário.";

      }

      return;

    }


    /* Limpar formulário */

    nomeInput.value =
      "";

    textoInput.value =
      "";


    if (mensagem) {

      mensagem.style.display =
        "block";

      mensagem.className =
        "comments-empty";

      mensagem.textContent =
        "✅ Comentário publicado com sucesso!";

    }


    /* Atualizar lista */

    await carregarComentarios(
      noticiaId
    );

  }

  catch (erro) {

    console.error(
      "Erro ao publicar comentário:",
      erro
    );


    if (mensagem) {

      mensagem.style.display =
        "block";

      mensagem.className =
        "comments-error";

      mensagem.textContent =
        "❌ Ocorreu um erro ao publicar o comentário.";

    }

  }

  finally {

    botao.disabled =
      false;

    botao.innerHTML =
      "💬 Publicar comentário";

  }

}


/* =====================================
   INICIAR COMENTÁRIOS
===================================== */

function iniciarComentarios() {

  const id =
    obterIdNoticiaAtual();


  if (!id) {
    return;
  }


  criarSecaoComentarios(
    id
  );

}

</script>
<script>

/* =====================================
   PARTE 6 — INICIALIZAÇÃO FINAL
===================================== */

/*
   Inicia os comentários depois que
   a página terminar de carregar.
*/

document.addEventListener(
  "DOMContentLoaded",
  function() {

    iniciarComentarios();

  }
);

   periodicamente.

setInterval(

    const id =
      obterIdNoticiaAtual();

    if (!id) {
      return;
    }

    carregarComentarios(id);

  },
  30000
);
