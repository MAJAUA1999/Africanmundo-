<!doctype html>
<html lang="pt">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Notícia — AfricanMundo</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    .article-page {
      max-width: 900px;
      margin: 0 auto;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }

    .article {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    .article-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .article-content {
      padding: 28px;
    }

    .article-category {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .article-date {
      display: block;
      margin-bottom: 16px;
      color: #666;
      font-size: 14px;
    }

    .article-title {
      margin: 0 0 20px;
      font-size: 36px;
      line-height: 1.2;
    }

    .article-text {
      font-size: 19px;
      line-height: 1.85;
      white-space: pre-wrap;
    }

    .share-button {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .loading,
    .error-box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
    }

    @media (max-width: 600px) {

      .article-image {
        max-height: 300px;
      }

      .article-content {
        padding: 18px;
      }

      .article-title {
        font-size: 27px;
      }

      .article-text {
        font-size: 17px;
        line-height: 1.75;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="top">
    🌍 AfricanMundo
  </div>

</header>

<main>

  <section class="news-section article-page">

    <a
      class="back-button"
      href="javascript:history.back()"
    >
      ← Voltar
    </a>

    <div id="article">

      <div class="loading">
        🔄 A carregar notícia...
      </div>

    </div>

  </section>

</main>

<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   SEGURANÇA
===================================== */

function esc(valor) {

  return String(valor ?? "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}


/* =====================================
   DATA
===================================== */

function formatarData(data) {

  if (!data) {
    return "";
  }

  const d = new Date(data);

  if (isNaN(d.getTime())) {
    return "";
  }

  return d.toLocaleDateString(
    "pt-PT",
    {
      day: "2-digit",
      month: "long",
      year: "numeric"
    }
  );

}


/* =====================================
   CARREGAR NOTÍCIA
===================================== */

async function carregarNoticia() {

  const article =
    document.getElementById("article");


  /* ===================================
     PEGAR ID DA URL
  =================================== */

  const url =
    new URL(
      window.location.href
    );


  const id =
    url.searchParams.get("id");


  console.log(
    "URL atual:",
    window.location.href
  );


  console.log(
    "ID recebido:",
    id
  );


  /* ===================================
     VERIFICAR ID
  =================================== */

  if (!id) {

    article.innerHTML = `

      <div class="error-box">

        ❌ Nenhuma notícia foi selecionada.

        <br><br>

        <small>
          Esta página precisa receber um ID.
          <br>
          Exemplo: noticia.html?id=1
        </small>

      </div>

    `;

    return;
  }


  /* ===================================
     LIMPAR ID
  =================================== */

  const idLimpo =
    String(id).trim();


  if (idLimpo === "") {

    article.innerHTML = `

      <div class="error-box">

        ❌ O ID da notícia está vazio.

      </div>

    `;

    return;
  }


  try {

    /* =================================
       BUSCAR NOTÍCIA
    ================================= */

    const resultado =
      await supabaseClient
        .from("noticias")
        .select("*")
        .eq("id", idLimpo)
        .maybeSingle();


    const data =
      resultado.data;


    const error =
      resultado.error;


    console.log(
      "Notícia recebida:",
      data
    );


    /* =================================
       ERRO
    ================================= */

    if (error) {

      console.error(
        "Erro Supabase:",
        error
      );


      article.innerHTML = `

        <div class="error-box">

          ❌ Não foi possível carregar esta notícia.

          <br><br>

          <small>
            ${esc(error.message)}
          </small>

        </div>

      `;

      return;
    }


    /* =================================
       NÃO ENCONTROU
    ================================= */

    if (!data) {

      article.innerHTML = `

        <div class="error-box">

          ❌ Notícia não encontrada.

          <br><br>

          <small>
            ID procurado:
            ${esc(idLimpo)}
          </small>

        </div>

      `;

      return;
    }


    /* =================================
       DADOS
    ================================= */

    const titulo =
      data.titulo ||
      data.title ||
      data.nome ||
      "Sem título";


    const texto =
      data.texto ||
      data.body ||
      data.conteudo ||
      data.content ||
      "";


    const categoria =
      data.categoria ||
      data.category ||
      data.cat ||
      "Notícias";


    const imagem =
      String(
        data.imagem ??
        data.Imagem ??
        data.image ??
        data.imagem_url ??
        data.image_url ??
        ""
      ).trim();


    const dataPublicacao =
      formatarData(
        data.data_publicacao ??
        data.created_at ??
        data.createdAt
      );


    /* =================================
       MOSTRAR
    ================================= */

    article.innerHTML = `

      <article class="article">

        ${
          imagem

          ? `

            <img
              class="article-image"
              src="${esc(imagem)}"
              alt="${esc(titulo)}"
              onerror="
                this.style.display='none';
              "
            >

          `

          : ""

        }


        <div class="article-content">

          <span class="article-category">

            🏷️ ${esc(categoria)}

          </span>


          ${
            dataPublicacao

            ? `

              <span class="article-date">

                📅 Publicado em
                ${esc(dataPublicacao)}

              </span>

            `

            : ""

          }


          <h1 class="article-title">

            ${esc(titulo)}

          </h1>


          <div class="article-text">

            ${esc(texto)}

          </div>


          <button
            class="share-button"
            onclick="partilharNoticia()"
          >

            📤 Partilhar notícia

          </button>

        </div>

      </article>

    `;

  }


  catch (erro) {

    console.error(
      "Erro:",
      erro
    );


    article.innerHTML = `

      <div class="error-box">

        ❌ Ocorreu um erro ao carregar a notícia.

        <br><br>

        <small>
          ${esc(
            erro.message ||
            erro
          )}
        </small>

      </div>

    `;

  }

}


/* =====================================
   PARTILHAR
===================================== */

async function partilharNoticia() {

  const url =
    window.location.href;


  const titulo =
    document.querySelector(
      ".article-title"
    )?.innerText ||
    "AfricanMundo";


  if (navigator.share) {

    try {

      await navigator.share({

        title: titulo,

        text:
          "Confira esta notícia no AfricanMundo.",

        url: url

      });

    }

    catch (erro) {

      console.log(
        "Partilha cancelada."
      );

    }

  }

  else {

    try {

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "🔗 Link da notícia copiado!"
      );

    }

    catch (erro) {

      alert(
        "Copie o endereço desta página para partilhar."
      );

    }

  }

}


/* =====================================
   INICIAR
===================================== */

carregarNoticia();

</script>

</body>
</html>
