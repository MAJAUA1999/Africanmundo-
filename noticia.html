/* ==========================================
   CONFIGURAÇÃO SUPABASE
========================================== */

const SUPABASE_URL =
"https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";


/* ==========================================
   CLIENTE SUPABASE
========================================== */

let db = null;

try{

 if(
   window.supabase &&
   SUPABASE_URL.startsWith("http") &&
   SUPABASE_KEY.length > 20
 ){

   db =
     window.supabase.createClient(
       SUPABASE_URL,
       SUPABASE_KEY
     );

   console.log(
     "✅ Supabase conectado."
   );

 }

}catch(e){

 console.error(
   "❌ Erro ao iniciar Supabase:",
   e
 );

}


/* ==========================================
   OBTER ID
========================================== */

function obterId(){

 const params =
   new URLSearchParams(
     window.location.search
   );

 return (
   params.get("id") ||
   params.get("noticia") ||
   params.get("news")
 );

}


/* ==========================================
   ESCAPAR TEXTO
========================================== */

function esc(valor){

 if(
   valor === null ||
   valor === undefined
 ){

   return "";

 }

 return String(valor)
   .replace(/&/g,"&amp;")
   .replace(/</g,"&lt;")
   .replace(/>/g,"&gt;")
   .replace(/"/g,"&quot;")
   .replace(/'/g,"&#039;");

}


/* ==========================================
   FORMATAR DATA
========================================== */

function formatarData(valor){

 if(!valor){
   return "";
 }

 try{

   const d =
     new Date(valor);

   if(isNaN(d.getTime())){
     return "";
   }

   return d.toLocaleDateString(
     "pt-PT",
     {
       day:"2-digit",
       month:"2-digit",
       year:"numeric"
     }
   );

 }catch(e){

   return "";

 }

}


/* ==========================================
   VOLTAR
========================================== */

function voltar(){

 if(
   document.referrer &&
   document.referrer.includes(
     window.location.hostname
   )
 ){

   history.back();

 }else{

   window.location.href =
     "index.html";

 }

}


/* ==========================================
   MOSTRAR ERRO
========================================== */

function mostrarErro(msg){

 const estado =
   document.getElementById("estado");

 estado.className =
   "estado erro";

 estado.innerHTML =
   "❌ " + esc(msg);

}


/* ==========================================
   MOSTRAR NOTÍCIA
========================================== */

function mostrarNoticia(n){

 const estado =
   document.getElementById("estado");

 const artigo =
   document.getElementById("noticia");

 const titulo =
   document.getElementById("titulo");

 const categoria =
   document.getElementById("categoria");

 const data =
   document.getElementById("data");

 const texto =
   document.getElementById("texto");

 const imagem =
   document.getElementById("imagem");


 /* ======================================
    TÍTULO
 ====================================== */

 titulo.textContent =
   n.titulo ||
   n.title ||
   "Sem título";


 /* ======================================
    CATEGORIA
 ====================================== */

 categoria.textContent =
   n.categoria ||
   n.category ||
   "Notícias";


 /* ======================================
    DATA
 ====================================== */

 data.textContent =
   formatarData(
     n.created_at ||
     n.data ||
     n.createdAt ||
     n.publicado_em
   );


 /* ======================================
    TEXTO
 ====================================== */

 texto.textContent =
   n.texto ||
   n.conteudo ||
   n.content ||
   n.descricao ||
   "";


 /* ======================================
    IMAGEM
 ====================================== */

 const foto =
   n.imagem ||
   n.imagem_url ||
   n.image ||
   n.image_url ||
   n.foto ||
   n.foto_url ||
   n.url_imagem ||
   n.urlImagem ||
   n.capa ||
   n.capa_url ||
   "";


 console.log(
   "🖼️ Imagem:",
   foto
 );


 if(foto){

   imagem.src =
     foto;

   imagem.alt =
     n.titulo ||
     n.title ||
     "Imagem da notícia";

   imagem.style.display =
     "block";


   imagem.onclick =
     function(){

       abrirImagemGrande(
         foto
       );

     };


   imagem.onerror =
     function(){

       console.error(
         "❌ Erro na imagem:",
         foto
       );

       imagem.style.display =
         "none";

     };

 }else{

   imagem.style.display =
     "none";

 }


 estado.style.display =
   "none";

 artigo.style.display =
   "block";

}


/* ==========================================
   ABRIR IMAGEM GRANDE
========================================== */

function abrirImagemGrande(url){

 const visualizador =
   document.getElementById(
     "visualizadorImagem"
   );

 const imagemGrande =
   document.getElementById(
     "imagemGrande"
   );

 if(!visualizador ||
    !imagemGrande){

   return;

 }

 imagemGrande.src =
   url;

 visualizador.style.display =
   "flex";

 document.body.style.overflow =
   "hidden";

}


/* ==========================================
   FECHAR IMAGEM GRANDE
========================================== */

function fecharImagem(){

 const visualizador =
   document.getElementById(
     "visualizadorImagem"
   );

 if(!visualizador) return;

 visualizador.style.display =
   "none";

 document.body.style.overflow =
   "";

}


/* ==========================================
   FECHAR COM ESC
========================================== */

document.addEventListener(
 "keydown",
 function(e){

   if(e.key === "Escape"){

     fecharImagem();

   }

 });


/* ==========================================
   CARREGAR NOTÍCIA
========================================== */

async function carregarNoticia(){

 const id =
   obterId();

 if(!id){

   mostrarErro(
     "Não foi encontrado o ID da notícia."
   );

   return;

 }


 if(!db){

   mostrarErro(
     "A ligação com o Supabase não está configurada."
   );

   return;

 }


 try{

   console.log(
     "🔎 Procurando notícia:",
     id
   );


   const resposta =
     await db
       .from("noticias")
       .select("*")
       .eq("id",id)
       .limit(1);


   if(resposta.error){

     console.error(
       "❌ Erro Supabase:",
       resposta.error
     );

     mostrarErro(
       "Erro ao consultar a notícia."
     );

     return;

   }


   const noticias =
     resposta.data || [];


   if(!noticias.length){

     mostrarErro(
       "A notícia não foi encontrada."
     );

     return;

   }


   const noticiaAtual =
     noticias[0];


   console.log(
     "✅ Notícia encontrada:",
     noticiaAtual
   );


   mostrarNoticia(
     noticiaAtual
   );


   /* CARREGAR MAIS NOTÍCIAS */

   carregarMaisNoticias(
     noticiaAtual.id
   );


 }catch(e){

   console.error(
     "❌ Erro ao carregar:",
     e
   );

   mostrarErro(
     "Ocorreu um erro ao carregar a notícia."
   );

 }

}


/* ==========================================
   MAIS NOTÍCIAS
========================================== */

let todasMaisNoticias = [];

let quantidadeMaisNoticias = 6;


/* ==========================================
   CARREGAR MAIS NOTÍCIAS DO SUPABASE
========================================== */

async function carregarMaisNoticias(idAtual){

 const lista =
   document.getElementById(
     "listaMaisNoticias"
   );

 if(!lista || !db) return;


 try{

   const resposta =
     await db
       .from("noticias")
       .select("*")
       .order("id",{
         ascending:false
       });


   if(resposta.error){

     console.error(
       "❌ Erro ao carregar mais notícias:",
       resposta.error
     );

     return;

   }


   todasMaisNoticias =
     (resposta.data || [])
       .filter(function(n){

         return String(n.id) !==
                String(idAtual);

       });


   renderizarMaisNoticias();


 }catch(e){

   console.error(
     "❌ Erro nas mais notícias:",
     e
   );

 }

}


/* ==========================================
   RENDERIZAR MAIS NOTÍCIAS
========================================== */

function renderizarMaisNoticias(){

 const lista =
   document.getElementById(
     "listaMaisNoticias"
   );

 const botao =
   document.getElementById(
     "botaoMaisNoticias"
   );


 if(!lista || !botao) return;


 const noticiasVisiveis =
   todasMaisNoticias.slice(
     0,
     quantidadeMaisNoticias
   );


 lista.innerHTML =
   noticiasVisiveis
     .map(function(n){

       const titulo =
         n.titulo ||
         n.title ||
         "Sem título";


       const imagem =
         n.imagem ||
         n.imagem_url ||
         n.image ||
         n.image_url ||
         n.foto ||
         n.foto_url ||
         n.url_imagem ||
         "";


       return `

         <a
           class="cartao-mais"
           href="noticia.html?id=${encodeURIComponent(n.id)}"
         >

           ${
             imagem
             ?
             `
             <img
               src="${esc(imagem)}"
               alt="${esc(titulo)}"
             >
             `
             :
             `
             <div class="cartao-sem-imagem">
               🌍
             </div>
             `
           }


           <div
             class="cartao-mais-titulo"
           >
             ${esc(titulo)}
           </div>

         </a>

       `;

     })
     .join("");


 if(
   quantidadeMaisNoticias <
   todasMaisNoticias.length
 ){

   botao.style.display =
     "block";

 }else{

   botao.style.display =
     "none";

 }

}


/* ==========================================
   BOTÃO MAIS NOTÍCIAS
========================================== */

document.addEventListener(
 "DOMContentLoaded",
 function(){

   const botao =
     document.getElementById(
       "botaoMaisNoticias"
     );


   if(!botao) return;


   botao.addEventListener(
     "click",
     function(){

       quantidadeMaisNoticias +=
         6;


       renderizarMaisNoticias();


     }
   );

 });


/* ==========================================
   PARTILHAR
========================================== */

async function partilhar(){

 const titulo =
   document.getElementById(
     "titulo"
   ).textContent;


 const url =
   window.location.href;


 try{

   if(
     navigator.share
   ){

     await navigator.share({

       title:
         titulo,

       text:
         titulo,

       url:
         url

     });

   }else{

     await navigator.clipboard
       .writeText(url);


     alert(
       "🔗 Link da notícia copiado!"
     );

   }

 }catch(e){

   console.log(
     "Partilha cancelada."
   );

 }

}


/* ==========================================
   INICIAR
========================================== */

document.addEventListener(
 "DOMContentLoaded",
 function(){

   console.log(
     "🚀 AfricanMundo: notícia iniciada."
   );

   carregarNoticia();

 });


/* ==========================================
   FIM
========================================== */

console.log(
 "✅ noticia.html carregado."
);

</script></body>
