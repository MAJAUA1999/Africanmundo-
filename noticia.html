<!doctype html>
<html lang="pt">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Notícia — AfricanMundo</title>

  <meta
    id="metaDescription"
    name="description"
    content="Leia as principais notícias de África e do mundo no AfricanMundo."
  >

  <meta
    id="metaOgTitle"
    property="og:title"
    content="AfricanMundo — A informação que liga África ao mundo"
  >

  <meta
    id="metaOgDescription"
    property="og:description"
    content="Leia as principais notícias de África e do mundo no AfricanMundo."
  >

  <meta
    id="metaOgImage"
    property="og:image"
    content=""
  >

  <meta
    id="metaOgUrl"
    property="og:url"
    content=""
  >

  <link
    id="canonicalUrl"
    rel="canonical"
    href=""
  >

  <meta
    property="og:type"
    content="article"
  >

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    id="metaTwitterTitle"
    name="twitter:title"
    content="AfricanMundo"
  >

  <meta
    id="metaTwitterDescription"
    name="twitter:description"
    content="A informação que liga África ao mundo"
  >

  <meta
    id="metaTwitterImage"
    name="twitter:image"
    content=""
  >

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f4f4;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    .article-page {
      max-width: 900px;
      margin: 0 auto;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }

    .article {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    .article-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .article-image:hover {
      opacity: 0.96;
    }

    .article-content {
      padding: 28px;
    }

    .article-category {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      color: #45a52c;
    }

    .article-date {
      display: block;
      margin-bottom: 16px;
      color: #666;
      font-size: 14px;
    }

    .article-title {
      margin: 0 0 20px;
      font-size: 36px;
      line-height: 1.2;
    }

    .article-text {
      font-size: 19px;
      line-height: 1.85;
      white-space: pre-wrap;
    }

    .article-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    .share-button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .favorite-button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #eee;
      color: #111;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .favorite-button.active {
      background: #ffe1e1;
      color: #c40000;
    }

    .loading,
    .error-box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
    }

    .photo-viewer {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: rgba(0,0,0,0.96);
    }

    .photo-viewer.show {
      display: flex;
    }

    .photo-viewer img {
      max-width: 100%;
      max-height: 94vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .photo-viewer-close {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #111;
      font-size: 30px;
      font-weight: 900;
      line-height: 46px;
      text-align: center;
      cursor: pointer;
      z-index: 1000000;
    }

    .related-news {
      margin-top: 30px;
    }

    .related-news-title {
      margin: 0 0 15px;
      font-size: 22px;
      border-left: 4px solid #45c226;
      padding-left: 10px;
    }

    .related-news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .related-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ddd;
      text-decoration: none;
      color: #111;
    }

    .related-card-image,
    .related-placeholder {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .related-placeholder {
      background: linear-gradient(
        135deg,
        #111,
        #345b29
      );
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .related-content {
      padding: 12px;
    }

    .related-category {
      color: #45a52c;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .related-card h3 {
      margin: 6px 0 0;
      font-size: 16px;
      line-height: 1.3;
    }

    @media (max-width: 600px) {

      .article-image {
        max-height: 300px;
      }

      .article-content {
        padding: 18px;
      }

      .article-title {
        font-size: 27px;
      }

      .article-text {
        font-size: 17px;
        line-height: 1.75;
      }

      .related-news-grid {
        grid-template-columns: 1fr;
      }

      .photo-viewer {
        padding: 8px;
      }

      .photo-viewer img {
        max-width: 100%;
        max-height: 92vh;
      }

    }

  </style>

</head>

<body>

  <header>

    <div
      style="
        background:#050505;
        color:#fff;
        padding:20px 15px;
      "
    >

      <div
        style="
          max-width:1200px;
          margin:auto;
        "
      >

        <div
          style="
            font-size:32px;
            font-weight:900;
          "
        >

          African<span style="color:#45c226;">
            Mundo
          </span>

        </div>

        <div
          style="
            margin-top:5px;
            color:#ddd;
            font-size:13px;
          "
        >

          A informação que liga África ao mundo

        </div>

      </div>

    </div>

  </header>

  <div
    id="photoViewer"
    class="photo-viewer"
    onclick="fecharFotoGrande(event)"
  >

    <button
      type="button"
      class="photo-viewer-close"
      onclick="fecharFotoGrande(event)"
      aria-label="Fechar imagem"
    >
      ×
    </button>

    <img
      id="photoViewerImg"
      src=""
      alt="Imagem ampliada"
    >

  </div>

  <main
    style="
      max-width:1200px;
      margin:auto;
      padding:25px 12px 50px;
    "
  >

    <section class="news-section article-page">

      <a
        class="back-button"
        href="javascript:history.back()"
      >

        ← Voltar

      </a>

      <div id="article">

        <div class="loading">

          🔄 A carregar notícia...

        </div>

      </div>

    </section>

  </main>
    <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://sonzwfhepjfvzltuxxne.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       SEGURANÇA
    ===================================== */

    function esc(valor) {

      return String(valor ?? "").replace(
        /[&<>"']/g,
        function(m) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[m];

        }
      );

    }


    /* =====================================
       DATA + HORA
    ===================================== */

    function formatarData(data) {

      if (!data) {
        return "";
      }

      const d =
        new Date(data);

      if (isNaN(d.getTime())) {
        return "";
      }

      return d.toLocaleString(
        "pt-MZ",
        {
          day: "2-digit",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /* =====================================
       ABRIR FOTO GRANDE
    ===================================== */

    function abrirFotoGrande(
      url,
      titulo
    ) {

      const viewer =
        document.getElementById(
          "photoViewer"
        );

      const img =
        document.getElementById(
          "photoViewerImg"
        );

      if (
        !viewer ||
        !img ||
        !url
      ) {

        return;

      }

      img.src =
        url;

      img.alt =
        titulo ||
        "Imagem ampliada";

      viewer.classList.add(
        "show"
      );

      document.body.style.overflow =
        "hidden";

    }


    /* =====================================
       FECHAR FOTO GRANDE
    ===================================== */

    function fecharFotoGrande(
      event
    ) {

      if (
        event &&
        event.target &&
        event.target.id ===
        "photoViewerImg"
      ) {

        return;

      }

      const viewer =
        document.getElementById(
          "photoViewer"
        );

      const img =
        document.getElementById(
          "photoViewerImg"
        );

      if (
        !viewer ||
        !img
      ) {

        return;

      }

      viewer.classList.remove(
        "show"
      );

      img.src =
        "";

      document.body.style.overflow =
        "";

    }


    /* =====================================
       TECLA ESC
    ===================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {

          fecharFotoGrande();

        }

      }
    );


    /* =====================================
       PARTILHAR NOTÍCIA
    ===================================== */

    async function partilharNoticia() {

      const url =
        window.location.href;

      const titulo =
        document.querySelector(
          ".article-title"
        )?.innerText ||
        "AfricanMundo";

      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title:
              titulo,

            text:
              "Confira esta notícia no AfricanMundo.",

            url:
              url

          });

        }

        catch (erro) {

          console.log(
            "Partilha cancelada."
          );

        }

      }

      else {

        try {

          await navigator.clipboard.writeText(
            url
          );

          alert(
            "🔗 Link da notícia copiado!"
          );

        }

        catch (erro) {

          alert(
            "Copie o endereço desta página para partilhar."
          );

        }

      }

    }


    /* =====================================
       FAVORITOS
    ===================================== */

    function obterFavoritos() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "africanmundo_favoritos"
          ) || "[]"
        );

      }

      catch (erro) {

        console.error(
          "Erro ao ler favoritos:",
          erro
        );

        return [];

      }

    }


    function verificarFavorito(
      id
    ) {

      const favoritos =
        obterFavoritos();

      return favoritos.includes(
        String(id)
      );

    }


    function atualizarBotaoFavorito(
      id
    ) {

      const botao =
        document.getElementById(
          "favoriteButton"
        );

      if (!botao) {
        return;
      }

      if (
        verificarFavorito(id)
      ) {

        botao.innerHTML =
          "❤️ Favoritado";

        botao.classList.add(
          "active"
        );

      }

      else {

        botao.innerHTML =
          "🤍 Favoritar";

        botao.classList.remove(
          "active"
        );

      }

    }


    function alternarFavorito() {

      const url =
        new URL(
          window.location.href
        );

      const id =
        url.searchParams.get(
          "id"
        );

      if (!id) {
        return;
      }

      const idLimpo =
        String(id).trim();

      let favoritos =
        obterFavoritos();

      const indice =
        favoritos.indexOf(
          idLimpo
        );

      if (
        indice === -1
      ) {

        favoritos.push(
          idLimpo
        );

      }

      else {

        favoritos.splice(
          indice,
          1
        );

      }

      localStorage.setItem(
        "africanmundo_favoritos",
        JSON.stringify(
          favoritos
        )
      );

      atualizarBotaoFavorito(
        idLimpo
      );

    }


    function iniciarFavorito() {

      const url =
        new URL(
          window.location.href
        );

      const id =
        url.searchParams.get(
          "id"
        );

      if (!id) {
        return;
      }

      atualizarBotaoFavorito(
        String(id).trim()
      );

    }
          /* =====================================
       CARREGAR NOTÍCIA
    ===================================== */

    async function carregarNoticia() {

      const article =
        document.getElementById(
          "article"
        );

      if (!article) {
        return;
      }

      const url =
        new URL(
          window.location.href
        );

      const id =
        url.searchParams.get(
          "id"
        );

      console.log(
        "ID recebido:",
        id
      );

      if (!id) {

        article.innerHTML = `

          <div class="error-box">

            ❌ Nenhuma notícia foi selecionada.

            <br><br>

            <small>

              Esta página precisa receber um ID.

              <br>

              Exemplo:

              noticia.html?id=1

            </small>

          </div>

        `;

        return;
      }

      const idLimpo =
        String(id).trim();

      if (!idLimpo) {

        article.innerHTML = `

          <div class="error-box">

            ❌ O ID da notícia está vazio.

          </div>

        `;

        return;
      }

      try {

        const resultado =
          await supabaseClient
            .from("noticias")
            .select("*")
            .eq(
              "id",
              idLimpo
            )
            .maybeSingle();

        const data =
          resultado.data;

        const error =
          resultado.error;

        console.log(
          "Notícia recebida:",
          data
        );

        if (error) {

          console.error(
            "Erro Supabase:",
            error
          );

          article.innerHTML = `

            <div class="error-box">

              ❌ Não foi possível carregar esta notícia.

              <br><br>

              <small>

                ${esc(error.message)}

              </small>

            </div>

          `;

          return;
        }

        if (!data) {

          article.innerHTML = `

            <div class="error-box">

              ❌ Notícia não encontrada.

              <br><br>

              <small>

                ID procurado:
                ${esc(idLimpo)}

              </small>

            </div>

          `;

          return;
        }

        /* =================================
           DADOS DA NOTÍCIA
        ================================= */

        const titulo =
          data.titulo ||
          data.title ||
          data.nome ||
          "Sem título";

        const texto =
          data.texto ||
          data.body ||
          data.conteudo ||
          data.content ||
          "";

        const categoria =
          data.categoria ||
          data.category ||
          data.cat ||
          "Notícias";

        const imagem =
          String(
            data.imagem ??
            data.Imagem ??
            data.image ??
            data.imagem_url ??
            data.image_url ??
            ""
          ).trim();
                /* =================================
           SEO DA NOTÍCIA
        ================================= */

        const descricaoSEO =
          String(
            texto || titulo
          )
            .replace(/\s+/g, " ")
            .trim()
            .slice(0, 160);


        /* TÍTULO */

        document.title =
          titulo +
          " — AfricanMundo";


        /* DESCRIÇÃO */

        const metaDescription =
          document.getElementById(
            "metaDescription"
          );

        if (metaDescription) {

          metaDescription.setAttribute(
            "content",
            descricaoSEO
          );

        }


        /* OPEN GRAPH — TÍTULO */

        const metaOgTitle =
          document.getElementById(
            "metaOgTitle"
          );

        if (metaOgTitle) {

          metaOgTitle.setAttribute(
            "content",
            titulo
          );

        }


        /* OPEN GRAPH — DESCRIÇÃO */

        const metaOgDescription =
          document.getElementById(
            "metaOgDescription"
          );

        if (metaOgDescription) {

          metaOgDescription.setAttribute(
            "content",
            descricaoSEO
          );

        }


        /* OPEN GRAPH — IMAGEM */

        const metaOgImage =
          document.getElementById(
            "metaOgImage"
          );

        if (
          metaOgImage &&
          imagem
        ) {

          metaOgImage.setAttribute(
            "content",
            imagem
          );

        }


        /* OPEN GRAPH — URL */

        const metaOgUrl =
          document.getElementById(
            "metaOgUrl"
          );

        if (metaOgUrl) {

          metaOgUrl.setAttribute(
            "content",
            window.location.href
          );

        }


        /* TWITTER — TÍTULO */

        const metaTwitterTitle =
          document.getElementById(
            "metaTwitterTitle"
          );

        if (metaTwitterTitle) {

          metaTwitterTitle.setAttribute(
            "content",
            titulo
          );

        }


        /* TWITTER — DESCRIÇÃO */

        const metaTwitterDescription =
          document.getElementById(
            "metaTwitterDescription"
          );

        if (metaTwitterDescription) {

          metaTwitterDescription.setAttribute(
            "content",
            descricaoSEO
          );

        }


        /* TWITTER — IMAGEM */

        const metaTwitterImage =
          document.getElementById(
            "metaTwitterImage"
          );

        if (
          metaTwitterImage &&
          imagem
        ) {

          metaTwitterImage.setAttribute(
            "content",
            imagem
          );

        }


        /* =================================
           URL CANÓNICO
        ================================= */

        const canonicalUrl =
          document.getElementById(
            "canonicalUrl"
          );

        if (canonicalUrl) {

          canonicalUrl.setAttribute(
            "href",
            window.location.href
          );

        }


        /* =================================
           DATA DE PUBLICAÇÃO
        ================================= */

        const dataPublicacao =
          formatarData(
            data.data
          );


        /* =================================
           PREPARAR IMAGEM
        ================================= */

        let imagemHTML = "";

        if (
          imagem !== ""
        ) {

          imagemHTML = `

            <img
              class="article-image"
              src="${esc(imagem)}"
              alt="${esc(titulo)}"
              onclick="
                abrirFotoGrande(
                  '${esc(imagem)}',
                  '${esc(titulo)}'
                )
              "
              onerror="
                this.style.display='none';
              "
            >

          `;

      }
                /* =================================
           MOSTRAR NOTÍCIA
        ================================= */

        article.innerHTML = `

          <article class="article">

            ${imagemHTML}

            <div class="article-content">

              <span class="article-category">

                🏷️ ${esc(categoria)}

              </span>

              ${
                dataPublicacao
                  ? `
                    <span class="article-date">

                      📅 Publicado em
                      ${esc(dataPublicacao)}

                    </span>
                  `
                  : ""
              }

              <h1 class="article-title">

                ${esc(titulo)}

              </h1>

              <div class="article-text">

                ${esc(texto)}

              </div>

              <div class="article-actions">

                <button
                  type="button"
                  class="share-button"
                  onclick="partilharNoticia()"
                >

                  📤 Partilhar notícia

                </button>

                <button
                  type="button"
                  class="favorite-button"
                  id="favoriteButton"
                  onclick="alternarFavorito()"
                >

                  🤍 Favoritar

                </button>

              </div>

            </div>

          </article>

        `;


        /* =================================
           INICIAR FAVORITO
        ================================= */

        iniciarFavorito();


        /* =================================
           MAIS NOTÍCIAS
        ================================= */




      }

      catch (erro) {

        console.error(
          "Erro:",
          erro
        );

        article.innerHTML = `

          <div class="error-box">

            ❌ Ocorreu um erro ao carregar
            a notícia.

            <br><br>

            <small>

              ${esc(
                erro.message ||
                erro
              )}

            </small>

          </div>

        `;

      }

    }
          /* =====================================
       FINALIZAÇÃO
    ===================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        carregarNoticia();

      }
    );


    /* =====================================
       LOG
    ===================================== */

    console.log(
      "✅ AfricanMundo — página de notícia carregada."
    );

  </script>

</body>
</html>
