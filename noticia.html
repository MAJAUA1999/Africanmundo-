<!DOCTYPE html>
<html lang="pt-MZ">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<meta name="theme-color"
content="#168a45">

<title>AfricanMundo — Notícia</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --p:#168a45;
  --bg:#f5f7f8;
  --card:#fff;
  --txt:#172026;
  --muted:#69757d;
  --border:#e2e7ea;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--txt);
}

.container{
  width:min(900px,calc(100% - 24px));
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--card);
  border-bottom:1px solid var(--border);
}

.top{
  min-height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:19px;
  font-weight:900;
  color:var(--p);
}

.actions{
  display:flex;
  gap:7px;
}

button{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--txt);
  border-radius:10px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:800;
}

main{
  padding:22px 0 50px;
}

.article{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.article img{
  width:100%;
  max-height:430px;
  object-fit:cover;
  display:block;
}

.article-content{
  padding:20px;
}

.category{
  color:var(--p);
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}

h1{
  margin:8px 0;
  font-size:30px;
  line-height:1.2;
}

.date{
  color:var(--muted);
  font-size:11px;
  margin-bottom:18px;
}

.text{
  font-size:16px;
  line-height:1.75;
  white-space:pre-line;
}

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:600px){

  h1{
    font-size:23px;
  }

  .text{
    font-size:15px;
  }

}

</style>
</head>

<body>

<header>

  <div class="container top">

    <div class="logo">
      🌍 AfricanMundo
    </div>

    <div class="actions">

      <button
        type="button"
        onclick="history.back()">
        ← Voltar
      </button>

      <button
        type="button"
        onclick="partilhar()">
        📤 Partilhar
      </button>

    </div>

  </div>

</header>

<main>

  <div class="container">

    <article
      id="noticia"
      class="article">

      <div class="loading">
        ⏳ A carregar notícia...
      </div>

    </article>

  </div>

</main>

<script>

const SUPABASE_URL =
"https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
"sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const id =
new URLSearchParams(
  location.search
).get("id");

let noticiaAtual = null;

function esc(v){

  return String(v ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
