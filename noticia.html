<!doctype html>
<html lang="pt">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Notícia — AfricanMundo</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    .article-page {
      max-width: 900px;
      margin: 0 auto;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }

    .article {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    .article-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .article-content {
      padding: 28px;
    }

    .article-category {
      display: inline-block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .article-date {
      display: block;
      margin-bottom: 16px;
      color: #666;
      font-size: 14px;
    }

    .article-title {
      margin: 0 0 20px;
      font-size: 36px;
      line-height: 1.2;
    }

    .article-text {
      font-size: 19px;
      line-height: 1.85;
      white-space: pre-wrap;
    }

    .share-button {
      display: inline-block;
      margin-top: 25px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .loading,
    .error-box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
    }


    /* =====================================
       VISUALIZADOR DE IMAGEM GRANDE
    ===================================== */

    .image-viewer {
      display: none;
      position: fixed;
      z-index: 99999;
      inset: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .image-viewer.active {
      display: flex;
    }

    .image-viewer img {
      max-width: 100%;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 6px;
      display: block;
    }

    .image-viewer-close {
      position: absolute;
      top: 15px;
      right: 18px;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      color: #fff;
      font-size: 30px;
      line-height: 46px;
      text-align: center;
      cursor: pointer;
      z-index: 100000;
    }


    /* =====================================
       MAIS NOTÍCIAS
    ===================================== */

    .related-news {
      margin-top: 30px;
    }

    .related-news-title {
      margin: 0 0 15px;
      font-size: 22px;
      border-left: 4px solid #45c226;
      padding-left: 10px;
    }

    .related-news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .related-card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ddd;
      text-decoration: none;
      color: #111;
    }

    .related-card img,
    .related-placeholder {
      width: 100%;
      height: 150px;
      object-fit: cover;
      display: block;
    }

    .related-placeholder {
      background: linear-gradient(135deg, #111, #345b29);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .related-content {
      padding: 12px;
    }

    .related-category {
      color: #45a52c;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .related-card h3 {
      margin: 6px 0 0;
      font-size: 16px;
      line-height: 1.3;
    }


    @media (max-width: 600px) {

      .article-image {
        max-height: 300px;
      }

      .article-content {
        padding: 18px;
      }

      .article-title {
        font-size: 27px;
      }

      .article-text {
        font-size: 17px;
        line-height: 1.75;
      }

      .related-news-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

<header>

  <div class="top">
    🌍 AfricanMundo
  </div>

</header>


<!-- =====================================
     VISUALIZADOR DE FOTO
===================================== -->

<div
  id="imageViewer"
  class="image-viewer"
  onclick="fecharImagemGrande(event)"
>

  <button
    type="button"
    class="image-viewer-close"
    onclick="fecharImagemGrande()"
    aria-label="Fechar imagem"
  >
    ×
  </button>

  <img
    id="imageViewerImg"
    src=""
    alt="Imagem ampliada"
  >

</div>


<main>

  <section class="news-section article-page">

    <a
      class="back-button"
      href="javascript:history.back()"
    >
      ← Voltar
    </a>

    <div id="article">

      <div class="loading">
        🔄 A carregar notícia...
      </div>

    </div>

  </section>

</main>
<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   SEGURANÇA
===================================== */

function esc(valor) {

  return String(valor ?? "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}


/* =====================================
   DATA + HORA
===================================== */

function formatarData(data) {

  if (!data) {
    return "";
  }

  const d = new Date(data);

  if (isNaN(d.getTime())) {
    return "";
  }

  return d.toLocaleString(
    "pt-MZ",
    {
      day: "2-digit",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =====================================
   ABRIR IMAGEM EM TAMANHO GRANDE
===================================== */

function abrirImagemGrande(url, alt = "") {

  const viewer =
    document.getElementById("imageViewer");

  const viewerImg =
    document.getElementById("imageViewerImg");


  if (!viewer || !viewerImg || !url) {
    return;
  }


  viewerImg.src = url;

  viewerImg.alt =
    alt || "Imagem ampliada";


  viewer.classList.add("active");


  document.body.style.overflow =
    "hidden";

}


/* =====================================
   FECHAR IMAGEM GRANDE
===================================== */

function fecharImagemGrande(event) {

  /*
     Se tocar diretamente na imagem,
     não fechar.
  */

  if (
    event &&
    event.target &&
    event.target.id === "imageViewerImg"
  ) {
    return;
  }


  const viewer =
    document.getElementById("imageViewer");

  const viewerImg =
    document.getElementById("imageViewerImg");


  if (!viewer || !viewerImg) {
    return;
  }


  viewer.classList.remove("active");


  viewerImg.src = "";


  document.body.style.overflow =
    "";

}


/* =====================================
   FECHAR COM TECLA ESC
===================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Escape") {

      fecharImagemGrande();

    }

  }
);


/* =====================================
   MAIS NOTÍCIAS
===================================== */

async function carregarMaisNoticias(
  noticiaAtualId
) {

  const article =
    document.getElementById("article");


  try {

    const resultado =
      await supabaseClient
        .from("noticias")
        .select("*")
        .neq("id", noticiaAtualId)
        .order("id", {
          ascending: false
        })
        .limit(3);


    if (resultado.error) {

      console.error(
        "Erro ao carregar mais notícias:",
        resultado.error
      );

      return;
    }


    const noticias =
      Array.isArray(resultado.data)
        ? resultado.data
        : [];


    if (noticias.length === 0) {
      return;
    }


    /* =================================
       CRIAR CARTÕES
    ================================= */

    const cards =
      noticias.map(function(noticia) {

        const titulo =
          noticia.titulo ||
          noticia.title ||
          noticia.nome ||
          "Sem título";


        const categoria =
          noticia.categoria ||
          noticia.category ||
          noticia.cat ||
          "Notícias";


        /* =================================
           PEGAR IMAGEM
        ================================= */

        let imagem =
          noticia.imagem ??
          noticia.Imagem ??
          noticia.image ??
          noticia.imagem_url ??
          noticia.image_url ??
          "";


        imagem =
          String(imagem || "").trim();


        console.log(
          "Mais notícias:",
          titulo,
          "Imagem:",
          imagem
        );


        /* =================================
           IMAGEM PADRÃO
        ================================= */

        let imagemHTML = `

          <div
            class="related-placeholder"
          >
            🌍
          </div>

        `;


        /* =================================
           MOSTRAR IMAGEM
        ================================= */

        if (imagem !== "") {

          imagemHTML = `

            <img
              class="related-card-image"
              src="${esc(imagem)}"
              alt="${esc(titulo)}"
              loading="lazy"
              style="
                width:100%;
                height:150px;
                object-fit:cover;
                display:block;
                background:#ddd;
              "
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex';
              "
            >

            <div
              class="related-placeholder"
              style="display:none;"
            >
              🌍
            </div>

          `;

        }


        /* =================================
           CARTÃO
        ================================= */

        return `

          <a
            class="related-card"
            href="noticia.html?id=${encodeURIComponent(noticia.id)}"
          >

            ${imagemHTML}

            <div class="related-content">

              <div class="related-category">

                ${esc(categoria)}

              </div>

              <h3>

                ${esc(titulo)}

              </h3>

            </div>

          </a>

        `;

      }).join("");


    /* =====================================
       CRIAR SEÇÃO
    ===================================== */

    const secao =
      document.createElement("section");


    secao.className =
      "related-news";


    secao.innerHTML = `

      <h2 class="related-news-title">

        📰 Mais notícias

      </h2>

      <div class="related-news-grid">

        ${cards}

      </div>

    `;


    article.parentNode.appendChild(
      secao
    );


  }

  catch (erro) {

    console.error(
      "Erro ao carregar mais notícias:",
      erro
    );

  }

}
  /* =====================================
   CARREGAR NOTÍCIA
===================================== */

async function carregarNoticia() {

  const article =
    document.getElementById("article");


  const url =
    new URL(
      window.location.href
    );


  const id =
    url.searchParams.get("id");


  console.log(
    "URL atual:",
    window.location.href
  );


  console.log(
    "ID recebido:",
    id
  );


  if (!id) {

    article.innerHTML = `

      <div class="error-box">

        ❌ Nenhuma notícia foi selecionada.

        <br><br>

        <small>
          Esta página precisa receber um ID.
          <br>
          Exemplo: noticia.html?id=1
        </small>

      </div>

    `;

    return;
  }


  const idLimpo =
    String(id).trim();


  if (idLimpo === "") {

    article.innerHTML = `

      <div class="error-box">

        ❌ O ID da notícia está vazio.

      </div>

    `;

    return;
  }


  try {

    const resultado =
      await supabaseClient
        .from("noticias")
        .select("*")
        .eq("id", idLimpo)
        .maybeSingle();


    const data =
      resultado.data;


    const error =
      resultado.error;


    console.log(
      "Notícia recebida:",
      data
    );


    if (error) {

      console.error(
        "Erro Supabase:",
        error
      );


      article.innerHTML = `

        <div class="error-box">

          ❌ Não foi possível carregar esta notícia.

          <br><br>

          <small>
            ${esc(error.message)}
          </small>

        </div>

      `;

      return;
    }


    if (!data) {

      article.innerHTML = `

        <div class="error-box">

          ❌ Notícia não encontrada.

          <br><br>

          <small>
            ID procurado:
            ${esc(idLimpo)}
          </small>

        </div>

      `;

      return;
    }


    /* =================================
       DADOS
    ================================= */

    const titulo =
      data.titulo ||
      data.title ||
      data.nome ||
      "Sem título";


    const texto =
      data.texto ||
      data.body ||
      data.conteudo ||
      data.content ||
      "";


    const categoria =
      data.categoria ||
      data.category ||
      data.cat ||
      "Notícias";


    const imagem =
      String(
        data.imagem ??
        data.Imagem ??
        data.image ??
        data.imagem_url ??
        data.image_url ??
        ""
      ).trim();


    const dataPublicacao =
      formatarData(
        data.data
      );


    /* =================================
       MOSTRAR NOTÍCIA
    ================================= */

    article.innerHTML = `

      <article class="article">

        ${
          imagem

          ? `

            <img
              class="article-image"
              src="${esc(imagem)}"
              alt="${esc(titulo)}"

              onclick="
                abrirImagemGrande(
                  '${esc(imagem)}',
                  '${esc(titulo)}'
                )
              "

              onerror="
                this.style.display='none';
              "
            >

          `

          : ""

        }


        <div class="article-content">

          <span class="article-category">

            🏷️ ${esc(categoria)}

          </span>


          ${
            dataPublicacao

            ? `

              <span class="article-date">

                📅 Publicado em
                ${esc(dataPublicacao)}

              </span>

            `

            : ""

          }


          <h1 class="article-title">

            ${esc(titulo)}

          </h1>


          <div class="article-text">

            ${esc(texto)}

          </div>


          <button
            class="share-button"
            onclick="partilharNoticia()"
          >

            📤 Partilhar notícia

          </button>

        </div>

      </article>

    `;


    /* =================================
       CARREGAR MAIS NOTÍCIAS
    ================================= */

    carregarMaisNoticias(
      idLimpo
    );

  }


  catch (erro) {

    console.error(
      "Erro:",
      erro
    );


    article.innerHTML = `

      <div class="error-box">

        ❌ Ocorreu um erro ao carregar a notícia.

        <br><br>

        <small>
          ${esc(
            erro.message ||
            erro
          )}
        </small>

      </div>

    `;

  }

}


/* =====================================
   PARTILHAR
===================================== */

async function partilharNoticia() {

  const url =
    window.location.href;


  const titulo =
    document.querySelector(
      ".article-title"
    )?.innerText ||
    "AfricanMundo";


  if (navigator.share) {

    try {

      await navigator.share({

        title: titulo,

        text:
          "Confira esta notícia no AfricanMundo.",

        url: url

      });

    }

    catch (erro) {

      console.log(
        "Partilha cancelada."
      );

    }

  }

  else {

    try {

      await navigator.clipboard.writeText(
        url
      );

      alert(
        "🔗 Link da notícia copiado!"
      );

    }

    catch (erro) {

      alert(
        "Copie o endereço desta página para partilhar."
      );

    }

  }

}


/* =====================================
   INICIAR
===================================== */

carregarNoticia();

</script>

</body>
</html>
