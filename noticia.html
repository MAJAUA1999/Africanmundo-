  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f4f4f4;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* ================================
       CABEÇALHO
    ================================= */

    .site-header {
      background: #050505;
      color: #fff;
      padding: 20px 15px;
    }

    .site-header-inner {
      max-width: 1200px;
      margin: auto;
    }

    .site-logo {
      font-size: 32px;
      font-weight: 900;
    }

    .site-logo span {
      color: #45c226;
    }

    .site-tagline {
      margin-top: 5px;
      color: #ddd;
      font-size: 13px;
    }

    /* ================================
       CONTEÚDO
    ================================= */

    .page-main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 12px 50px;
    }

    .article-page {
      max-width: 900px;
      margin: 0 auto;
    }

    /* ================================
       VOLTAR
    ================================= */

    .back-button {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 16px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
    }

    /* ================================
       CARREGAMENTO
    ================================= */

    .loading,
    .error-box {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
    }

    .loading {
      text-align: center;
      font-size: 17px;
    }

    /* ================================
       ARTIGO
    ================================= */

    .article {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    .article-image {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .article-content {
      padding: 28px;
    }

    .article-category {
      display: inline-block;
      margin-bottom: 8px;
      color: #45a52c;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .article-date {
      display: block;
      margin-bottom: 16px;
      color: #666;
      font-size: 14px;
    }

    .article-title {
      margin: 0 0 20px;
      font-size: 36px;
      line-height: 1.2;
    }

    .article-text {
      font-size: 19px;
      line-height: 1.85;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ================================
       AÇÕES
    ================================= */

    .article-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 25px;
    }

    .share-button,
    .favorite-button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .share-button {
      background: #111;
      color: #fff;
    }

    .favorite-button {
      background: #eee;
      color: #111;
    }

    .favorite-button.active {
      background: #ffe1e1;
      color: #c40000;
    }

    /* ================================
       FOTO GRANDE
    ================================= */

    .photo-viewer {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 15px;
      background: rgba(0,0,0,0.96);
    }

    .photo-viewer.show {
      display: flex;
    }

    .photo-viewer img {
      max-width: 100%;
      max-height: 94vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .photo-viewer-close {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      color: #111;
      font-size: 30px;
      font-weight: 900;
      line-height: 46px;
      text-align: center;
      cursor: pointer;
      z-index: 1000000;
    }

    /* ================================
       RESPONSIVO
    ================================= */

    @media (max-width: 600px) {

      .site-logo {
        font-size: 28px;
      }

      .article-image {
        max-height: 300px;
      }

      .article-content {
        padding: 18px;
      }

      .article-title {
        font-size: 27px;
      }

      .article-text {
        font-size: 17px;
        line-height: 1.75;
      }

      .photo-viewer {
        padding: 8px;
      }

      .photo-viewer img {
        max-width: 100%;
        max-height: 92vh;
      }

      .article-actions {
        flex-direction: column;
      }

      .share-button,
      .favorite-button {
        width: 100%;
      }

    }

  </style>

</head>

  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://sonzwfhepjfvzltuxxne.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       SEGURANÇA
    ===================================== */

    function esc(valor) {

      return String(valor ?? "").replace(
        /[&<>"']/g,
        function(m) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[m];

        }
      );

    }


    /* =====================================
       ID DA NOTÍCIA
    ===================================== */

    function obterIdNoticiaAtual() {

      const url =
        new URL(
          window.location.href
        );

      const id =
        url.searchParams.get("id");

      if (!id) {
        return "";
      }

      return String(id).trim();

    }


    /* =====================================
       DATA
    ===================================== */

    function formatarData(data) {

      if (!data) {
        return "";
      }

      const d =
        new Date(data);

      if (
        isNaN(
          d.getTime()
        )
      ) {
        return "";
      }

      return d.toLocaleString(
        "pt-MZ",
        {
          day: "2-digit",
          month: "long",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }
        /* =====================================
       FOTO GRANDE
    ===================================== */

    function abrirFotoGrande(url, titulo) {

      const viewer =
        document.getElementById(
          "photoViewer"
        );

      const img =
        document.getElementById(
          "photoViewerImg"
        );

      if (
        !viewer ||
        !img ||
        !url
      ) {
        return;
      }

      img.src = url;

      img.alt =
        titulo ||
        "Imagem ampliada";

      viewer.classList.add("show");

      document.body.style.overflow =
        "hidden";

    }


    /* =====================================
       FECHAR FOTO GRANDE
    ===================================== */

    function fecharFotoGrande(event) {

      if (
        event &&
        event.target &&
        event.target.id ===
        "photoViewerImg"
      ) {
        return;
      }

      const viewer =
        document.getElementById(
          "photoViewer"
        );

      const img =
        document.getElementById(
          "photoViewerImg"
        );

      if (
        !viewer ||
        !img
      ) {
        return;
      }

      viewer.classList.remove("show");

      img.src = "";

      document.body.style.overflow = "";

    }


    /* =====================================
       TECLA ESC
    ===================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {

          fecharFotoGrande();

        }

      }
    );


    /* =====================================
       PARTILHAR NOTÍCIA
    ===================================== */

    async function partilharNoticia() {

      const url =
        window.location.href;

      const titulo =
        document.querySelector(
          ".article-title"
        )?.innerText ||
        "AfricanMundo";

      if (
        navigator.share
      ) {

        try {

          await navigator.share({

            title: titulo,

            text:
              "Confira esta notícia no AfricanMundo.",

            url: url

          });

        }

        catch (erro) {

          console.log(
            "Partilha cancelada."
          );

        }

        return;

      }


      try {

        await navigator.clipboard.writeText(
          url
        );

        alert(
          "🔗 Link da notícia copiado!"
        );

      }

      catch (erro) {

        alert(
          "Copie o endereço desta página para partilhar."
        );

      }

    }


    /* =====================================
       FAVORITOS — OBTER
    ===================================== */

    function obterFavoritos() {

      try {

        const dados =
          localStorage.getItem(
            "africanmundo_favoritos"
          );

        return JSON.parse(
          dados || "[]"
        );

      }

      catch (erro) {

        console.error(
          "Erro ao ler favoritos:",
          erro
        );

        return [];

      }

    }


    /* =====================================
       FAVORITOS — VERIFICAR
    ===================================== */

    function verificarFavorito(id) {

      const favoritos =
        obterFavoritos();

      return favoritos.includes(
        String(id)
      );

    }


    /* =====================================
       FAVORITOS — BOTÃO
    ===================================== */

    function atualizarBotaoFavorito(id) {

      const botao =
        document.getElementById(
          "favoriteButton"
        );

      if (!botao) {
        return;
      }

      if (
        verificarFavorito(id)
      ) {

        botao.innerHTML =
          "❤️ Favoritado";

        botao.classList.add(
          "active"
        );

      }

      else {

        botao.innerHTML =
          "🤍 Favoritar";

        botao.classList.remove(
          "active"
        );

      }

    }


    /* =====================================
       FAVORITOS — ALTERNAR
    ===================================== */

    function alternarFavorito() {

      const id =
        obterIdNoticiaAtual();

      if (!id) {
        return;
      }

      let favoritos =
        obterFavoritos();

      const indice =
        favoritos.indexOf(id);

      if (
        indice === -1
      ) {

        favoritos.push(id);

      }

      else {

        favoritos.splice(
          indice,
          1
        );

      }

      localStorage.setItem(
        "africanmundo_favoritos",
        JSON.stringify(
          favoritos
        )
      );

      atualizarBotaoFavorito(
        id
      );

    }


    /* =====================================
       FAVORITOS — INICIAR
    ===================================== */

    function iniciarFavorito() {

      const id =
        obterIdNoticiaAtual();

      if (!id) {
        return;
      }

      atualizarBotaoFavorito(
        id
      );

        }
        /* =====================================
       CARREGAR NOTÍCIA
    ===================================== */

    async function carregarNoticia() {

      const article =
        document.getElementById(
          "article"
        );

      if (!article) {
        return;
      }


      const id =
        obterIdNoticiaAtual();


      console.log(
        "AfricanMundo — ID recebido:",

      );

         VERIFICAR ID
      ================================= */

        article.innerHTML = `

          <div class="error-box">

              noticia.html?id=1

        `;

            .maybeSingle();

          );


        /* =================================
           SEO
        ================================= */

        const descricaoSEO =

            )

        if (metaOgDescription) {

        const metaOgImage =

        if (

        if (metaOgUrl) {

          );

        }


        const metaTwitterTitle =
          document.getElementById(

          );

        if (metaTwitterTitle) {

          );

        }


        const metaTwitterDescription =

          );

        if (metaTwitterDescription) {

          );

        }


        const metaTwitterImage =

          );

        if (

        ) {

        /* =================================
           PREPARAR IMAGEM
        ================================= */

        let imagemHTML = "";


        if (imagem) {

          imagemHTML = `

          class="article-image"
          src="${esc(imagem)}"
          alt="${esc(titulo)}"
          onclick="
            abrirFotoGrande(
              '${esc(imagem)}',
              '${esc(titulo)}'
            )
          "
          onerror="
            this.style.display='none';

    ================================= */

        /* =====================================

async function carregarMaisNoticias(noticiaAtualId) {

  const article =
    document.getElementById("article");

  if (!article) {
    return;
  }

  try {

    const resultado =
      await supabaseClient
        .from("noticias")
        .select("*")
        .neq("id", noticiaAtualId)
        .order("id", {
          ascending: false
        })
        .limit(3);


    if (resultado.error) {

      console.error(
        "Erro ao carregar mais notícias:",
        resultado.error
      );

      return;
    }


    const noticias =
      Array.isArray(resultado.data)
        ? resultado.data
        : [];


    if (noticias.length === 0) {
      return;
    }


    const cards =
      noticias.map(function(noticia) {

        const titulo =
          noticia.titulo ||
          noticia.title ||
          noticia.nome ||
          "Sem título";


        const categoria =
          noticia.categoria ||
          noticia.category ||
          noticia.cat ||
          "Notícias";


        const imagem =
          String(
            noticia.imagem ??
            noticia.Imagem ??
            noticia.image ??
            noticia.imagem_url ??
            noticia.image_url ??
            ""
          ).trim();


        const link =
          "noticia.html?id=" +
          encodeURIComponent(
            noticia.id
          );


        let imagemHTML = `

          <div
            class="related-placeholder"
            style="
              display:flex;
            "
          >
            🌍
          </div>

        `;


        if (imagem) {

          imagemHTML = `

            <img
              class="related-card-image"
              src="${esc(imagem)}"
              alt="${esc(titulo)}"
              loading="lazy"
              onerror="
                this.style.display='none';
                this.nextElementSibling.style.display='flex';
              "
            >

            <div
              class="related-placeholder"
              style="
                display:none;
              "
            >
              🌍
            </div>

          `;

        }


        return `

          <a
            class="related-card"
            href="${link}"
          >

            ${imagemHTML}

            <div
              class="related-content"
            >

              <div
                class="related-category"
              >
                ${esc(categoria)}
              </div>

              <h3>
                ${esc(titulo)}
              </h3>

            </div>

          </a>

        `;

      }).join("");


    const secao =
      document.createElement(
        "section"
      );


    secao.className =
      "related-news";


    secao.innerHTML = `

      <h2
        class="related-news-title"
      >
        📰 Mais notícias
      </h2>

      <div
        class="related-news-grid"
      >

        ${cards}

      </div>

    `;


    if (article.parentNode) {

      article.parentNode.appendChild(
        secao
      );

    }

  }

  catch (erro) {

    console.error(
      "Erro inesperado ao carregar mais notícias:",
      erro
    );

  }

}


/* =====================================
   OBTER ID DA NOTÍCIA
===================================== */

function obterIdNoticiaAtual() {

  try {

    const url =
      new URL(
        window.location.href
      );

    const id =
      url.searchParams.get(
        "id"
      );

    if (!id) {
      return null;
    }

    return String(id).trim();

  }

  catch (erro) {

    console.error(
      "Erro ao obter ID:",
      erro
    );

    return null;

  }

      }
        /* =====================================
   3D — COMENTÁRIOS
===================================== */

async function carregarComentarios(noticiaId) {

  const lista =
    document.getElementById("commentsList");

  if (!lista) {
    return;
  }

  lista.innerHTML = `
    <div class="comments-empty">
      🔄 A carregar comentários...
    </div>
  `;

  try {

    const resultado =
      await supabaseClient
        .from("comentarios")
        .select("*")
        .eq("noticia_id", noticiaId)
        .order("id", {
          ascending: false
        });


    if (resultado.error) {

      console.error(
        "Erro ao carregar comentários:",
        resultado.error
      );

      lista.innerHTML = `
        <div class="comments-error">
          ❌ Não foi possível carregar os comentários.
        </div>
      `;

      return;
    }


    const comentarios =
      Array.isArray(resultado.data)
        ? resultado.data
        : [];


    if (comentarios.length === 0) {

      lista.innerHTML = `
        <div class="comments-empty">
          💬 Ainda não existem comentários.
          <br>
          Seja o primeiro a comentar!
        </div>
      `;

      return;
    }


    lista.innerHTML =
      comentarios
        .map(function(comentario) {

          const nome =
            comentario.nome ||
            "Visitante";


          const texto =
            comentario.comentario ||
            comentario.comentário ||
            "";


          const data =
            comentario.criado_em
              ? formatarData(
                  comentario.criado_em
                )
              : "";


          return `

            <div
              class="comment-item"
            >

              <div
                class="comment-name"
              >
                👤 ${esc(nome)}
              </div>


              ${
                data
                  ? `
                    <div
                      class="comment-date"
                    >
                      📅 ${esc(data)}
                    </div>
                  `
                  : ""
              }


              <div
                class="comment-text"
              >
                ${esc(texto)}
              </div>

            </div>

          `;

        })
        .join("");

  }

  catch (erro) {

    console.error(
      "Erro inesperado nos comentários:",
      erro
    );

    lista.innerHTML = `
      <div class="comments-error">
        ❌ Ocorreu um erro ao carregar os comentários.
      </div>
    `;

  }

}


/* =====================================

) {

    );

  }


  carregarComentarios(
    noticiaId
  );

    }
        /* =====================================
   3E — PUBLICAR COMENTÁRIO
===================================== */

async function publicarComentario(event) {

  event.preventDefault();

  const nomeInput =
    document.getElementById("commentName");

  const textoInput =
    document.getElementById("commentText");

  const botao =
    document.getElementById("commentsSubmit");

  const mensagem =
    document.getElementById("commentsMessage");


  if (
    !nomeInput ||
    !textoInput ||
    !botao
  ) {
    return;
  }


  const noticiaId =
    obterIdNoticiaAtual();

  const nome =
    nomeInput.value.trim();

  const texto =
    textoInput.value.trim();


  if (!noticiaId) {

    alert(
      "❌ Não foi possível identificar a notícia."
    );

    return;
  }


  if (!nome) {

    alert(
      "⚠️ Digite o seu nome."
    );

    nomeInput.focus();

    return;
  }


  if (!texto) {

    alert(
      "⚠️ Escreva um comentário."
    );

    textoInput.focus();

    return;
  }


  if (nome.length > 80) {

    alert(
      "⚠️ O nome deve ter no máximo 80 caracteres."
    );

    return;
  }


  if (texto.length > 1000) {

    alert(
      "⚠️ O comentário deve ter no máximo 1000 caracteres."
    );

    return;
  }


  botao.disabled = true;

  botao.innerHTML =
    "⏳ A publicar...";


  if (mensagem) {

    mensagem.style.display =
      "none";

  }


  try {

    const dadosComentario = {

      noticia_id:
        noticiaId,

      nome:
        nome,

      comentario:
        texto

    };


    const resultado =
      await supabaseClient
        .from("comentarios")
        .insert([
          dadosComentario
        ]);


    if (resultado.error) {

      console.error(
        "Erro ao publicar comentário:",
        resultado.error
      );


      if (mensagem) {

        mensagem.style.display =
          "block";

        mensagem.className =
          "comments-error";

        mensagem.textContent =
          "❌ Não foi possível publicar o comentário.";

      }

      return;
    }


    nomeInput.value =
      "";

    textoInput.value =
      "";


    if (mensagem) {

      mensagem.style.display =
        "block";

      mensagem.className =
        "comments-empty";

      mensagem.textContent =
        "✅ Comentário publicado com sucesso!";

    }


    await carregarComentarios(
      noticiaId
    );

  }


  catch (erro) {

    console.error(
      "Erro ao publicar comentário:",
      erro
    );


    if (mensagem) {

      mensagem.style.display =
        "block";

      mensagem.className =
        "comments-error";

      mensagem.textContent =
        "❌ Ocorreu um erro ao publicar o comentário.";

    }

  }


  finally {

    botao.disabled =
      false;

    botao.innerHTML =
      "💬 Publicar comentário";

  }

}

/* =====================================

===================================== */

function iniciarAtualizacaoComentarios() {

  if (atualizacaoComentarios) {
    clearInterval(
      atualizacaoComentarios
    );
  }


  atualizacaoComentarios =
    setInterval(
      async function() {

        const noticiaId =
          obterIdNoticiaAtual();


        if (!noticiaId) {
          return;
        }


        const lista =
          document.getElementById(
            "commentsList"
          );


        /*
          Não atualiza enquanto o utilizador
          estiver a escrever.
        */

        const campoNome =
          document.getElementById(
            "commentName"
          );

        const campoTexto =
          document.getElementById(
            "commentText"
          );


        if (
          document.activeElement === campoNome ||
          document.activeElement === campoTexto
        ) {

          return;

        }


        await carregarComentarios(
          noticiaId
        );

      },
      30000
    );

}

   PARAR ATUALIZAÇÃO
===================================== */

  if (
    atualizacaoComentarios
  ) {

    clearInterval(
      atualizacaoComentarios
    );

    atualizacaoComentarios =
      null;

  }

}

);
