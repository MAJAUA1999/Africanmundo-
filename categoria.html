let supabaseClient = null;


function iniciarSupabase(){

    typeof window.supabase.createClient === "function"

}


/* =====================================
   NORMALIZAR
===================================== */

function normalizarTexto(valor){

  return String(valor ?? "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ")
    .trim();

}


function esc(valor){

  return String(valor ?? "")
    .replace(/[&<>"']/g,function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m];

    });

}


/* =====================================
   TEXTO DA NOTÍCIA
===================================== */

function textoCompleto(noticia){

  return normalizarTexto([

    noticia?.titulo,
    noticia?.texto,
    noticia?.categoria,
    noticia?.fonte

  ].filter(Boolean).join(" "));

}


function contem(texto,termos){

  return termos.some(function(termo){

    return texto.includes(
      normalizarTexto(termo)
    );

  });

}

/* =====================================

===================================== */

function obterTitulo(noticia){

  return String(
    noticia?.titulo ??
    noticia?.title ??
    "Sem título"
  );

}


function obterTexto(noticia){

  return String(
    noticia?.texto ??
    noticia?.body ??
    noticia?.conteudo ??
    noticia?.content ??
    ""
  );

}


function obterImagem(noticia){

  return String(
    noticia?.imagem ??
    noticia?.Imagem ??
    noticia?.image ??
    noticia?.imagem_url ??
    noticia?.image_url ??
    ""
  ).trim();

}


/* =====================================
   DATA
===================================== */

function formatarData(valor){

  if(!valor) return "";

  const data =
    new Date(valor);

  if(
    Number.isNaN(
      data.getTime()
    )
  ){

    return "";

  }

  return data.toLocaleString(
    "pt-MZ",
    {
      day:"2-digit",
      month:"long",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* =====================================
   CARTÃO
===================================== */

function criarCard(noticia){

  const id =
    noticia.id;

  const titulo =
    obterTitulo(noticia);

  const texto =
    obterTexto(noticia);

  const imagem =
    obterImagem(noticia);

  const categoria =
    noticia.categoria ||
    "Notícias";

  const data =
    formatarData(
      noticia.data ??
      noticia.created_at
    );

  const link =
    "noticia.html?id=" +
    encodeURIComponent(id);


  let resumo =
    texto
      .replace(/\s+/g," ")
      .trim();


  if(resumo.length > 180){

    resumo =
      resumo.substring(0,177) +
      "...";

  }


  let imagemHTML = `

    <a
      href="${link}"
      class="news-card-image-wrap"
    >

      <div class="news-card-placeholder">
        🌍
      </div>

    </a>

  `;


  if(imagem){

    imagemHTML = `

      <a
        href="${link}"
        class="news-card-image-wrap"
      >

        <img
          class="news-card-image"
          src="${esc(imagem)}"
          alt="${esc(titulo)}"
          loading="lazy"
          decoding="async"
          onerror="
            this.style.display='none';
            if(this.nextElementSibling)
            this.nextElementSibling.style.display='grid';
          "
        >

        <div
          class="news-card-placeholder"
          style="display:none"
        >
          🌍
        </div>

      </a>

    `;

  }


  return `

    <article class="news-card">

      ${imagemHTML}

      <div class="news-card-content">

        <div class="news-category">
          ${esc(categoria)}
        </div>

        <h2>
          <a href="${link}">
            ${esc(titulo)}
          </a>
        </h2>

        ${
          resumo
          ?
          `<p>${esc(resumo)}</p>`
          :
          ""
        }

        ${
          data
          ?
          `
          <div class="news-date">
            📅 ${esc(data)}
          </div>
          `
          :
          ""
        }

        <a
          href="${link}"
          class="read-more"
        >
          📖 Ler notícia completa →
        </a>

      </div>

    </article>

  `;

}


/* =====================================
   FILTRAR
===================================== */

function filtrarNoticias(
  noticias,
  categoria
){

  switch(categoria){

    case "mocambique":

      return noticias.filter(
        ehMocambique
      );


    case "africa":

      return noticias.filter(
        ehAfrica
      );


    case "futebol":

      return noticias.filter(
        ehFutebol
      );


    case "desporto":

      return noticias.filter(
        noticia =>
          ehDesporto(noticia) ||
          ehFutebol(noticia)
      );


    case "negocios":

      return noticias.filter(
        ehNegocios
      );


    case "entretenimento":

      return noticias.filter(
        ehEntretenimento
      );


    default:

      return noticias;

  }

}


/* =====================================
   CARREGAR NOTÍCIAS
===================================== */

async function carregarCategoria(){

  const grid =
    document.getElementById(
      "newsGrid"
    );

  const titulo =
    document.getElementById(
      "categoryTitle"
    );

  const descricao =
    document.getElementById(
      "categoryDescription"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const categoria =
    normalizarTexto(
      params.get("categoria") ||
      "noticias"
    );


  if(titulo){

    titulo.textContent =
      nomeBonitoCategoria(
        categoria
      );

  }


  if(descricao){

    descricao.textContent =
      descricaoCategoria(
        categoria
      );

  }


  if(grid){

    grid.innerHTML = `

      <div class="loading">
        ⏳ A carregar as notícias...
      </div>

    `;

  }


  /* ===============================
     GARANTIR SUPABASE
  =============================== */

  if(!supabaseClient){

    const iniciou =
      iniciarSupabase();

    if(!iniciou){

      if(grid){

        grid.innerHTML = `

          <div class="error-message">

            ❌ O sistema de notícias
            ainda não foi carregado.

            <br><br>

            <small>
              Atualize a página e tente novamente.
            </small>

          </div>

        `;

      }

      console.error(
        "Supabase não está disponível."
      );

      return;

    }

  }


  try{

    const resposta =
      await supabaseClient
      .from("noticias")
      .select(`
        id,
        titulo,
        texto,
        imagem,
        categoria,
        data,
        fonte,
        url_original
      `)
      .order(
        "id",
        {
          ascending:false
        }
      )
      .limit(500);


    if(resposta.error){

      console.error(
        "Supabase:",
        resposta.error
      );

      if(grid){

        grid.innerHTML = `

          <div class="error-message">

            ❌ Não foi possível
            carregar as notícias.

          </div>

        `;

      }

      return;

    }


    let noticias =
      Array.isArray(
        resposta.data
      )
      ?
      resposta.data
      :
      [];


    /* ===============================
       SEM DUPLICADOS
    =============================== */

    const ids =
      new Set();


    noticias =
      noticias.filter(
        function(noticia){

          if(
            noticia.id == null ||
            ids.has(noticia.id)
          ){

            return false;

          }

          ids.add(noticia.id);

          return true;

        }
      );


    /* ===============================
       CATEGORIA
    =============================== */

    noticias =
      filtrarNoticias(
        noticias,
        categoria
      );


    /* ===============================
       MAIS RECENTES
    =============================== */

    noticias.sort(
      function(a,b){

        const dataA =
          new Date(
            a.data || 0
          ).getTime();

        const dataB =
          new Date(
            b.data || 0
          ).getTime();


        if(dataB !== dataA){

          return dataB - dataA;

        }


        return (
          Number(b.id || 0) -
          Number(a.id || 0)
        );

      }
    );


    /* ===============================
       MOSTRAR
    =============================== */

    if(!noticias.length){

      if(grid){

        grid.innerHTML = `

          <div class="empty-message">

            📰 Nenhuma notícia
            encontrada nesta categoria.

            <br><br>

            <small>
              Quando houver novas notícias,
              elas aparecerão aqui.
            </small>

          </div>

        `;

      }

      return;

    }


    if(grid){

      grid.innerHTML =
        noticias
        .map(criarCard)
        .join("");

    }


    console.log(
      "AfricanMundo:",
      categoria,
      noticias.length,
      "notícias"
    );


  }catch(erro){

    console.error(
      "Erro ao carregar:",
      erro
    );


    if(grid){

      grid.innerHTML = `

        <div class="error-message">

          ❌ Ocorreu um erro ao
          carregar as notícias.

        </div>

      `;

    }

  }

}


/* =====================================
   MENU
===================================== */

function marcarMenuAtivo(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  const categoria =
    normalizarTexto(
      params.get("categoria") ||
      "noticias"
    );


  document
    .querySelectorAll(".nav a")
    .forEach(function(link){

      link.classList.remove(
        "active"
      );


      const href =
        link.getAttribute("href") ||
        "";


      try{

        const url =
          new URL(
            href,
            window.location.href
          );


        const valor =
          normalizarTexto(
            url.searchParams.get(
              "categoria"
            ) ||
            ""
          );


        if(valor === categoria){

          link.classList.add(
            "active"
          );

        }

      }catch(e){

        console.warn(
          "Link ignorado:",
          href
        );

      }

    });

}


/* =====================================
   INICIAR COM SEGURANÇA
===================================== */

function iniciarPagina(){

  marcarMenuAtivo();

  carregarCategoria();

}


/* =====================================
   DOM
===================================== */

if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    iniciarPagina
  );

}else{

  iniciarPagina();

}


/* =====================================
   ERRO GLOBAL
===================================== */

window.addEventListener(
  "error",
  function(event){

    console.error(
      "Erro AfricanMundo:",
      event.error ||
      event.message
    );

  }
);

</script>
