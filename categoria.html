<!doctype html>
<html lang="pt">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Categoria — AfricanMundo</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f4f4;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
    }


    /* =====================================
       CABEÇALHO
    ===================================== */

    header {
      background: #050505;
      color: #fff;
    }

    .header-main {
      max-width: 1200px;
      margin: auto;
      padding: 20px 15px;
    }

    .logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: -2px;
    }

    .logo span {
      color: #45c226;
    }

    .tagline {
      margin-top: 5px;
      color: #ddd;
      font-size: 13px;
    }


    /* =====================================
       MENU
    ===================================== */

    .nav {
      background: #151515;
      border-top: 1px solid #292929;
      border-bottom: 1px solid #292929;
    }

    .nav-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-inner::-webkit-scrollbar {
      display: none;
    }

    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 14px 18px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .nav a:hover {
      background: #45c226;
    }


    /* =====================================
       CONTEÚDO
    ===================================== */

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px 12px 50px;
    }


    /* =====================================
       PUBLICIDADE
    ===================================== */

    .advertising {
      min-height: 90px;
      margin-bottom: 20px;
      border-radius: 5px;
      background: linear-gradient(
        90deg,
        #101010,
        #182719,
        #101010
      );
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 15px;
    }

    .advertising strong {
      display: block;
      color: #45c226;
      font-size: 24px;
      margin-bottom: 5px;
    }


    /* =====================================
       TÍTULO DA CATEGORIA
    ===================================== */

    .category-header {
      background: #fff;
      border-left: 5px solid #45c226;
      border-bottom: 2px solid #ddd;
      padding: 12px 15px;
      margin-bottom: 18px;
    }

    .category-header h1 {
      margin: 0;
      font-size: 26px;
      text-transform: uppercase;
    }

    .category-header p {
      margin: 7px 0 0;
      color: #777;
      font-size: 13px;
    }


    /* =====================================
       GRELHA DE NOTÍCIAS
    ===================================== */

    .news-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }


    /* =====================================
       CARTÃO
    ===================================== */

    .news-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      overflow: hidden;
    }


    /* =====================================
       IMAGEM
    ===================================== */

    .news-card-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
      background: #222;
      cursor: pointer;
    }

    .news-card-image:hover {
      opacity: 0.94;
    }

    .news-card-placeholder {
      width: 100%;
      height: 200px;
      background: linear-gradient(
        135deg,
        #111,
        #345b29
      );
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 50px;
      color: #fff;
    }


    /* =====================================
       CONTEÚDO DO CARTÃO
    ===================================== */

    .news-card-content {
      padding: 14px;
    }

    .news-category {
      display: inline-block;
      color: #45a52c;
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    .news-card h2 {
      margin: 0 0 9px;
      font-size: 18px;
      line-height: 1.3;
    }

    .news-card h2 a {
      text-decoration: none;
    }

    .news-card h2 a:hover {
      color: #45a52c;
    }

    .news-card p {
      margin: 0;
      color: #555;
      font-size: 13px;
      line-height: 1.5;

      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }


    /* =====================================
       LER MAIS
    ===================================== */

    .read-more {
      display: inline-block;
      margin-top: 13px;
      padding: 9px 13px;
      background: #45c226;
      color: #fff;
      text-decoration: none;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 800;
    }

    .read-more:hover {
      background: #369c20;
    }


    /* =====================================
       CARREGAMENTO / ERRO
    ===================================== */

    .loading,
    .error-message,
    .empty-message {
      background: #fff;
      padding: 25px;
      border-radius: 5px;
      text-align: center;
      color: #777;
    }

    .error-message {
      color: #b00020;
      background: #fff1f1;
    }


    /* =====================================
       RESPONSIVO
    ===================================== */

    @media (max-width: 900px) {

      .news-grid {
        grid-template-columns: repeat(2, 1fr);
      }

    }


    @media (max-width: 600px) {

      .logo {
        font-size: 29px;
        text-align: center;
      }

      .tagline {
        text-align: center;
      }

      .nav a {
        padding: 13px 14px;
        font-size: 11px;
      }

      main {
        padding: 12px 8px 35px;
      }

      .category-header h1 {
        font-size: 22px;
      }

      .news-grid {
        grid-template-columns: 1fr;
      }

      .news-card-image,
      .news-card-placeholder {
        height: 210px;
      }

    }

  </style>

</head>

<body>


  <!-- =====================================
       CABEÇALHO
  ===================================== -->

  <header>

    <div class="header-main">

      <div class="logo">
        African<span>Mundo</span>
      </div>

      <div class="tagline">
        A informação que liga África ao mundo
      </div>

    </div>


    <nav class="nav">

      <div class="nav-inner">

        <a href="index.html">
          🏠 INÍCIO
        </a>

        <a href="categoria.html?categoria=noticias">
          NOTÍCIAS
        </a>

        <a href="categoria.html?categoria=futebol">
          ⚽ FUTEBOL
        </a>

        <a href="categoria.html?categoria=africa">
          🌍 ÁFRICA
        </a>

        <a href="categoria.html?categoria=mocambique">
          🇲🇿 MOÇAMBIQUE
        </a>

        <a href="categoria.html?categoria=negocios">
          💼 NEGÓCIOS
        </a>

        <a href="categoria.html?categoria=entretenimento">
          🎬 ENTRETENIMENTO
        </a>

        <a href="categoria.html?categoria=desporto">
          🏆 DESPORTO
        </a>

      </div>

    </nav>

  </header>


  <!-- =====================================
       CONTEÚDO
  ===================================== -->

  <main>


    <div class="advertising">

      <div>

        <strong>
          ANUNCIE AQUI
        </strong>

        A sua marca em destaque em todo o continente africano.

      </div>

    </div>


    <div class="category-header">

      <h1 id="categoryTitle">
        Notícias
      </h1>

      <p id="categoryDescription">
        Notícias do AfricanMundo
      </p>

    </div>


    <div
      id="newsGrid"
      class="news-grid"
    >

      <p class="loading">
        🔄 A carregar notícias...
      </p>

    </div>


        </main>
        <script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
  "https://sonzwfhepjfvzltuxxne.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_aGutLscN7IAKVqH9onnnkw_22Tl8PZf";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================
   SEGURANÇA
===================================== */

function esc(valor) {

  return String(valor ?? "").replace(
    /[&<>"']/g,
    function(m) {

      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[m];

    }
  );

}


/* =====================================
   NORMALIZAR CATEGORIA
===================================== */

function normalizarCategoria(valor) {

  return String(valor || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();

}


/* =====================================
   NOME DA CATEGORIA
===================================== */

function nomeBonitoCategoria(
  categoria
) {

  const nomes = {

    noticias:
      "📰 Notícias",

    futebol:
      "⚽ Futebol",

    africa:
      "🌍 África",

    mocambique:
      "🇲🇿 Moçambique",

    negocios:
      "💼 Negócios",

    entretenimento:
      "🎬 Entretenimento",

    desporto:
      "🏆 Desporto"

  };


  return (
    nomes[categoria] ||
    "📰 Notícias"
  );

}


/* =====================================
   DATA
===================================== */

function formatarData(data) {

  if (!data) {
    return "";
  }


  const d =
    new Date(data);


  if (
    isNaN(
      d.getTime()
    )
  ) {

    return "";

  }


  return d.toLocaleString(
    "pt-MZ",
    {
      day: "2-digit",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }
  );

}


/* =====================================
   OBTER IMAGEM
===================================== */

function obterImagem(
  noticia
) {

  return String(

    noticia.imagem ??
    noticia.Imagem ??
    noticia.image ??
    noticia.imagem_url ??
    noticia.image_url ??
    ""

  ).trim();

}


/* =====================================
   OBTER TÍTULO
===================================== */

function obterTitulo(
  noticia
) {

  return (

    noticia.titulo ||
    noticia.title ||
    noticia.nome ||
    "Sem título"

  );

}


/* =====================================
   OBTER TEXTO
===================================== */

function obterTexto(
  noticia
) {

  return (

    noticia.texto ||
    noticia.body ||
    noticia.conteudo ||
    noticia.content ||
    ""

  );

}


/* =====================================
   CRIAR CARTÃO
===================================== */

function criarCard(
  noticia
) {

  const id =
    noticia.id;


  const titulo =
    obterTitulo(
      noticia
    );


  const texto =
    obterTexto(
      noticia
    );


  const categoria =
    noticia.categoria ||
    noticia.category ||
    "Notícias";


  const imagem =
    obterImagem(
      noticia
    );


  const data =
    formatarData(
      noticia.data
    );


  const link =
    "noticia.html?id=" +
    encodeURIComponent(
      id
    );


  /* =================================
     IMAGEM
  ================================= */

  let imagemHTML = `

    <a
      href="${link}"
      aria-label="Abrir notícia: ${esc(titulo)}"
    >

      <div class="news-card-placeholder">
        🌍
      </div>

    </a>

  `;


  if (
    imagem !== ""
  ) {

    imagemHTML = `

      <a
        href="${link}"
        aria-label="Abrir notícia: ${esc(titulo)}"
      >

        <img
          class="news-card-image"
          src="${esc(imagem)}"
          alt="${esc(titulo)}"
          loading="lazy"

          onerror="
            this.style.display='none';
            this.nextElementSibling.style.display='flex';
          "
        >

        <div
          class="news-card-placeholder"
          style="display:none;"
        >
          🌍
        </div>

      </a>

    `;

  }


  /* =================================
     CARTÃO COMPLETO
  ================================= */

  return `

    <article class="news-card">


      ${imagemHTML}


      <div class="news-card-content">


        <div class="news-category">

          ${esc(categoria)}

        </div>


        <h2>

          <a
            href="${link}"
          >

            ${esc(titulo)}

          </a>

        </h2>


        <a
          href="${link}"
          style="
            text-decoration:none;
            color:inherit;
            display:block;
          "
        >

          <p>

            ${esc(texto)}

          </p>

        </a>


        ${
          data

            ? `

              <div
                style="
                  margin-top:8px;
                  color:#777;
                  font-size:11px;
                "
              >

                📅 ${esc(data)}

              </div>

            `

            : ""
        }


        <a
          href="${link}"
          class="read-more"
        >

          📖 Ler notícia completa

        </a>


      </div>

    </article>

  `;

}


/* =====================================
   CARREGAR CATEGORIA
===================================== */

async function carregarCategoria() {

  const grid =
    document.getElementById(
      "newsGrid"
    );


  const titulo =
    document.getElementById(
      "categoryTitle"
    );


  const descricao =
    document.getElementById(
      "categoryDescription"
    );


  /* =================================
     PEGAR CATEGORIA DA URL
  ================================= */

  const url =
    new URL(
      window.location.href
    );


  let categoriaURL =
    url.searchParams.get(
      "categoria"
    );


  categoriaURL =
    normalizarCategoria(
      categoriaURL
    );


  if (
    !categoriaURL
  ) {

    categoriaURL =
      "noticias";

  }


  console.log(
    "Categoria selecionada:",
    categoriaURL
  );


  /* =================================
     MOSTRAR NOME
  ================================= */

  if (titulo) {

    titulo.textContent =
      nomeBonitoCategoria(
        categoriaURL
      );

  }


  if (descricao) {

    descricao.textContent =
      "Notícias de " +
      nomeBonitoCategoria(
        categoriaURL
      );

  }


  if (grid) {

    grid.innerHTML = `

      <p
        class="loading"
        style="
          grid-column:1/-1;
        "
      >

        🔄 A carregar notícias...

      </p>

    `;

  }


  try {

    /* ===============================
       BUSCAR NOTÍCIAS
    =============================== */

    const resultado =
      await supabaseClient
        .from("noticias")
        .select("*")
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (
      resultado.error
    ) {

      console.error(
        "Erro Supabase:",
        resultado.error
      );


      if (grid) {

        grid.innerHTML = `

          <div
            class="error-message"
            style="
              grid-column:1/-1;
            "
          >

            ❌ Não foi possível carregar as notícias.

            <br><br>

            <small>

              ${esc(
                resultado.error.message
              )}

            </small>

          </div>

        `;

      }

      return;

    }


    const todasNoticias =
      Array.isArray(
        resultado.data
      )
        ? resultado.data
        : [];


    console.log(
      "Todas as notícias:",
      todasNoticias
    );


    /* ===============================
       FILTRAR CATEGORIA
    =============================== */

    let noticias;


    if (
      categoriaURL ===
      "noticias"
    ) {

      /*
        "Notícias" mostra todas
        as notícias publicadas.
      */

      noticias =
        todasNoticias;

    }

    else {

      noticias =
        todasNoticias.filter(
          function(noticia) {

            const categoria =
              normalizarCategoria(

                noticia.categoria ??
                noticia.category ??
                noticia.cat ??
                ""

              );


            return (
              categoria ===
              categoriaURL
            );

          }
        );

    }


    console.log(
      "Notícias da categoria:",
      noticias
    );


    /* ===============================
       NENHUMA NOTÍCIA
    =============================== */

    if (
      noticias.length === 0
    ) {

      if (grid) {

        grid.innerHTML = `

          <div
            class="empty-message"
            style="
              grid-column:1/-1;
            "
          >

            📰 Ainda não existem notícias nesta categoria.

          </div>

        `;

      }

      return;

    }


    /* ===============================
       MOSTRAR CARTÕES
    =============================== */

    if (grid) {

      grid.innerHTML =
        noticias
          .map(
            function(noticia) {

              return criarCard(
                noticia
              );

            }
          )
          .join("");

    }

  }


  catch (erro) {

    console.error(
      "Erro inesperado:",
      erro
    );


    if (grid) {

      grid.innerHTML = `

        <div
          class="error-message"
          style="
            grid-column:1/-1;
          "
        >

          ❌ Ocorreu um erro ao carregar esta categoria.

          <br><br>

          <small>

            ${esc(
              erro.message ||
              erro
            )}

          </small>

        </div>

      `;

    }

  }

}
          <script>

/* =====================================
   INICIAR
===================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    carregarCategoria();

  }
);

</script>

</body>
</html>
